allowBuilds:
  esbuild: true
  sharp: true
minimumReleaseAgeExclude:
  - "@xberg-io/docs-theme@0.4.0 || 0.4.1 || 0.4.2"

overrides:
  # Both reach us only through Astro/Starlight internals, whose own ranges still
  # resolve the affected releases. js-yaml >=4.3.1 clears the quadratic-CPU
  # !!omap advisory; nanoid >=3.3.17 clears the infinite-loop advisory that
  # arrives via postcss. This workspace is NOT covered by the root
  # pnpm-workspace.yaml, so the root overrides do not reach it. ~keep
  js-yaml: "^4.3.1"
  nanoid: "^3.3.17"
