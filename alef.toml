# ~keep Without this key `alef test --e2e` skipped kotlin_android entirely and CI at
# ~keep ci-e2e.yaml was its only runner. `gradle test` is a host-JVM run needing no emulator:
# ~keep build.gradle.kts stages libts_pack_jni via buildHostJni/copyHostJni, and e2e/kotlin_android
# ~keep has 9 unit tests under src/test/. No package-level `command` is set on purpose —
