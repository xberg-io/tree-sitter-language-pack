[crates.wasm]
crate_dir = "crates/ts-pack-core-wasm"
# ~keep Empty since tree-sitter 0.27. 0.27 ships its own wasm libc under `src/wasm-stdlib/`
# and compiles it into `lib.o` for every `wasm32-unknown-*` target, so the runtime rlib now
# defines all ten of these strongly. Emitting our own `#[no_mangle]` copies makes the two
# collide at link time ("duplicate symbol: memchr"). The collision only appears when rustc
# happens to emit the shim module into a codegen unit -- a full-LTO local build elides the
# unreferenced private module and links clean -- so this reproduces on CI's
# `CARGO_PROFILE_RELEASE_LTO=false` + 16-codegen-unit build and hides locally.
env_shims = []
features = ["serde", "config", "dynamic-loading"]
# ~keep The download family is intentionally absent from the wasm target: it sits behind
# ts-pack-core-wasm's opt-in `download` feature, which the doc-snippet and e2e sessions do
# not enable, so `[crates.include].functions` would otherwise emit snippets importing
# symbols the package never exports. `prefetch` is NOT excluded — it is a real free
# function (`crates/ts-pack-core-wasm/src/lib.rs:3234`). `cache_dir` IS excluded: it exists
# only as a `WasmPackConfig` getter (`lib.rs:1723`, js_name "cacheDir"), never as a
# module-level export, so a snippet importing it from the package cannot resolve.
exclude_functions = [
  "init",
  "configure",
  "download",
  "download_all",
  "download_group",
  "manifest_languages",
  "manifest_groups",
  "downloaded_languages",
  "clean_cache",
  "cache_dir",
]
# ~keep `languages` drives alef's e2e skip logic only (unsupported languages get
# ~keep `.skip("not in WASM's static language set")`); it does NOT control what the wasm
# ~keep build compiles. It must mirror the `TSLP_LANGUAGES` set the wasm *e2e* build uses,
# ~keep which is the identical 31-language string at all four wasm build sites:
# ~keep `[crates.test.wasm].before` below, `.github/workflows/ci-e2e.yaml` (build-wasm),
# ~keep `.github/workflows/ci.yaml`, and `.github/workflows/publish.yaml`.
# ~keep Do NOT mirror `WASM_DEFAULT_LANGUAGES` in `crates/ts-pack-core/build.rs`: that
# ~keep constant is only build.rs's fallback for a wasm32 build that leaves `TSLP_LANGUAGES`
# ~keep unset (the `.task/wasm.yml` path), and every e2e/CI wasm build sets it explicitly, so
# ~keep the constant never applies there. Mirroring it is what broke this list before —
# ~keep it carried 48 languages against a 31-language build, so 18 grammars
# ~keep (clojure cmake dart graphql groovy hcl ini julia make nix objc ocaml powershell
# ~keep proto r regex scss xml) were emitted as live tests and failed with
# ~keep `Language 'X' not found`. Keep the four sites in sync by hand; TOML cannot derive
# ~keep this list, and deriving it in the shell is unsafe (build.rs treats an empty
# ~keep `TSLP_LANGUAGES` as a valid zero-grammar selection, so a failed derivation would
# ~keep silently produce a wasm build with no grammars at all).
languages = [
  "python",
  "javascript",
  "typescript",
  "tsx",
  "rust",
  "go",
  "java",
  "c",
  "cpp",
  "csharp",
  "ruby",
  "php",
  "html",
  "css",
  "json",
  "yaml",
  "toml",
  "markdown",
  "bash",
  "sql",
  "lua",
  "scala",
  "kotlin",
  "swift",
  "dockerfile",
  "vue",
  "svelte",
  "elixir",
  "erlang",
  "haskell",
  "zig",
]

