function = "Prefetch"
result_is_pointer = false

# `returns_void = true` calls surface in C as a bare `int32_t` status code, but the C e2e
# generator only treats `result_is_bytes`/`result_is_simple`/`result_is_json_struct` as
# "no named result type", not `returns_void`. Without this the call resolves to
# Unresolvable and warns on every fixture. The scalar declaration is accurate here. ~keep
[crates.e2e.calls.prefetch.overrides.c]
function = "ts_pack_prefetch"
raw_c_result_type = "int32_t"
result_is_simple = true

[crates.e2e.calls.cache_dir]
function = "cache_dir"
module = "tree_sitter_language_pack"
result_var = "result"
returns_result = true
result_is_simple = true
args = []

[crates.e2e.calls.cache_dir.overrides.go]
result_is_pointer = false

[crates.e2e.calls.cache_dir.overrides.c]
function = "ts_pack_cache_dir"
raw_c_result_type = "char*"

