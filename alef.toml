[workspace]
alef_version = "0.85.15"
languages = [
  "python",
  "node",
  "ruby",
  "php",
  "ffi",
  "go",
  "java",
  "csharp",
  "elixir",
  "wasm",
  "dart",
  "kotlin_android",
  "swift",
  "zig",
  "jni",
]

# ~keep These five are create-once seeds whose alef template has since diverged from the copy we
# maintain by hand. `alef verify` reports each under "frozen path(s) DRIFTED" every run, and
# `task version:sync` greps that heading and treats a hit as fatal -- so leaving them undeclared
# blocks every release. In all five cases the on-disk copy is the correct one and adopting the
# template would be a regression, which is why this is `user_owned` and not `alef adopt`:
#
#   test_apps/dart/pubspec.yaml, e2e/dart/pubspec.yaml
#     The template raises `sdk: ">=3.11.0"` to `">=3.13.0"` and moves `test`/`http` to ^1.31.2 /
#     ^1.6.0. Raising the Dart SDK floor is a breaking change that does not belong in a patch
#     release -- the same deliberate hold recorded under "Note on the Dart `freezed` pin" in the
#     1.15.11 CHANGELOG entry, for the same reason. Revisit on a minor or major bump.
#
#   test_apps/kotlin_android/build.gradle.kts, e2e/kotlin_android/build.gradle.kts
#     The template proposes AGP 9.4.0 over our 9.2.1, and downgrades the precision of the
#     jackson-annotations pin from `2.22.2` to `2.22` while leaving its jackson-databind and
#     jackson-datatype-jdk8 siblings at `2.22.2`. Our copy keeps all three exact and in lockstep.
#
#   test_apps/zig/build.zig.zon
#     Only differs pre-publish: alef omits the five `.hash` lines because the v1.16.2 release
#     assets do not exist yet (it logs "zig hash skipped -- ... regen after release"), while our
#     copy still carries the v1.16.1 hashes. REVISIT THIS ENTRY AFTER v1.16.2 PUBLISHES -- unlike
#     the other four this one is expected to self-resolve, and once the hashes regenerate against
#     a real release the declaration should come back out rather than mask genuine drift.
[workspace.ownership]
user_owned = [
  "e2e/dart/pubspec.yaml",
  "e2e/kotlin_android/build.gradle.kts",
  "test_apps/dart/pubspec.yaml",
  "test_apps/kotlin_android/build.gradle.kts",
  "test_apps/zig/build.zig.zon",
]

[workspace.docs]
reference_output = "docs-site/src/content/docs/reference"

[workspace.docs.cli]
sources = ["crates/ts-pack-cli/src/main.rs"]

[workspace.docs.mcp]
sources = ["crates/ts-pack-cli/src/commands/mcp.rs"]


[workspace.docs.skills]
template_dir = "templates/docs/skills"
outputs = [".codex/skills", ".agents/skills", ".github/skills", ".claude/skills"]

# docs-site/src/snippets/cli/*.md (download.md, quickstart.md, process.md) are deliberately
# hand-written and outside this `dirs` list, so `alef snippets check` never validates them. The
# CLI is not an alef binding target -- no emitter produces shell invocations -- so there is no
# generated/cli directory to migrate them into. quickstart.mdx documents the same thing next to
# its imports. This is permanent until alef gains a CLI/shell snippet recipe; if that ever lands,
# migrate these three by hand and delete them, the same way kotlin-android's stand-ins were
# migrated once its classpath defect was fixed. ~keep
[workspace.docs.snippets]
dirs = ["docs-site/src/snippets/generated"]
docs_dirs = ["docs-site/src/content/docs/reference"]
validation_level = "compile"
# This bounds each session's `before` hook as well as the validation commands, and the hooks
# here build native artifacts (`swift build`, a cargo release build of the FFI). 120s was a
# validation-shaped budget; a cold cargo build does not fit in it and would be reported as a
# session-preparation timeout rather than a build. ~keep
timeout_secs = 900
strict = true
deny_unclassified = true

[workspace.docs.snippets.sessions.python]
cwd = "packages/python"
manifest = "packages/python/pyproject.toml"

[workspace.docs.snippets.sessions.node]
cwd = "crates/ts-pack-core-node"
manifest = "crates/ts-pack-core-node/package.json"

# The TypeScript validator resolves `@xberg-io/tree-sitter-language-pack-wasm` through the
# manifest's `types` field (pkg/nodejs/ts_pack_core_wasm.d.ts), not through node_modules. That
# file only exists after a wasm-pack build, and `pkg/` is gitignored, so without this hook every
# wasm snippet is `Unavailable` with "Cannot find module ..." (511 of them in CI run
# 32520643605). See scripts/stage_wasm_types.sh for why the language selection it builds with is
# tiny and deliberate. ~keep
[workspace.docs.snippets.sessions.wasm]
cwd = "crates/ts-pack-core-wasm"
manifest = "crates/ts-pack-core-wasm/package.json"
before = ["bash ../../scripts/stage_wasm_types.sh"]

[workspace.docs.snippets.sessions.ruby]
cwd = "packages/ruby"

[workspace.docs.snippets.sessions.php]
cwd = "."
manifest = "composer.json"

# Go snippets validate at `compile` level, which is `go build ./...` — a real cgo link against
# `.lib/<platform>/libts_pack_core_ffi`. `.lib/` is gitignored, so without this hook every Go
# snippet fails with `cannot find -lts_pack_core_ffi` and the failure describes the environment,
# not the snippet (521 of them in CI run 32520643605). ~keep
[workspace.docs.snippets.sessions.go]
cwd = "packages/go"
manifest = "packages/go/go.mod"
before = ["bash ../../scripts/stage_go_native.sh"]

# The Java validator builds its classpath from `<pom dir>/target/{classes,test-classes,
# dependency/*.jar}`, none of which exist in a fresh checkout -- so without these hooks every
# Java snippet is `Unavailable`, which `strict` fails exactly like a `Fail` (521 of them in CI
# run 32520643605). `dependency:copy-dependencies` is not redundant with `compile`: snippets
# that name a jtreesitter type need that jar on the classpath, not just this package's classes.
# ~keep
[workspace.docs.snippets.sessions.java]
cwd = "packages/java"
manifest = "packages/java/pom.xml"
before = ["mvn -B -q compile", "mvn -B -q dependency:copy-dependencies"]

[workspace.docs.snippets.sessions.csharp]
cwd = "packages/csharp"
manifest = "packages/csharp/TreeSitterLanguagePack/TreeSitterLanguagePack.csproj"

[workspace.docs.snippets.sessions.elixir]
cwd = "packages/elixir"
manifest = "packages/elixir/mix.exs"

# The rust validator `cargo check`s a scratch crate with a path dependency on ts-pack-core, so it
# runs that crate's build.rs. `parsers/` is gitignored and the validate job never downloads the
# `language-parsers` artifact, so build.rs would clone every upstream grammar or fetch
# `parser-sources-<version>.tar.zst` — which does not exist yet on a release commit, panicking on
# a 404 and failing all 521 rust snippets. TSLP_LANGUAGES is unset here, so `selected` is empty
# and not one grammar is compiled into this check either way: skipping the sources changes
# nothing it validates and drops a per-run download that only ever worked between releases. ~keep
[workspace.docs.snippets.sessions.rust]
cwd = "crates/ts-pack-core"
manifest = "crates/ts-pack-core/Cargo.toml"
env = { TSLP_OFFLINE = "1" }

# See scripts/stage_kotlin_android_sdk.sh for why this hook writes local.properties itself
# rather than relying on the CI runner's ANDROID_HOME. ~keep
[workspace.docs.snippets.sessions.kotlin_android]
cwd = "packages/kotlin-android"
manifest = "packages/kotlin-android/build.gradle.kts"
before = ["bash ../../scripts/stage_kotlin_android_sdk.sh"]

[workspace.docs.snippets.sessions.swift]
cwd = "packages/swift"
manifest = "packages/swift/Package.swift"
before = ["swift build"]

[workspace.docs.snippets.sessions.dart]
cwd = "packages/dart"
manifest = "packages/dart/pubspec.yaml"

# Compile-level zig validation links a real executable against the binding, not just type-checks
# it (see scripts/stage_zig_ffi.sh), so it needs the same FFI artifact `[crates.test.zig]` builds
# before testing. Without it every zig snippet was `Unavailable` with "zig toolchain not found"
# before setup-zig closed that gap, and would otherwise fail to link next. ~keep
[workspace.docs.snippets.sessions.zig]
cwd = "packages/zig"
manifest = "packages/zig/build.zig"
before = ["bash ../../scripts/stage_zig_ffi.sh"]
env = { ZIG_GLOBAL_CACHE_DIR = ".zig-global-cache", ZIG_LOCAL_CACHE_DIR = ".zig-cache" }

# Sessions are keyed by snippet target; C snippets declare `target = "ffi"`. Without
# this block the C validator takes its session-less path, which compiles a bare temp
# file with no `-I` at all, so every `#include "ts_pack.h"` fails to resolve.
[workspace.docs.snippets.sessions.ffi]
cwd = "crates/ts-pack-core-ffi"
include_paths = ["crates/ts-pack-core-ffi/include"]

[workspace.opaque_types]
Language = "tree_sitter_language_pack::Language"

[workspace.dto]
python = "dataclass"
python_output = "typed-dict"
node = "interface"
ruby = "struct"
php = "readonly-class"
elixir = "struct"
go = "struct"
java = "record"
csharp = "record"

[workspace.sync]
extra_paths = [
  "crates/ts-pack-core-node/package.json",
  "crates/ts-pack-core-node/npm/*/package.json",
  "crates/ts-pack-core-py/src/pyproject.toml",
  "packages/ruby/ext/ts_pack_core_rb/native/Cargo.toml",
]

