[workspace.poly]
exclude = [
  "**/pkg/**",
  "**/*.min.js",
  "docs-site/src/snippets/**",
  "**/third_party/**",
  "**/*.patch",
  "**/frb_generated.rs",
  # ai-rulez-generated coding-agent plugin outputs: owned by `ai-rulez generate
  # --plugin`, never reformatted by poly (would break BLAKE3 provenance). Sources
  # under plugin/.ai-rulez/ + plugin/scripts/ stay poly-managed. ~keep
  "plugin/.claude-plugin/**",
  "plugin/.codex-plugin/**",
  "plugin/.cursor-plugin/**",
  "plugin/.factory-plugin/**",
  "plugin/.opencode/**",
  "plugin/.hermes/**",
  "plugin/skills/**",
  "plugin/.mcp.json",
  "plugin/gemini-extension.json",
  "plugin/kimi.plugin.json",
  "plugin/package.json",
  "plugin/.ai-rulez-generated.json",
  ".claude-plugin/marketplace.json",
  ".agents/plugins/marketplace.json",
  ".ai-rulez-generated.json",
  "templates/**",
  "Package.swift",
  "packages/**",
  "e2e/**",
  "test_apps/**",
  "**/*_bridge_generated/**",
  "crates/*-ffi/**",
  "crates/*-jni/**",
  "crates/*-node/**",
  "crates/*-php/**",
  "crates/*-py/**",
  "crates/*-ruby/**",
  "crates/*-wasm/**",
  "crates/*-ffi/include/*.h",
  "packages/go/include/*.h",
]

[workspace.poly.uncomment]
enabled = true
remove-todos = false
remove-fixme = false
remove-docs = false
use-default-ignores = true
preserve-patterns = [
  "~keep",
  # clang-format regenerates `} // namespace X` (FixNamespaceComments, on by default in
  # the LLVM style alef scaffolds), so the uncomment pass must not fight it.
  "namespace",
  "SAFETY",
  "HACK",
  "WORKAROUND",
  "NOTE",
  "Copyright",
  "Licensed",
  "License",
  "SPDX",
  "Apache",
  "MIT",
  "WITHOUT WARRANTIES",
  "limitations under the License",
  "copyright",
  "licensed",
  "license",
  "apache",
  "you may not use this file except in compliance",
  "You may obtain a copy of the License",
  "you may obtain a copy of the license",
  "http://www.apache.org/licenses/LICENSE-2.0",
  "http://www.apache.org/licenses/license-2.0",
  "Unless required by applicable law",
  "unless required by applicable law",
  "distributed under the License",
  "distributed under the license",
  "AS IS",
  "as is",
  "without warranties",
  "specific language governing permissions",
  "limitations under the license",
]

[[workspace.poly.hooks-sources]]
id = "ai-rulez"
git = "https://github.com/Goldziher/ai-rulez.git"
revision = "v4.9.3"
hooks = ["ai-rulez-validate"]

[workspace.poly.per-file-ignores]
# Alef-generated config files. Both grow with the size of the surface alef manages and
# with the quality-debt baseline below; a line count on generated config is not a
# maintainability signal. ~keep
"poly.toml" = ["file-too-long"]
".alef-toml-merge-provenance.toml" = ["file-too-long"]
# --- quality-debt baseline (generated) ---
# 34 size/complexity findings across 27 files that predate these
# metrics. Listed per file rather than switching the rules off, so the metrics still
# fire on every file NOT listed here -- new code stays covered, and each path below is
# one discrete unit of work.
# TODO(xberg-io/tree-sitter-language-pack#184): pay this down file by file and delete each entry as it goes green.
# Do not add new paths here without a very good reason. ~keep
".alef-ownership.toml" = ["file-too-long"]
".github/workflows/ci-e2e.yaml" = ["file-too-long"]
".github/workflows/ci.yaml" = ["file-too-long"]
".github/workflows/publish.yaml" = ["file-too-long"]
"CHANGELOG.md" = ["file-too-long"]
"alef.toml" = ["file-too-long"]
"crates/ts-pack-cli/src/commands/mcp.rs" = ["file-too-long"]
"crates/ts-pack-cli/src/main.rs" = ["cyclomatic-complexity", "function-too-long"]
