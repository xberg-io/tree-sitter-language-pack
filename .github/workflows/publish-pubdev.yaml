name: Publish pub.dev

# pub.dev OIDC trusted publishing rejects tokens originating from `release`
# events; only `push` and `workflow_dispatch` are accepted. publish.yaml runs on
# `release`, so it cannot publish to pub.dev itself — its `trigger-pubdev` job
# dispatches this workflow with its own run id, and this workflow pulls the
# already-built `dart-package-assembled` artifact out of that run. `trigger-pubdev`
# then waits on this run and adopts its conclusion, so a failure here fails the
# release. Do not "simplify" this back into publish.yaml.
#
# One-time setup: on pub.dev → tree_sitter_language_pack → Admin → Automated
# publishing, set the workflow path to `.github/workflows/publish-pubdev.yaml`.
#
# This comment was silently dropped once by the uncomment lint pass; it carries a
# non-obvious external constraint, so it is marked. ~keep

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "GitHub Actions run ID of publish.yaml that produced the dart-package-assembled artifact"
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  publish-pub:
    name: Publish pub.dev
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dart-package-assembled
          path: packages/dart
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # download-artifact does not fail when the artifact is empty, and an empty
      # package-dir makes `dart pub publish` fail with an opaque error. Assert the
      # two files the publish actually needs. ~keep
      - name: Verify downloaded package
        run: |
          set -euo pipefail
          test -f packages/dart/pubspec.yaml \
            || { echo "::error::packages/dart/pubspec.yaml missing — artifact 'dart-package-assembled' from run ${{ inputs.run_id }} is empty or wrong."; exit 1; }
          if ! find packages/dart/lib/src/native -type f \
              \( -name '*.so' -o -name '*.dylib' -o -name '*.dll' \) -print -quit | grep -q .; then
            echo "::error::no native libraries under packages/dart/lib/src/native — refusing to publish a Dart package that cannot load."
            exit 1
          fi

      - uses: xberg-io/actions/publish-pub@v1
        with:
          package-dir: packages/dart
