name: CI E2E java

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: short
  BUILD_PROFILE: ci

jobs:
  test-java:
    name: Test Java
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT_ROOT: ${{ github.workspace }}
      TSLP_LANGUAGES: "python,rust,javascript,typescript,go,html,css,json,gherkin"
      TSLP_LINK_MODE: static
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Wire e2e manifest
        uses: ./.github/actions/wire-e2e-manifest
        with:
          platform-label: linux-x86_64
          artifact-name: e2e-bundles-linux-x86_64

      - name: Download parsers
        uses: actions/download-artifact@v8
        with:
          name: language-parsers
          path: parsers

      - name: Download FFI artifacts
        uses: actions/download-artifact@v8
        with:
          name: ffi-ubuntu-latest
          path: ffi-artifacts

      - name: Restore FFI to expected paths
        run: |
          mkdir -p target/release
          cp ffi-artifacts/target/release/libts_pack_core_ffi.* target/release/ 2>/dev/null || true
          mkdir -p crates/ts-pack-core-ffi/include
          cp -r ffi-artifacts/crates/ts-pack-core-ffi/include/* crates/ts-pack-core-ffi/include/ 2>/dev/null || true

      # ~keep rust is a mise lock gap (rustup script install); rust-toolchain.toml pins it.
      - name: Setup Rust (for libtree-sitter build)
        uses: xberg-io/actions/setup-rust@v1
        with:
          components: ""
          use-sccache: "false"
          install-llvm-cov: "false"

      - name: Build libtree-sitter runtime for jtreesitter
        run: python scripts/ci/build_libtree_sitter.py

      - name: Setup Java
        uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: java

      - name: Set library paths for JNI
        shell: bash
        run: echo "LD_LIBRARY_PATH=${{ github.workspace }}/target/release:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Run Java unit tests
        working-directory: packages/java
        run: mvn test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: java-unit-reports
          path: packages/java/target/surefire-reports
          if-no-files-found: ignore
          retention-days: 7

      # ~keep rust is a mise lock gap (rustup script install); rust-toolchain.toml pins it.
      - name: Setup Rust (for alef e2e generate)
        uses: xberg-io/actions/setup-rust@v1
        with:
          components: ""
          use-sccache: "false"
          install-llvm-cov: "false"

      - name: Build Java jar
        working-directory: packages/java
        run: mvn package -DskipTests

      - name: Run Java E2E tests
        working-directory: e2e/java
        run: mvn test
        env:
          MAVEN_OPTS: "--enable-native-access=ALL-UNNAMED -Dsun.misc.unsafe.memory.access=allow"

      - name: Upload E2E test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: java-e2e-reports
          path: e2e/java/target/surefire-reports
          if-no-files-found: ignore
          retention-days: 7
