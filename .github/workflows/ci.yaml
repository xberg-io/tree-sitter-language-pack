        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Download e2e parser bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-bundles-${{ matrix.os == 'ubuntu-latest' && 'linux-x86_64' || 'macos-arm64' }}
          path: e2e-bundles

      - name: Wire e2e manifest
        shell: bash
        env:
          PLATFORM_LABEL: ${{ matrix.os == 'ubuntu-latest' && 'linux-x86_64' || 'macos-arm64' }}
          BUNDLE_DIR: ${{ github.workspace }}/e2e-bundles
        run: ./scripts/ci/prepare_e2e_manifest.sh

      - name: Download parsers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: language-parsers
          path: parsers

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          components: ""
          use-sccache: "true"
          cache-key-prefix: csharp-${{ matrix.os }}
          install-llvm-cov: "false"

      - name: Install Task
        uses: xberg-io/actions/install-task@v1

      - name: Build FFI library
        run: cargo build --locked -p ts-pack-core-ffi --release

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set library paths for .NET
        shell: bash
