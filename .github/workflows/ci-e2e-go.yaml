name: CI E2E go

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: short
  BUILD_PROFILE: ci

jobs:
  test-go:
    name: Test Go
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT_ROOT: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Wire e2e manifest
        uses: ./.github/actions/wire-e2e-manifest
        with:
          platform-label: linux-x86_64
          artifact-name: e2e-bundles-linux-x86_64

      - name: Download parsers
        uses: actions/download-artifact@v8
        with:
          name: language-parsers
          path: parsers

      - name: Download FFI artifacts
        uses: actions/download-artifact@v8
        with:
          name: ffi-ubuntu-latest
          path: ffi-artifacts

      - name: Restore FFI to expected paths
        run: |
          mkdir -p target/release
          cp ffi-artifacts/target/release/libts_pack_core_ffi.* target/release/ 2>/dev/null || true
          mkdir -p crates/ts-pack-core-ffi/include
          cp -r ffi-artifacts/crates/ts-pack-core-ffi/include/* crates/ts-pack-core-ffi/include/ 2>/dev/null || true
          mkdir -p crates/ts-pack-core-ffi/target/release
          cp target/release/libts_pack_core_ffi.* crates/ts-pack-core-ffi/target/release/ 2>/dev/null || true
          # binding.go's cgo LDFLAGS search .lib/linux-x86_64, not the Go-arch
          # spelling .lib/linux-amd64. Restoring into the latter left the link
          # path empty on every Linux runner.
          mkdir -p packages/go/.lib/linux-x86_64 packages/go/include
          cp target/release/libts_pack_core_ffi.* packages/go/.lib/linux-x86_64/ 2>/dev/null || true
          cp crates/ts-pack-core-ffi/include/ts_pack.h packages/go/include/ 2>/dev/null || true

      - name: Verify go.mod placement
        run: |
          test -f packages/go/go.mod || (echo "ERROR: go.mod missing at packages/go/go.mod" && exit 1)
          grep -q 'module github.com/xberg-io/tree-sitter-language-pack/packages/go$' packages/go/go.mod \
            || (echo "ERROR: module path in go.mod is wrong" && exit 1)

      - name: Setup Go
        uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: go

      - name: Run Go tests
        run: mise run go:test

      - name: Run Go lint
        run: mise run go:lint

      - name: Check Go formatting
        run: mise run go:format:check

      # ~keep rust is a mise lock gap (rustup script install); rust-toolchain.toml pins it.
      - name: Setup Rust (for e2e generate)
        uses: xberg-io/actions/setup-rust@v1
        with:
          components: ""
          use-sccache: "false"
          install-llvm-cov: "false"

      - name: Install alef
        uses: xberg-io/actions/install-alef@v1

      - name: Install poly
        uses: Goldziher/poly@v0
        with:
          version: "0.31.2"

      - name: Generate Go E2E tests
        run: mise run go:e2e:generate

      - name: Run Go E2E tests
        run: mise run go:e2e:test
