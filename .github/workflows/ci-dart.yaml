name: CI Dart

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/ts-pack-core/**"
      - "packages/dart/**"
      - ".github/workflows/ci-dart.yaml"
  workflow_dispatch:

concurrency:
  group: ci-dart-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: short
  TSLP_LINK_MODE: static
  TSLP_LANGUAGES: mojo,nim,norg
  TSLP_OFFLINE: "1"

permissions:
  contents: read

jobs:
  dart-test:
    name: Dart build + test (${{ matrix.os }})
    if: github.repository == 'xberg-io/tree-sitter-language-pack' && github.actor != 'dependabot[bot]'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    steps:
      - uses: actions/checkout@v7
      - name: Setup parser generator
        uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: node tree-sitter
      - name: Setup Python environment
        uses: xberg-io/actions/setup-python-env@v1
        with:
          python-version: "3.14"
          install-command: "uv sync --no-install-project --no-install-workspace"
      - name: Prepare parser sources
        run: |
          tree_sitter_cli=$(mise which tree-sitter)
          PATH="$(dirname "$tree_sitter_cli"):$PATH" uv run --script scripts/clone_vendors.py
      # ~keep rust is a mise lock gap (rustup script install); rust-toolchain.toml pins it.
      - uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: ci-dart-${{ matrix.os }}
      # ~keep Dart/Flutter stays on its setup action (org toolchain policy).
      - uses: dart-lang/setup-dart@v1
      - name: Install flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked
      - name: Resolve Dart deps
        working-directory: packages/dart
        run: dart pub get
      - name: Run flutter_rust_bridge_codegen
        working-directory: packages/dart/rust
        run: flutter_rust_bridge_codegen generate --config-file flutter_rust_bridge.yaml
      - name: Build tree-sitter-language-pack-dart Rust crate
        run: cargo build --release --locked -p tree-sitter-language-pack-dart
