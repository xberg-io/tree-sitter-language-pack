name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v1.0.0-rc.2)"
        required: true
        type: string
      dry_run:
        description: "Dry run without publishing"
        required: false
        type: boolean
        default: false
      force_republish:
        description: "Force republish even if version exists"
        required: false
        type: boolean
        default: false
      targets:
        description: "Comma-separated targets or 'all'"
        required: false
        type: string
        default: "all"
      nuget_runtime_run_id:
        description: "Recover missing NuGet runtime packages from an existing release run; skip other targets"
        required: false
        type: string
  release:
    types: [published]
  repository_dispatch:
    types: [publish-release]

concurrency:
  group: ${{ github.workflow }}-${{ (inputs.nuget_runtime_run_id && format('nuget-runtimes-{0}', inputs.nuget_runtime_run_id)) || github.event.inputs.tag || github.event.release.tag_name || github.run_id }}-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' && 'dryrun' || 'real' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: short

permissions:
  contents: read

jobs:
  recover-nuget-runtimes:
    name: Recover missing NuGet runtime packages
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.nuget_runtime_run_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Validate original release run
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_RUN_ID: ${{ inputs.nuget_runtime_run_id }}
          EXPECTED_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN_ID}" > release-run.json
          python3 - <<'PY'
          import json
          import os
          import re

          with open('release-run.json') as source:
              run = json.load(source)
          if run['repository']['full_name'] != os.environ['GITHUB_REPOSITORY']:
              raise SystemExit('Source run repository differs')
          tag = os.environ['EXPECTED_TAG']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag):
              raise SystemExit('Recovery requires an explicit stable release tag')
          if (run['path'], run['event'], run['head_branch']) != ('.github/workflows/publish.yaml', 'release', tag):
              raise SystemExit('Source must be the original Publish Release event for the requested tag')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"sha={run['head_sha']}\n")
          PY

      - name: Check out current recovery tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}

      - name: Check out original release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.source.outputs.sha }}
          path: release-source

      - name: Verify immutable release source and version
        id: version
        shell: bash
        working-directory: release-source
        env:
          EXPECTED_TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
        run: |
          git fetch --depth=1 origin "refs/tags/${EXPECTED_TAG}:refs/tags/${EXPECTED_TAG}"
          [[ "$(git rev-parse "${EXPECTED_TAG}^{commit}")" == "$EXPECTED_SHA" ]]
          python3 - <<'PY'
          import os
          import tomllib

          with open('Cargo.toml', 'rb') as manifest:
              version = tomllib.load(manifest)['workspace']['package']['version']
          if f'v{version}' != os.environ['EXPECTED_TAG']:
              raise SystemExit('Release tag and source version differ')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: csharp-natives-*
          path: release-source/artifacts/csharp-natives
          merge-multiple: true
          run-id: ${{ inputs.nuget_runtime_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "10.0.x"

      - name: Pack only missing runtime package candidates
        shell: bash
        working-directory: release-source
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for dir in artifacts/csharp-natives/runtimes/*/; do
            rid="$(basename "$dir")"
            mkdir -p "packages/csharp/TreeSitterLanguagePack/runtimes/${rid}/native"
            cp -v "${dir}native/"* "packages/csharp/TreeSitterLanguagePack/runtimes/${rid}/native/"
          done
          # Every concrete RID is packed, and RequireRuntimeAssets rejects a missing artifact.
          # This directory deliberately contains no managed package.
          bash "$GITHUB_WORKSPACE/scripts/publish/csharp/pack-runtimes.sh" "$VERSION" dist/nuget-runtimes

      - uses: xberg-io/actions/publish-nuget@v1
        if: ${{ !inputs.dry_run }}
        with:
          packages-dir: release-source/dist/nuget-runtimes
          expected-version: ${{ steps.version.outputs.version }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

  prepare:
    name: Prepare release
    # This workflow publishes the release object itself, which re-enters it through
    # `on: release` and queues a full duplicate publish run behind the dispatch run that
    # created it. Keyed on `actor`, not `release.author` and not `triggering_actor`:
    # release.author is always the bot because the bot creates the release as a draft, so it
    # would suppress a human publishing that draft. triggering_actor becomes the human on a
    # re-run, so it would ADMIT a duplicate when someone re-runs the bot's own recursive run.
    # `actor` is pinned to whoever initiated the original run and survives re-runs. ~keep
    if: >-
      !inputs.nuget_runtime_run_id &&
      (github.event_name != 'release' ||
      github.actor != 'xberg-dev-publisher[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      checkout_ref: ${{ steps.ref.outputs.checkout_ref }}
      version: ${{ steps.meta.outputs.version }}
      # ~keep PyPI and RubyGems respell a semver prerelease, so the release version cannot be
      # handed to their publish guards verbatim. See the step that computes these below.
      pypi_version: ${{ steps.version_forms.outputs.pypi_version }}
      gem_version: ${{ steps.version_forms.outputs.gem_version }}
      npm_tag: ${{ steps.meta.outputs.npm_tag }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
      force_republish: ${{ steps.meta.outputs.force_republish }}
      release_crates: ${{ steps.meta.outputs.release_crates }}
      release_python: ${{ steps.meta.outputs.release_python }}
      release_node: ${{ steps.meta.outputs.release_node }}
      release_wasm: ${{ steps.meta.outputs.release_wasm }}
      release_ruby: ${{ steps.meta.outputs.release_ruby }}
      release_go: ${{ steps.meta.outputs.release_go }}
      release_java: ${{ steps.meta.outputs.release_java }}
      release_elixir: ${{ steps.meta.outputs.release_elixir }}
      release_c_ffi: ${{ steps.meta.outputs.release_c_ffi }}
      release_php: ${{ steps.meta.outputs.release_php }}
      release_csharp: ${{ steps.meta.outputs.release_csharp }}
      release_homebrew: ${{ steps.meta.outputs.release_homebrew }}
      release_scoop: ${{ steps.meta.outputs.release_scoop }}
      release_dart: ${{ steps.meta.outputs.release_dart }}
      release_swift: ${{ steps.meta.outputs.release_swift }}
      release_zig: ${{ steps.meta.outputs.release_zig }}
      # `release_kotlin_android`, NOT `release_kotlin` — prepare-release-metadata
      # emits both, and `kotlin` is the desktop/JVM target this repo does not
      # ship. Reading the wrong key pinned this to false and is why
      # io.xberg.tslp.android:tree-sitter-language-pack-android has never been
      # publish. `kotlin-android` must also appear in `available-targets`.
      # below, or the flag is false regardless of which key is read. ~keep
      release_kotlin_android: ${{ steps.meta.outputs.release_kotlin_android }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Prepare release metadata
        id: meta
        uses: xberg-io/actions/prepare-release-metadata@v1
        with:
          available-targets: "crates,python,node,wasm,ruby,go,java,elixir,c-ffi,php,csharp,homebrew,scoop,dart,swift,zig,kotlin-android"

      # ~keep The publish actions compare `expected-version` against the artifact's own version
      # string, and two ecosystems respell a semver prerelease: PyPI dist filenames carry the
      # PEP 440 form (1.9.0-rc.2 -> 1.9.0rc2) and gem filenames the RubyGems form
      # (1.9.0-rc.2 -> 1.9.0.pre.rc.2). Those are the spellings alef writes into the manifests
      # the artifacts are built from, so the guard has to be handed the same spelling or every
      # prerelease would fail it on a version that is in fact correct. A final release has no
      # suffix and passes through both expressions untouched.
      - name: Respell the release version for PyPI and RubyGems
        id: version_forms
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          pypi="$(printf '%s' "${VERSION}" \
            | sed -E 's/-alpha\.?([0-9]+)$/a\1/; s/-beta\.?([0-9]+)$/b\1/; s/-([A-Za-z]+)\.?([0-9]+)$/\1\2/')"
          gem="$(printf '%s' "${VERSION}" | sed -E 's/^([^-]+)-(.*)$/\1.pre.\2/' | tr '_-' '..')"
          {
            echo "pypi_version=${pypi}"
            echo "gem_version=${gem}"
          } >>"$GITHUB_OUTPUT"

      - name: Resolve checkout ref
        id: ref
        env:
          DRY_RUN: ${{ steps.meta.outputs.dry_run }}
          TAG: ${{ steps.meta.outputs.tag }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          if [[ "${DRY_RUN}" == "true" ]]; then
            echo "checkout_ref=${DISPATCH_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "checkout_ref=${TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Release info
        run: |
          {
            echo "## Release Configuration"
            echo "- **Tag**: ${{ steps.meta.outputs.tag }}"
            echo "- **Version**: ${{ steps.meta.outputs.version }}"
            echo "- **npm tag**: ${{ steps.meta.outputs.npm_tag }}"
            echo "- **Dry run**: ${{ steps.meta.outputs.dry_run }}"
            echo "- **Force republish**: ${{ steps.meta.outputs.force_republish }}"
            echo "- **Targets**: ${{ steps.meta.outputs.release_targets }}"
            echo "- **Pre-release**: ${{ steps.meta.outputs.is_prerelease }}"
          } >> "$GITHUB_STEP_SUMMARY"

  validate-versions:
    name: Validate version consistency
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Validate versions
        uses: xberg-io/actions/validate-versions@v1
        with:
          version: ${{ needs.prepare.outputs.version }}

      # A registry-mode test app pinned to an older release still installs and still passes, so it
      # gates nothing. Five were up to six releases behind before this check existed. ~keep
      - name: Check test-app pins match the release being published
        run: python3 scripts/check_test_app_pins.py --release "${{ needs.prepare.outputs.version }}"

      # The coding-agent plugin under plugin/ carries its own version source
      # (plugin/.ai-rulez/config.toml [plugin].version) that the shared
      # validate-versions action does not know about. Assert it against the tag
      # actually being released, so a drifted plugin fails the release instead of
      # shipping a bundle that lags the version it claims to be. ~keep
      # ~keep A dry run synthesizes its tag as `<version>-dryrun-<sha>`, so the release
      # version carries a suffix no manifest will ever hold and the assertion below fails
      # on a plugin that is in fact correct. Strip the suffix rather than skipping the step
      # on dry runs -- a dry run is exactly where a drifted plugin should surface, while
      # there is still no tag and nothing has been published.
      - name: Validate plugin version matches the release
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 scripts/sync_plugin_version.py --expect "${VERSION%%-dryrun-*}"

  check-registries:
    name: Check registries
    needs: prepare
    uses: xberg-io/actions/.github/workflows/reusable-check-registries.yml@v1
    with:
      version: ${{ needs.prepare.outputs.version }}
      registries: |
        [
          {
            "name": "cratesio",
            "registry": "cratesio",
            "package": "tree-sitter-language-pack"
          },
          {
            "name": "pypi",
            "registry": "pypi",
            "package": "tree-sitter-language-pack"
          },
          {
            "name": "npm",
            "registry": "npm",
            "package": "@xberg-io/tree-sitter-language-pack"
          },
          {
            "name": "npm-wasm",
            "registry": "npm",
            "package": "@xberg-io/tree-sitter-language-pack-wasm"
          },
          {
            "name": "rubygems",
            "registry": "rubygems",
            "package": "tree_sitter_language_pack"
          },
          {
            "name": "maven",
            "registry": "maven",
            "package": "io.xberg.treesitterlanguagepack:tree-sitter-language-pack"
          },
          {
            "name": "hex",
            "registry": "hex",
            "package": "tree_sitter_language_pack"
          },
          {
            "name": "packagist",
            "registry": "packagist",
            "package": "xberg-io/tree-sitter-language-pack"
          },
          {
            "name": "nuget",
            "registry": "nuget",
            "package": "XbergIo.TreeSitterLanguagePack"
          },
          {
            "name": "homebrew",
            "registry": "homebrew",
            "package": "ts-pack",
            "tap-repo": "xberg-io/homebrew-tap"
          },
          {
            "name": "pub",
            "registry": "pub",
            "package": "tree_sitter_language_pack"
          },
          {
            "name": "zig",
            "registry": "github-release",
            "package": "tree-sitter-language-pack-zig-v${{ needs.prepare.outputs.version }}.tar.gz",
            "repo": "xberg-io/tree-sitter-language-pack",
            "assets": "tree-sitter-language-pack-zig-v${{ needs.prepare.outputs.version }}.tar.gz"
          },
          {
            "name": "maven-kotlin-android",
            "registry": "maven",
            "package": "io.xberg.tslp.android:tree-sitter-language-pack-android"
          }
        ]

  clone-vendors-shard:
    name: Clone vendors (shard ${{ matrix.shard }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      TSLP_SHARD_INDEX: ${{ matrix.shard }}
      TSLP_SHARD_COUNT: 4
      TSLP_GENERATE_CONCURRENCY: 1
      TSLP_GENERATE_TIMEOUT: "900"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Add swap space
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 30G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      - name: Install tree-sitter CLI
        run: npm install -g tree-sitter-cli@0.26.11

      - name: Setup Python environment
        uses: xberg-io/actions/setup-python-env@v1
        with:
          python-version: "3.14"
          install-command: "uv sync --no-install-project --no-install-workspace"

      - name: Cache parsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: parsers
          key: parsers-shard${{ matrix.shard }}of4-${{ hashFiles('sources/language_definitions.json') }}
          restore-keys: |
            parsers-shard${{ matrix.shard }}of4-

      - name: Clone vendors
        run: |
          mkdir -p parsers
          uv run --script scripts/clone_vendors.py

      - name: Upload parsers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: language-parsers-shard-${{ matrix.shard }}
          path: parsers
          retention-days: 3

  clone-vendors:
    name: Clone vendors
    needs: [prepare, clone-vendors-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download shard parsers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: language-parsers-shard-*
          merge-multiple: true
          path: parsers

      - name: Upload merged parsers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: language-parsers
          path: parsers
          retention-days: 3

  build-parser-sources:
    name: Build parser-sources bundle
    needs: [prepare, validate-versions, clone-vendors]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Download parsers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: language-parsers
          path: parsers

      - name: Pack parser sources
        uses: xberg-io/actions/pack-source-bundle@v1
        with:
          paths: |
            parsers
            sources
            patches
          excludes: |
            parsers/*/grammar.js
            parsers/*/grammar.json
            parsers/*/node-types.json
            parsers/*/binding.gyp
            parsers/*/package.json
            parsers/*/.gitignore
            parsers/*/test
          output: dist/parser-sources-${{ needs.prepare.outputs.version }}.tar.zst

      - name: Upload to GitHub Release
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        uses: xberg-io/actions/publish-github-release@v1
        with:
          # Hold the release as a draft. finalize-github-release is the only job that
          # flips it public, and only after its asset-completeness check passes. ~keep
          draft: "true"
          tag: ${{ needs.prepare.outputs.tag }}
          title: "Release ${{ needs.prepare.outputs.tag }}"
          artifacts: |
            dist/parser-sources-*.tar.zst
            dist/parser-sources-*.tar.zst.sha256
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          token: ${{ steps.app-token.outputs.token }}

  build-parser-binaries:
    name: Build parser binaries (${{ matrix.label }})
    needs: [prepare, validate-versions, clone-vendors]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: ubuntu-24.04-arm
            label: linux-aarch64
          - os: macos-latest
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x86_64
          - os: windows-latest
            label: windows-x86_64
          - os: windows-11-arm
            label: windows-aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Download parsers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: language-parsers
          path: parsers

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          components: ""
          use-sccache: "false"
          install-llvm-cov: "false"

      - name: Install zstd (if missing)
        shell: bash
        run: |
          if command -v zstd &>/dev/null; then
            echo "zstd already available: $(zstd --version)"
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "Installing zstd for Windows..."
            curl -fsSL "https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-v1.5.7-win64.zip" -o /tmp/zstd.zip
            unzip -q /tmp/zstd.zip -d /tmp/zstd
            cp /tmp/zstd/zstd-v1.5.7-win64/zstd.exe "$HOME/.cargo/bin/"
            echo "zstd installed: $(zstd --version)"
          else
            echo "Installing zstd via package manager..."
            if [[ "$RUNNER_OS" == "macOS" ]]; then
              brew install zstd
            else
              sudo apt-get update && sudo apt-get install -y zstd
            fi
          fi

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Get all language names
        id: langs
        uses: xberg-io/actions/list-language-definitions@v1

      # The Rust cache restores target/ with mtimes newer than the fresh checkout, so cargo
      # judges the build script fresh and skips it — and the packaging step below globs
      # whatever out/libs/ the cache happened to carry. That shipped v1.15.0's parser
      # binaries unchanged through v1.15.5, including the typst scanner segfault fixed in
      # 61e331426. Dropping the build-script dirs forces build.rs to rerun and leaves no
      # stale out/libs/ for the glob to find.
      - name: Drop cache-restored parser build outputs
        shell: bash
        run: rm -rf target/release/build/tree-sitter-language-pack-*

      - name: Build all parsers
        run: cargo build --locked -p tree-sitter-language-pack --release
        env:
          PROJECT_ROOT: ${{ github.workspace }}
          TSLP_LINK_MODE: dynamic
          TSLP_LANGUAGES: ${{ steps.langs.outputs.names }}
          RUSTFLAGS: ""

      - name: Package parser binaries (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p staging
          # Dynamic parser libraries are built into the OUT_DIR/libs/ by build.rs
          find target/release/build -path '*/out/libs/*' \( -name 'libtree_sitter_*.so' -o -name 'libtree_sitter_*.dylib' \) -exec cp {} staging/ \;
          echo "Packaged $(find staging/ -maxdepth 1 -type f | wc -l) parser libraries"
          find staging/ -maxdepth 1 -type f | head -20
          cd staging && tar -cf - . | zstd -19 -o "../parsers-${{ matrix.label }}.tar.zst"

      - name: Package parser binaries (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p staging
          find target/release/build -path '*/out/libs/*' -name 'tree_sitter_*.dll' -exec cp {} staging/ \;
          echo "Packaged $(find staging/ -maxdepth 1 -type f | wc -l) parser libraries"
          cd staging && tar -cf - . | zstd -19 -o "../parsers-${{ matrix.label }}.tar.zst"

      - name: Upload parser binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parsers-${{ matrix.label }}
          path: parsers-${{ matrix.label }}.tar.zst
          retention-days: 14

  build-python-wheels:
    name: Build Python wheel (${{ matrix.label }})
    needs: [prepare, validate-versions, clone-vendors]
    if: needs.prepare.outputs.release_python == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: ubuntu-24.04-arm
            label: linux-aarch64
          - os: macos-latest
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x86_64
          - os: windows-latest
            label: windows-x86_64
          - os: windows-11-arm
            label: windows-aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Download parsers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: language-parsers
          path: parsers

      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        uses: xberg-io/actions/free-disk-space-linux@v1

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          components: ""
          use-sccache: "false"
          install-llvm-cov: "false"

      - name: Install maturin
        run: pip install maturin

      - name: Build wheel
        working-directory: packages/python
        run: maturin build --release --out ../../dist
        env:
          PROJECT_ROOT: ${{ github.workspace }}

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-wheel-${{ matrix.label }}
          path: dist/*.whl
          retention-days: 14

  build-python-sdist:
    name: Build Python sdist
    needs: [prepare, validate-versions, clone-vendors, publish-crates]
    # `== 'success'`, never `!= 'failure'`: a SKIPPED publish-crates satisfies
    # `!= 'failure'`, so this job used to build an sdist whose Cargo manifest
    # resolves `tree-sitter-language-pack = "^<version>"` from crates.io — a
    # version that was never published — and burn its full retry budget on
    # `failed to select a version for the requirement` (#177). ~keep
    if: ${{ !cancelled() && needs.publish-crates.result == 'success' && needs.prepare.outputs.release_python == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Download parsers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: language-parsers
          path: parsers

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          components: ""
          use-sccache: "false"
          install-llvm-cov: "false"

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Build sdist
        uses: xberg-io/actions/build-python-sdist@v1
        with:
          package-dir: packages/python
          output-dir: dist
          dry-run: ${{ needs.prepare.outputs.dry_run }}

      - name: Upload sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-sdist
          path: dist/*.tar.gz
          retention-days: 14

      - name: Pack a smoke source bundle
        id: smoke-bundle
        uses: xberg-io/actions/pack-source-bundle@v1
        with:
          paths: |
            parsers
            sources
            patches
          excludes: |
            parsers/*/grammar.js
            parsers/*/grammar.json
            parsers/*/node-types.json
            parsers/*/binding.gyp
            parsers/*/package.json
            parsers/*/.gitignore
            parsers/*/test
          output: /tmp/parser-sources.tar.zst

      - name: Smoke install from sdist (force source bundle download)
        env:
          BUNDLE: ${{ steps.smoke-bundle.outputs.bundle-path }}
        run: |
          set -euo pipefail
          # Hide parsers/ so build.rs can't find them locally — emulates sdist install.
          mv parsers /tmp/parsers-bak
          python -m venv /tmp/sdist-smoke
          # shellcheck disable=SC1091
          source /tmp/sdist-smoke/bin/activate
          pip install --upgrade pip
          # --no-build-isolation needs every PEP 517 backend present in the venv
          # ahead of time: maturin for tree-sitter-language-pack itself.
          # Scope --no-binary to ONLY tree-sitter-language-pack so transitive
          # deps (tree-sitter, etc.) use their published wheels — otherwise we'd
          # have to pre-install every transitive backend (hatchling, scikit-build, …).
          pip install 'maturin>=1,<2'
          TSLP_LANGUAGES="python,rust,javascript" \
          TSLP_LINK_MODE=static \
          TSLP_SOURCE_BUNDLE_URL="file://${BUNDLE}" \
            pip install --no-binary tree-sitter-language-pack --no-build-isolation \
              dist/tree_sitter_language_pack-*.tar.gz
          python -c "
          import tree_sitter_language_pack as t
          p = t.get_parser('python')
          tree = p.parse(b'def foo(): pass')
          # get_parser() returns a standard tree_sitter.Parser (issue #157), so
          # nodes use the py-tree-sitter property API: tree.root_node and
          # node.type — not the vendored parser's root_node()/kind() methods.
          root = tree.root_node
          kind = root.type
          assert kind == 'module', kind
          print('OK:', kind)
          "
          # Restore parsers/ for any subsequent steps.
          mv /tmp/parsers-bak parsers

  build-node-native:
