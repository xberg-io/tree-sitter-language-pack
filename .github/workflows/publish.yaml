            # Rewrite to @rpath
            install_name_tool -id "@rpath/$dylib_name" "$dylib"
            echo "  New install_name:"
            otool -D "$dylib" | tail -1 | sed 's/^/    /'
          done
          echo "=== C FFI dylib install_name fixes complete ==="

      - name: Upload C FFI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
