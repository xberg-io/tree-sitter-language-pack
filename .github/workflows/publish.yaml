        with:
          components: ""
          use-sccache: "false"
          install-llvm-cov: "false"

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Get all language names
        id: langs
        uses: xberg-io/actions/list-language-definitions@v1

      - name: Build C# native library
        uses: xberg-io/actions/build-csharp-natives@v1
        with:
          target: ${{ matrix.target }}
          crate-name: ts-pack-core-ffi
          lib-name: ts_pack_core_ffi
          rid: ${{ matrix.rid }}
          output-dir: dist/csharp-ffi
          dry-run: ${{ needs.prepare.outputs.dry_run }}
        env:
          TSLP_LANGUAGES: ${{ steps.langs.outputs.names }}
          TSLP_LINK_MODE: static
          PROJECT_ROOT: ${{ github.workspace }}

      - name: Upload native artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: csharp-natives-${{ matrix.label }}
          path: dist/csharp-ffi
          retention-days: 14

  build-csharp-package:
    name: Build C# NuGet package
    needs: [prepare, validate-versions, build-csharp-native]
    if: needs.prepare.outputs.release_csharp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "10.0"

      - name: Download C# native artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: csharp-natives-*
          path: artifacts/csharp-natives
          merge-multiple: true

      - name: Stage native assets
        shell: bash
        run: |
          RUNTIMES_DIR="packages/csharp/TreeSitterLanguagePack/runtimes"
          mkdir -p "$RUNTIMES_DIR"
          # Each artifact was uploaded as dist/csharp-ffi/ containing runtimes/{rid}/native/*.{so,dylib,dll}
          # When downloaded with merge-multiple: true, artifacts/csharp-natives/ preserves the runtimes/ subdirectory
          if [[ -d artifacts/csharp-natives ]]; then
            cp -r artifacts/csharp-natives/runtimes/* "$RUNTIMES_DIR/"
          fi
          echo "=== Staged native runtimes ==="
          find "$RUNTIMES_DIR" -type f | head -20

      - name: Render runtime.json from template
        uses: xberg-io/actions/render-runtime-json@v1
        with:
          template-path: packages/csharp/TreeSitterLanguagePack/runtime.json.template
          version: ${{ needs.prepare.outputs.version }}

      - name: Build and pack NuGet
        working-directory: packages/csharp/TreeSitterLanguagePack
        shell: bash
        run: |
          set -euo pipefail
          rids=$(jq -er '.runtimes | to_entries[] | select(.value["XbergIo.TreeSitterLanguagePack"] != null) | .key' runtime.json)
          while IFS= read -r rid; do
            dotnet pack ../TreeSitterLanguagePack.Runtime/TreeSitterLanguagePack.Runtime.csproj -c Release \
              -p:PublishedRID="$rid" --output ../../../dist/nuget
          done <<< "$rids"
          dotnet pack TreeSitterLanguagePack.csproj -c Release --output ../../../dist/nuget

      - name: Upload NuGet package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-packages
          path: dist/nuget/*.nupkg
          retention-days: 14

  upload-parser-binaries:
    name: Upload parser binaries to GitHub Release
    needs: [prepare, validate-versions, build-parser-binaries]
    # `always()` disables the implicit all-needs-succeeded rule, so every `needs:`
    # edge that must actually gate has to be restated as an explicit
    # `== 'success'`. build-parser-binaries is deliberately NOT restated: the
    # manifest step below tolerates a partial platform matrix and warns. ~keep
    if: |
      always() &&
      needs.validate-versions.result == 'success' &&
      needs.prepare.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Download parser binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: parsers-*
          path: dist/parsers
          merge-multiple: true

      - name: Install zstandard for tar.zst parsing
        run: python3 -m pip install --user zstandard

      - name: Generate parsers.json manifest
        id: generate-manifest
        run: |
          python3 -c "
          import json, hashlib, os, sys, tarfile, zstandard

          version = '${{ needs.prepare.outputs.version }}'
          base_url = 'https://github.com/xberg-io/tree-sitter-language-pack/releases/download/v' + version

          # Derive the language list from what is actually inside the
          # per-platform parser archives, not from sources/language_definitions.json.
          # The source registry can advertise a grammar whose scanner
          # fails to compile on one platform; if we trusted the source
          # list, the manifest would claim every grammar is downloadable
          # but the archive would not contain it, surfacing at runtime
          # as 'Downloaded archive did not contain parser libraries for: X'.
          # Walking the archives is the only source of truth.
          PARSER_EXTS = ('.so', '.dylib', '.dll')

          # Reverse map for the handful of grammars whose C symbol differs from
          # the language id. Derived from the same source of truth that
          # crates/ts-pack-core/build.rs uses to emit C_SYMBOL_OVERRIDES into
          # OUT_DIR/registry_generated.rs, so the two can never drift. Hardcoding
          # it here previously dropped apache_avro->avro and TSQL->tsql, which
          # shipped those two keyed by symbol name and undownloadable.
          defs = json.load(open('sources/language_definitions.json'))
          C_SYMBOL_REVERSE = {d['c_symbol']: name for name, d in defs.items() if d.get('c_symbol')}

          def normalise_lib_name(base):
              # Strip extension.
              stem = None
              for ext in PARSER_EXTS:
                  if base.endswith(ext):
                      stem = base[:-len(ext)]
                      break
              if stem is None:
                  return None
              # Linux/macOS prefix with 'lib', Windows DLLs do not.
              if stem.startswith('lib'):
                  stem = stem[3:]
              # Both producers prefix the symbol with 'tree_sitter_'.
              if stem.startswith('tree_sitter_'):
                  stem = stem[len('tree_sitter_'):]
              elif stem.startswith('tree-sitter-'):
                  stem = stem[len('tree-sitter-'):]
              return C_SYMBOL_REVERSE.get(stem, stem)

          per_platform_langs = {}
          platforms = {}
          for f in sorted(os.listdir('dist/parsers')):
              if not (f.startswith('parsers-') and f.endswith('.tar.zst')):
                  continue
              path = os.path.join('dist/parsers', f)
              label = f.replace('parsers-', '').replace('.tar.zst', '')
              sha = hashlib.sha256(open(path, 'rb').read()).hexdigest()
              size = os.path.getsize(path)
              platforms[label] = {
                  'url': base_url + '/' + f,
                  'sha256': sha,
                  'size': size,
              }
              langs = set()
              # tarfile.open does not natively support .zst; decompress
              # in-memory via zstandard.ZstdDecompressor.stream_reader.
              with open(path, 'rb') as zf:
                  dctx = zstandard.ZstdDecompressor()
                  with dctx.stream_reader(zf) as reader:
                      with tarfile.open(fileobj=reader, mode='r|') as tar:
                          for member in tar:
                              lang = normalise_lib_name(os.path.basename(member.name))
                              if lang is not None:
                                  langs.add(lang)
              per_platform_langs[label] = langs

          if not per_platform_langs:
              print('ERROR: no parsers-*.tar.zst archives found in dist/parsers/', file=sys.stderr)
              sys.exit(1)

          import os
          platform_count = len(platforms)
          with open(os.environ.get('GITHUB_OUTPUT', '/dev/null'), 'a') as f:
              f.write(f'platform_count={platform_count}\n')

          # Cross-platform parity: a grammar must be present in every
          # archive to be advertised. Anything missing from one platform
          # but present on another is reported as a build error rather
          # than silently shipped.
          intersection = set.intersection(*per_platform_langs.values())
          union = set.union(*per_platform_langs.values())
          asymmetric = union - intersection
          if asymmetric:
              print(
                  f'ERROR: parity mismatch across platforms. Grammars present on some platforms but not others: {sorted(asymmetric)}',
                  file=sys.stderr,
              )
              for label in sorted(per_platform_langs):
                  missing = sorted(union - per_platform_langs[label])
                  if missing:
                      print(f'  [{label}] missing: {missing}', file=sys.stderr)
              sys.exit(1)

          shipped = sorted(intersection)
          languages = {name: {'group': 'all', 'size': 0} for name in shipped}

          # Cross-check against the source registry and report any
          # advertised-but-dropped grammars. We do not fail here because
          # the cargo build step (with TSLP_ALLOW_FAILED_GRAMMARS unset)
          # is the canonical fail-fast point; this is informational.
          dropped = sorted(set(defs.keys()) - intersection)
          if dropped:
              print(f'NOTE: registry lists {len(dropped)} grammar(s) not present in archives: {dropped}')

          manifest = {
              'version': version,
              'platforms': platforms,
              'languages': languages,
              'groups': {'all': shipped},
          }

          with open('dist/parsers/parsers.json', 'w') as f:
              json.dump(manifest, f, indent=2)
          print(f'Generated parsers.json with {len(platforms)} platforms and {len(languages)} languages')
          "

      - name: Upload to GitHub Release
        uses: xberg-io/actions/publish-github-release@v1
        with:
          # Hold the release as a draft. finalize-github-release is the only job that
          # flips it public, and only after its asset-completeness check passes. ~keep
          draft: "true"
          tag: ${{ needs.prepare.outputs.tag }}
          title: "Release ${{ needs.prepare.outputs.tag }}"
          artifacts: |
            dist/parsers/parsers-*.tar.zst
            dist/parsers/parsers.json
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Check for partial parser binary upload
        if: |
          steps.generate-manifest.outputs.platform_count != '' &&
          steps.generate-manifest.outputs.platform_count < 6
        run: |
          platform_count=${{ steps.generate-manifest.outputs.platform_count }}
          echo "::warning::Parser binaries uploaded from only ${platform_count}/6 platforms. \
          Build failures on other platforms (visible in build-parser-binaries matrix) must be fixed before next release. \
          Consumers will receive platform-specific 'not found' errors for missing platforms."

  upload-go-release:
    name: Upload Go FFI to GitHub Release
    needs: [prepare, validate-versions, build-go-ffi, e2e-go]
    if: |
      always() &&
      needs.validate-versions.result == 'success' &&
      needs.prepare.outputs.dry_run != 'true' &&
      needs.prepare.outputs.release_go == 'true' &&
      needs.build-go-ffi.result == 'success' &&
      needs.e2e-go.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Download Go FFI artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: go-ffi-*
          path: dist/go
