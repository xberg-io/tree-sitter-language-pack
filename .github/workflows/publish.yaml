        with:
          version: "0.14.1"

      - name: Install cargo-zigbuild
        if: matrix.musl
        uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2.86.6
        with:
          tool: cargo-zigbuild

