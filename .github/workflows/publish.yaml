          ruby -e 'require "tree_sitter_language_pack"; abort("parse failed") unless TreeSitterLanguagePack.get_parser("json").parse("{}").root_node.kind == "document"'

      - name: Setup Ruby 3.5 for platform gem verification
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.5"
          bundler: none
          bundler-cache: false

      - name: Verify platform gem on Ruby 3.5
        run: |
          gem install packages/ruby/tree_sitter_language_pack-*.gem --no-document
          ruby -e 'require "tree_sitter_language_pack"; abort("parse failed") unless TreeSitterLanguagePack.get_parser("json").parse("{}").root_node.kind == "document"'

      - name: Setup Ruby 3.4 for platform gem verification
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4"
          bundler: none
          bundler-cache: false

      - name: Verify platform gem on Ruby 3.4
        run: |
          gem install packages/ruby/tree_sitter_language_pack-*.gem --no-document
          ruby -e 'require "tree_sitter_language_pack"; abort("parse failed") unless TreeSitterLanguagePack.get_parser("json").parse("{}").root_node.kind == "document"'

      - name: Setup Ruby 3.3 for platform gem verification
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
          bundler: none
          bundler-cache: false

      - name: Verify platform gem on Ruby 3.3
        run: |
          gem install packages/ruby/tree_sitter_language_pack-*.gem --no-document
          ruby -e 'require "tree_sitter_language_pack"; abort("parse failed") unless TreeSitterLanguagePack.get_parser("json").parse("{}").root_node.kind == "document"'

      - name: Setup Ruby 3.2 for platform gem verification
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.2"
          bundler: none
          bundler-cache: false

      - name: Verify platform gem on Ruby 3.2
        run: |
          gem install packages/ruby/tree_sitter_language_pack-*.gem --no-document
          ruby -e 'require "tree_sitter_language_pack"; abort("parse failed") unless TreeSitterLanguagePack.get_parser("json").parse("{}").root_node.kind == "document"'

      - name: Verify gem was built
        working-directory: packages/ruby
        run: |
          if ! ls ./*.gem 1>/dev/null 2>&1; then
            echo "ERROR: No gem file found" >&2
            exit 1
          fi
          echo "Gem built successfully:"
          ls -lh ./*.gem
          # Verify it's a platform gem, not a source gem
          gem spec ./*.gem | grep -i platform

      - name: Verify gem integrity
        working-directory: packages/ruby
        run: |
          for gem in ./*.gem; do
            echo "Validating: $gem"
            file "$gem"
            if ! gem spec "$gem" >/dev/null 2>&1; then
              echo "WARNING: gem spec check failed for $gem"
              if ! tar -tzf "$gem" >/dev/null 2>&1; then
                echo "ERROR: Corrupted gem file: $gem" >&2
                exit 1
              fi
            else
              echo "gem spec validation passed"
            fi
          done

      - name: Upload gem artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rubygems-${{ matrix.label }}
          path: packages/ruby/*.gem
          retention-days: 14
          compression-level: 0

  build-wasm:
    name: Build WASM package
    needs: [prepare, validate-versions, clone-vendors]
    if: needs.prepare.outputs.release_wasm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Download parsers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: language-parsers
          path: parsers

      - name: Free disk space (Linux)
        uses: xberg-io/actions/free-disk-space-linux@v1

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          target: wasm32-unknown-unknown
          components: ""
          use-sccache: "false"
          install-llvm-cov: "false"

      - name: Install WASI SDK
        uses: xberg-io/actions/install-wasi-sdk@v1

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Add swap (best-effort; avoid OOM during 371-grammar static link)
        shell: bash
        run: |
          # Best-effort: free runners often already have swap, and fallocate
          # can fail on some FS layouts. Don't fail the job if swap isn't
          # creatable — we still rely on CARGO_BUILD_JOBS=1 to keep peak RAM low.
          set +e
          # Fallocate first, dd as fallback (slower but works on more filesystems).
          if sudo fallocate -l 6G /swapfile 2>/dev/null; then
            :
          elif sudo dd if=/dev/zero of=/swapfile bs=1M count=6144 status=none 2>/dev/null; then
            :
          else
            echo "swap allocation failed; continuing without extra swap"
            free -h
            exit 0
          fi
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile >/dev/null
          sudo swapon /swapfile
          free -h

      - name: Build WASM (nodejs and web targets)
        working-directory: crates/ts-pack-core-wasm
        run: |
          # Build both nodejs (for Node.js consumers) and web (for bundlers/browser)
          wasm-pack build --target nodejs --out-dir pkg/nodejs --release
          wasm-pack build --target web --out-dir pkg/web --release

          # Copy nodejs as the primary output for npm publish (Node.js is the primary consumer)
          cp -r pkg/nodejs/* pkg/
        env:
          PROJECT_ROOT: ${{ github.workspace }}
          TSLP_LINK_MODE: static
          # NOTE: jsx is part of the javascript grammar (no separate jsx grammar exists);
          TSLP_LANGUAGES: "python,javascript,typescript,tsx,rust,go,java,c,cpp,csharp,ruby,php,html,css,json,yaml,toml,markdown,bash,sql,lua,scala,kotlin,swift,dockerfile,vue,svelte,elixir,erlang,haskell,zig"
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

      - name: Verify WASM build output
        working-directory: crates/ts-pack-core-wasm
        run: |
          if [ ! -d pkg ]; then
            echo "ERROR: pkg/ directory not created by wasm-pack" >&2
            exit 1
          fi
          echo "=== WASM build output (nodejs primary) ==="
          ls -lh pkg/
          if [ ! -f pkg/ts_pack_core_wasm_bg.wasm ]; then
            echo "ERROR: WASM binary not found" >&2
            exit 1
          fi
          echo "WASM binary size: $(wc -c < pkg/ts_pack_core_wasm_bg.wasm) bytes"
          echo "=== Checking for bundler-only imports ==="
          if grep -q 'from "env"' pkg/ts_pack_core_wasm.js; then
            echo "ERROR: Found bundler-only imports in main JS" >&2
            grep 'from "env"' pkg/ts_pack_core_wasm.js | head -5
            exit 1
          fi
          echo "OK: No bundler-only imports detected"

      - name: Patch WASM package.json
        working-directory: crates/ts-pack-core-wasm
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          python3 -c "
          import json
          with open('pkg/package.json', 'r') as f:
              data = json.load(f)
          data['name'] = '@xberg-io/tree-sitter-language-pack-wasm'
          data['version'] = '$VERSION'
          data['publishConfig'] = {'registry': 'https://registry.npmjs.org/', 'access': 'public'}
          data['repository'] = {'type': 'git', 'url': 'https://github.com/xberg-io/tree-sitter-language-pack'}
          data['license'] = 'MIT'
          # Ensure Node.js is the primary entry point
          data['main'] = 'ts_pack_core_wasm.js'
          data['module'] = 'ts_pack_core_wasm.js'
          with open('pkg/package.json', 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          print(f'Patched pkg/package.json: name={data[\"name\"]}, version={data[\"version\"]}')
          "

      - name: Upload WASM package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-pkg
          path: crates/ts-pack-core-wasm/pkg/
          retention-days: 14

  build-go-ffi:
    name: Build Go FFI (${{ matrix.label }})
    needs: [prepare, validate-versions, clone-vendors]
    if: needs.prepare.outputs.release_go == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            label: linux-aarch64
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            label: macos-arm64
            target: aarch64-apple-darwin
          - os: macos-15-intel
            label: macos-x86_64
            target: x86_64-apple-darwin
          - os: windows-latest
            label: windows-x86_64
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            label: windows-aarch64
            target: aarch64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Download parsers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: language-parsers
          path: parsers

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          target: ${{ matrix.target }}
          components: ""
          use-sccache: "false"
          install-llvm-cov: "false"

      - uses: xberg-io/actions/install-alef@v1

      - name: Build and package Go FFI library with alef
        shell: bash
        run: |
          set -euo pipefail
          # Build the FFI library for this target
          cargo build --release --locked --target ${{ matrix.target }} -p ts-pack-core-ffi

          # Package with alef for distribution
          alef publish build --lang ffi --target ${{ matrix.target }}
          alef publish package --lang go --target ${{ matrix.target }} -o dist/go-ffi

      - name: Fix macOS dylib install_name (Go FFI)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "=== Fixing macOS dylib install_name in Go FFI package ==="
          find dist/go-ffi -name "*.dylib" -type f | while read -r dylib; do
            echo "Processing: $dylib"
            # Get the dylib filename
            dylib_name=$(basename "$dylib")
            echo "  Current install_name:"
            otool -D "$dylib" | tail -1 | sed 's/^/    /'
            # Rewrite to @rpath
            install_name_tool -id "@rpath/$dylib_name" "$dylib"
            echo "  New install_name:"
            otool -D "$dylib" | tail -1 | sed 's/^/    /'
          done
          echo "=== Go FFI dylib install_name fixes complete ==="

      - name: Upload FFI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-ffi-${{ matrix.label }}
          path: dist/go-ffi/
          if-no-files-found: error
          retention-days: 14

  build-java-natives:
    name: Build Java natives (${{ matrix.label }})
    needs: [prepare, validate-versions, clone-vendors]
    if: needs.prepare.outputs.release_java == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # ~keep `platform` becomes the `natives/<classifier>/` directory inside the JAR, and
        # ~keep NativeLib.resolveNativesRid computes the name it looks for at runtime. That method is
        # ~keep alef-generated from src/publish/platform.rs::go_java_platform(), which emits `aarch64`
        # ~keep for every non-macOS ARM64 target and special-cases macOS to `arm64`. These values MUST
        # ~keep match it exactly. Issue #178: they said `arm64`, the loader looked for `aarch64`, and
        # ~keep the native core failed to load on every ARM64 Linux and Windows host.
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            label: linux-aarch64
            target: aarch64-unknown-linux-gnu
            platform: linux-aarch64
          - os: macos-latest
            label: macos-arm64
            target: aarch64-apple-darwin
            platform: macos-arm64
          - os: macos-15-intel
            label: macos-x86_64
            target: x86_64-apple-darwin
            platform: macos-x86_64
          - os: windows-latest
            label: windows-x86_64
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
          - os: windows-11-arm
            label: windows-arm64
            target: aarch64-pc-windows-msvc
            platform: windows-aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Download parsers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: language-parsers
          path: parsers

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          components: ""
          use-sccache: "false"
          install-llvm-cov: "false"

      - name: Build Java native library
        uses: xberg-io/actions/build-java-natives@v1
        with:
          target: ${{ matrix.target }}
          crate-name: ts-pack-core-ffi
          lib-name: ts_pack_core_ffi
          classifier: ${{ matrix.platform }}
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          output-dir: dist/java-ffi

      - name: Upload native artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: java-natives-${{ matrix.label }}
          path: dist/java-ffi
          retention-days: 14

  build-java-package:
    name: Build Java package
    needs: [prepare, validate-versions, build-java-natives]
    if: needs.prepare.outputs.release_java == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "maven"

      - name: Setup Maven
        uses: xberg-io/actions/setup-maven@v1

      - name: Download Java native artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: java-natives-*
          path: artifacts/java-natives
          merge-multiple: true

      - name: Stage Java native resources
        uses: xberg-io/actions/stage-java-natives@v1
        with:
          artifacts-dir: artifacts/java-natives
          resources-dir: packages/java/src/main/resources/natives
          required-classifiers: linux-x86_64 linux-aarch64 macos-arm64 macos-x86_64 windows-x86_64 windows-aarch64
          lib-name: ts_pack_core_ffi

      - name: Build and package
        working-directory: packages/java
        run: mvn clean package -DskipTests

      - name: Verify JAR contains native libs
        working-directory: packages/java
        shell: bash
        run: |
          JAR=""
          for f in target/tree-sitter-language-pack-*.jar; do
            case "$f" in *-sources.jar|*-javadoc.jar) continue ;; esac
            JAR="$f"
            break
          done
          if [ -z "$JAR" ]; then
            echo "::error::No JAR found in target/"
            exit 1
          fi
          echo "Checking JAR: $JAR"
          ENTRIES=$(jar tf "$JAR" | grep -E '^natives/[^/]+/(lib)?ts_pack_core_ffi\.(so|dll|dylib)$' || true)
          echo "Native lib entries:"
          echo "$ENTRIES"
          # Issue #128: a previous bug staged every lib under `natives/native/`
          # because the re-stage loop walked one dirname too far. Require each
          # expected classifier directory to be present individually so the
          # collapse-to-`native` regression cannot ship again.
          REQUIRED_CLASSIFIERS="linux-x86_64 linux-aarch64 macos-arm64 macos-x86_64 windows-x86_64 windows-aarch64"
          missing=()
          for c in $REQUIRED_CLASSIFIERS; do
            if ! echo "$ENTRIES" | grep -qE "^natives/$c/(lib)?ts_pack_core_ffi\.(so|dll|dylib)$"; then
              missing+=("$c")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::JAR missing natives for classifiers: ${missing[*]}"
            jar tf "$JAR" | grep -E '^natives/' || echo "(no natives/ entries at all)"
            exit 1
          fi

      - name: Upload JAR artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maven-packages
          path: packages/java/target/*.jar
          retention-days: 14

  build-elixir-nifs:
    name: Build Elixir NIF (${{ matrix.label }})
    needs: [prepare, validate-versions, clone-vendors, publish-crates]
    # `== 'success'`, never `!= 'failure'` — see build-python-sdist. The NIF's
    # release build resolves the crate from crates.io, so a SKIPPED
    # publish-crates guarantees a resolver failure, not a usable NIF. ~keep
    if: ${{ !cancelled() && needs.publish-crates.result == 'success' && needs.prepare.outputs.release_elixir == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            label: linux-aarch64
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            label: macos-arm64
            target: aarch64-apple-darwin
          - os: macos-15-intel
            label: macos-x86_64
            target: x86_64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Download parsers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: language-parsers
          path: parsers

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          target: ${{ matrix.target }}
          components: ""
          use-sccache: "false"
          install-llvm-cov: "false"

      - name: Rewrite native dependencies
        uses: xberg-io/actions/rewrite-native-deps@v1
        with:
          lang: elixir

      - name: Build Elixir NIF
        working-directory: packages/elixir/native/tree_sitter_language_pack_nif
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          PROJECT_ROOT: ${{ github.workspace }}
          CARGO_BUILD_TARGET: ${{ matrix.target }}

      - name: Package NIF libraries (NIF 2.16)
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          TARGET="${{ matrix.target }}"
          NIF_VERSION="2.16"

          if [[ "${{ runner.os }}" == "macOS" ]]; then
            ARCHIVE_EXT="so"
            LIB_NAME="libtree_sitter_language_pack_nif.dylib"
          else
            ARCHIVE_EXT="so"
            LIB_NAME="libtree_sitter_language_pack_nif.so"
          fi

          mkdir -p dist/elixir
          # Underscore name (matches Cargo output)
          ARTIFACT_UNDERSCORE="libtree_sitter_language_pack_nif-v${VERSION}-nif-${NIF_VERSION}-${TARGET}.${ARCHIVE_EXT}"
          # Hyphen name (matches what RustlerPrecompiled expects from crate: "ts-pack-elixir")
          ARTIFACT_HYPHEN="libtree-sitter-language-pack-nif-v${VERSION}-nif-${NIF_VERSION}-${TARGET}.${ARCHIVE_EXT}"

          # ts-pack-elixir is a standalone workspace, output is in packages/elixir/target/
          LIB_PATH="packages/elixir/native/tree_sitter_language_pack_nif/target/${TARGET}/release/${LIB_NAME}"
          if [[ ! -f "$LIB_PATH" ]]; then
            LIB_PATH="packages/elixir/native/tree_sitter_language_pack_nif/target/release/${LIB_NAME}"
          fi
          if [[ ! -f "$LIB_PATH" ]]; then
            LIB_PATH="target/${TARGET}/release/${LIB_NAME}"
          fi
          if [[ ! -f "$LIB_PATH" ]]; then
            LIB_PATH="target/release/${LIB_NAME}"
          fi

          if [[ ! -f "$LIB_PATH" ]]; then
            echo "ERROR: Library not found"
            find . -name "${LIB_NAME}" -type f 2>/dev/null || true
            exit 1
          fi

          # Create both underscore and hyphen tarballs
          cp "$LIB_PATH" "${ARTIFACT_UNDERSCORE}"
          tar -czf "dist/elixir/${ARTIFACT_UNDERSCORE}.tar.gz" "${ARTIFACT_UNDERSCORE}"
          echo "Created: dist/elixir/${ARTIFACT_UNDERSCORE}.tar.gz"

          cp "$LIB_PATH" "${ARTIFACT_HYPHEN}"
          tar -czf "dist/elixir/${ARTIFACT_HYPHEN}.tar.gz" "${ARTIFACT_HYPHEN}"
          echo "Created: dist/elixir/${ARTIFACT_HYPHEN}.tar.gz"

      - name: Package NIF libraries (NIF 2.17)
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          TARGET="${{ matrix.target }}"
          NIF_VERSION="2.17"

          if [[ "${{ runner.os }}" == "macOS" ]]; then
            ARCHIVE_EXT="so"
            LIB_NAME="libtree_sitter_language_pack_nif.dylib"
          else
            ARCHIVE_EXT="so"
            LIB_NAME="libtree_sitter_language_pack_nif.so"
          fi

          ARTIFACT_UNDERSCORE="libtree_sitter_language_pack_nif-v${VERSION}-nif-${NIF_VERSION}-${TARGET}.${ARCHIVE_EXT}"
          ARTIFACT_HYPHEN="libtree-sitter-language-pack-nif-v${VERSION}-nif-${NIF_VERSION}-${TARGET}.${ARCHIVE_EXT}"

          # ts-pack-elixir is a standalone workspace, output is in packages/elixir/target/
          LIB_PATH="packages/elixir/native/tree_sitter_language_pack_nif/target/${TARGET}/release/${LIB_NAME}"
          if [[ ! -f "$LIB_PATH" ]]; then
            LIB_PATH="packages/elixir/native/tree_sitter_language_pack_nif/target/release/${LIB_NAME}"
          fi
          if [[ ! -f "$LIB_PATH" ]]; then
            LIB_PATH="target/${TARGET}/release/${LIB_NAME}"
          fi
          if [[ ! -f "$LIB_PATH" ]]; then
            LIB_PATH="target/release/${LIB_NAME}"
          fi

          if [[ ! -f "$LIB_PATH" ]]; then
            echo "ERROR: Library not found"
            find . -name "${LIB_NAME}" -type f 2>/dev/null || true
            exit 1
          fi

          cp "$LIB_PATH" "${ARTIFACT_UNDERSCORE}"
          tar -czf "dist/elixir/${ARTIFACT_UNDERSCORE}.tar.gz" "${ARTIFACT_UNDERSCORE}"
          echo "Created: dist/elixir/${ARTIFACT_UNDERSCORE}.tar.gz"

          cp "$LIB_PATH" "${ARTIFACT_HYPHEN}"
          tar -czf "dist/elixir/${ARTIFACT_HYPHEN}.tar.gz" "${ARTIFACT_HYPHEN}"
          echo "Created: dist/elixir/${ARTIFACT_HYPHEN}.tar.gz"

      - name: Upload NIF artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: elixir-${{ matrix.label }}
          path: dist/elixir/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  build-c-ffi:
    name: Build C FFI (${{ matrix.label }})
    needs: [prepare, validate-versions, clone-vendors]
