    env:
      PROJECT_ROOT: ${{ github.workspace }}
      TSLP_LINK_MODE: static
      TSLP_LANGUAGES: "python,rust,javascript,typescript,go,html,css,json,gherkin"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Download parsers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: language-parsers
          path: parsers
      - name: Wire e2e manifest
        uses: ./.github/actions/wire-e2e-manifest
        with:
          platform-label: linux-x86_64
          artifact-name: parsers-linux-x86_64
      - uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: publish-e2e-java
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: xberg-io/actions/setup-maven@v1
      - uses: xberg-io/actions/install-task@v1
      - uses: xberg-io/actions/install-alef@v1
      - name: Run Java E2E tests
        run: task java:e2e:test
        env:
          MAVEN_OPTS: "--enable-native-access=ALL-UNNAMED -Dsun.misc.unsafe.memory.access=allow"

  e2e-elixir:
    name: E2E gate — Elixir
    needs: [prepare, validate-versions, clone-vendors, build-parser-binaries]
    if: ${{ needs.prepare.outputs.release_elixir == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROJECT_ROOT: ${{ github.workspace }}
      TSLP_LINK_MODE: static
      TSLP_LANGUAGES: "python,rust,javascript,typescript,go,html,css,json,bash"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Download parsers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: language-parsers
          path: parsers
      - name: Wire e2e manifest
        uses: ./.github/actions/wire-e2e-manifest
        with:
          platform-label: linux-x86_64
          artifact-name: parsers-linux-x86_64
      - uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: publish-e2e-elixir
      - uses: xberg-io/actions/setup-elixir@v1
        with:
          elixir-version: "1.17"
          otp-version: "27.2"
      - uses: xberg-io/actions/install-task@v1
      - uses: xberg-io/actions/install-alef@v1
      - name: Install Elixir dependencies
        run: task elixir:deps
      - name: Run Elixir E2E tests
        run: task elixir:e2e:test

  e2e-php:
    name: E2E gate — PHP
    needs: [prepare, validate-versions, clone-vendors, build-parser-binaries]
    if: ${{ needs.prepare.outputs.release_php == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROJECT_ROOT: ${{ github.workspace }}
      TSLP_LINK_MODE: static
      TSLP_LANGUAGES: "python,rust,javascript,typescript,go,html,css,json,gherkin"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Download parsers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: language-parsers
          path: parsers
      - name: Wire e2e manifest
        uses: ./.github/actions/wire-e2e-manifest
        with:
          platform-label: linux-x86_64
          artifact-name: parsers-linux-x86_64
      - uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: publish-e2e-php
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.4"
          extensions: ffi
          tools: composer
      # setup-php only puts the composer binary on PATH; e2e/php's own dependencies are
      # never installed by it, so `run_tests.php` cannot find vendor/bin/phpunit.
      # ci-e2e.yaml's `test-php` runs this install inline before the same harness. ~keep
      - name: Install PHP E2E dependencies
        working-directory: e2e/php
        run: composer install --no-progress --prefer-dist
      - uses: xberg-io/actions/install-task@v1
      - uses: xberg-io/actions/install-alef@v1
      - name: Run PHP E2E tests
        run: task php:e2e:test

  e2e-csharp:
    name: E2E gate — C#
    needs: [prepare, validate-versions, clone-vendors, build-parser-binaries]
    if: ${{ needs.prepare.outputs.release_csharp == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROJECT_ROOT: ${{ github.workspace }}
      TSLP_LINK_MODE: static
      TSLP_LANGUAGES: "python,rust,javascript,typescript,go,html,css,json,gherkin"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Download parsers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: language-parsers
          path: parsers
      - name: Wire e2e manifest
        uses: ./.github/actions/wire-e2e-manifest
        with:
          platform-label: linux-x86_64
          artifact-name: parsers-linux-x86_64
      - uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: publish-e2e-csharp
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "10.0.x"
      - uses: xberg-io/actions/install-task@v1
      - uses: xberg-io/actions/install-alef@v1
      - name: Run C# E2E tests
        run: task csharp:e2e:test

  e2e-go:
    name: E2E gate — Go
    needs: [prepare, validate-versions, clone-vendors, build-parser-binaries]
    if: ${{ needs.prepare.outputs.release_go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROJECT_ROOT: ${{ github.workspace }}
      TSLP_LINK_MODE: static
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Download parsers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: language-parsers
          path: parsers
      - name: Wire e2e manifest
        uses: ./.github/actions/wire-e2e-manifest
        with:
          platform-label: linux-x86_64
          artifact-name: parsers-linux-x86_64
      - uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: publish-e2e-go
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26"
          cache-dependency-path: packages/go/go.sum
      - name: Verify go.mod placement
        run: |
          test -f packages/go/go.mod || (echo "ERROR: go.mod missing at packages/go/go.mod" && exit 1)
      - uses: xberg-io/actions/install-task@v1
      - uses: xberg-io/actions/install-alef@v1
      - name: Run Go E2E tests
        run: task go:e2e:test

  e2e-cli:
    name: E2E gate — CLI
    needs: [prepare, validate-versions, clone-vendors]
    if: ${{ needs.prepare.outputs.release_homebrew == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROJECT_ROOT: ${{ github.workspace }}
      TSLP_LINK_MODE: static
      TSLP_LANGUAGES: "python,rust,javascript,typescript,go,html,css,json"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Download parsers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: language-parsers
          path: parsers
      - uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: publish-e2e-cli
      - name: Build CLI (release)
        run: cargo build --release --locked -p ts-pack-cli
      - name: Verify CLI binary exists
        run: |
          test -f target/release/ts-pack
      - name: Smoke test — version
        run: ./target/release/ts-pack --version
      - name: Smoke test — help
        run: ./target/release/ts-pack --help
      - name: Run CLI smoke test script
        run: |
          chmod +x test_apps/cli/smoke_test.sh
          TS_PACK_BIN=./target/release/ts-pack test_apps/cli/smoke_test.sh
      - name: Run grammar test (static subset)
        run: |
          chmod +x test_apps/cli/test_all_grammars.sh
          TS_PACK_BIN=./target/release/ts-pack \
            TS_PACK_LANGUAGES="python,rust,javascript,typescript,go,html,css,json" \
            test_apps/cli/test_all_grammars.sh

  e2e-plugin:
    name: E2E gate — agent plugin bundles
    needs: [prepare]
    if: ${{ needs.prepare.outputs.release_node == 'true' || needs.prepare.outputs.release_python == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - uses: xberg-io/actions/install-task@v1
      - name: Install ai-rulez
        run: pipx install ai-rulez
      # The plugin has no test suite. `plugin:verify` is the only failable check
      # that exists for it: it re-derives every generated bundle from
      # plugin/.ai-rulez and compares byte content + BLAKE3 provenance, so it goes
      # red whenever a bundle was hand-edited or left stale. ~keep
      - name: Verify plugin bundles match source
        run: task plugin:verify

  e2e-c:
    name: E2E gate — C FFI
    needs: [prepare, validate-versions, clone-vendors, build-parser-binaries]
    if: ${{ needs.prepare.outputs.release_c_ffi == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROJECT_ROOT: ${{ github.workspace }}
      TSLP_LINK_MODE: static
      TSLP_LANGUAGES: "python,rust,javascript,typescript,go,html,css,json,gherkin"
      LD_LIBRARY_PATH: ${{ github.workspace }}/target/release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Download parsers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: language-parsers
          path: parsers
      - name: Wire e2e manifest
        uses: ./.github/actions/wire-e2e-manifest
        with:
          platform-label: linux-x86_64
          artifact-name: parsers-linux-x86_64
      - uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: publish-e2e-c
      - uses: xberg-io/actions/install-task@v1
      - uses: xberg-io/actions/install-alef@v1
      - name: Install poly
        uses: Goldziher/poly@v0
      # e2e/c/test_*.c is gitignored (.gitignore:95), so a fresh checkout of the release ref
      # contains only the Makefile, main.c and download_ffi.sh. Without regenerating them,
      # `make` dies on the alphabetically first missing category with "No rule to make
      # target 'test_data_extraction.c'". ci-e2e.yaml's `test-c-ffi` generates first. ~keep
      - name: Generate C E2E tests
        run: task c:e2e:generate
      - name: Run C E2E tests
        run: task c:e2e:test

  publish-crates:
    name: Publish Rust crates
    needs: [
      prepare,
      validate-versions,
      clone-vendors,
      check-registries,
      build-parser-sources,
      e2e-rust,
      finalize-github-release,
    ]
    if: |
      always() &&
      needs.prepare.outputs.release_crates == 'true' &&
      needs.e2e-rust.result == 'success' &&
      needs.validate-versions.result == 'success' &&
      needs.clone-vendors.result == 'success' &&
      needs.build-parser-sources.result == 'success' &&
      needs.finalize-github-release.outputs.promoted == 'true' &&
      (fromJson(needs.check-registries.outputs.results).cratesio != 'true' || needs.prepare.outputs.force_republish == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Download parsers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: language-parsers
          path: parsers

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          components: ""
          use-sccache: "false"
          install-llvm-cov: "false"

      - name: Publish crates
        uses: xberg-io/actions/publish-crates@v1
        with:
          crates: "tree-sitter-language-pack ts-pack-cli"
          version: ${{ needs.prepare.outputs.version }}
          dry-run: ${{ needs.prepare.outputs.dry_run }}

  publish-pypi:
    name: Publish Python to PyPI
    needs: [prepare, validate-versions, check-registries, build-python-wheels, build-python-sdist, e2e-python]
    if: |
      always() &&
      needs.prepare.outputs.release_python == 'true' &&
      needs.validate-versions.result == 'success' &&
      needs.build-python-wheels.result == 'success' &&
      needs.e2e-python.result == 'success' &&
      needs.build-python-sdist.result == 'success' &&
      (fromJson(needs.check-registries.outputs.results).pypi != 'true' || needs.prepare.outputs.force_republish == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: python-wheel-*
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-sdist
          path: dist

      - name: Dry run summary
        if: ${{ needs.prepare.outputs.dry_run == 'true' }}
        run: |
          {
            echo "## PyPI Dry Run"
            echo "Wheels staged for PyPI:"
            echo '```'
            ls -1 dist/*.whl
            echo '```'
            echo "Sdist staged for PyPI:"
            echo '```'
            ls -1 dist/*.tar.gz
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to PyPI
        uses: xberg-io/actions/publish-pypi@v1
        with:
          packages-dir: dist
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          expected-version: ${{ needs.prepare.outputs.pypi_version }}

  publish-node:
    name: Publish Node.js to npm
    needs: [prepare, validate-versions, check-registries, build-node-native, e2e-node]
    if: |
      always() &&
      needs.prepare.outputs.release_node == 'true' &&
      needs.validate-versions.result == 'success' &&
      needs.build-node-native.result == 'success' &&
      needs.e2e-node.result == 'success' &&
      (fromJson(needs.check-registries.outputs.results).npm != 'true' || needs.prepare.outputs.force_republish == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install NAPI-RS CLI
        run: npm install -g @napi-rs/cli

      - name: Download all native modules
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: crates/ts-pack-core-node/artifacts
          pattern: node-native-*
          merge-multiple: true

      - name: Prepare platform packages
        working-directory: crates/ts-pack-core-node
        run: |
          echo "=== Downloaded artifacts ==="
          find artifacts -name '*.node' -type f
          echo ""
          napi create-npm-dirs --npm-dir npm
          napi artifacts --build-output-dir artifacts --npm-dir npm
          echo "=== Generated platform packages ==="
          find npm -name '*.node' -type f

      - name: Pack platform packages
        working-directory: crates/ts-pack-core-node/npm
        run: |
          for dir in ./*/; do
            if [ -f "$dir/package.json" ]; then
              (cd "$dir" && npm pack && mv ./*.tgz ..)
            fi
          done
          echo "=== Packed tarballs ==="
          ls -lh ./*.tgz

      - name: Dry run summary
        if: ${{ needs.prepare.outputs.dry_run == 'true' }}
        working-directory: crates/ts-pack-core-node
        run: |
          {
            echo "## npm Dry Run"
            echo "Platform packages staged:"
            echo '```'
            find npm -name '*.node' -type f
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Re-check npm before publish
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        id: recheck
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: npm
          package: "@xberg-io/tree-sitter-language-pack"
          version: ${{ needs.prepare.outputs.version }}

      - name: Publish platform packages to npm
        if: ${{ needs.prepare.outputs.dry_run != 'true' && steps.recheck.outputs.exists != 'true' }}
        uses: xberg-io/actions/publish-npm@v1
        with:
          packages-dir: crates/ts-pack-core-node/npm
          npm-tag: ${{ needs.prepare.outputs.npm_tag }}
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          expected-version: ${{ needs.prepare.outputs.version }}

      - name: Publish main package to npm
        if: ${{ needs.prepare.outputs.dry_run != 'true' && steps.recheck.outputs.exists != 'true' }}
        uses: xberg-io/actions/publish-npm@v1
        with:
          package-dir: crates/ts-pack-core-node
          npm-tag: ${{ needs.prepare.outputs.npm_tag }}
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          expected-version: ${{ needs.prepare.outputs.version }}

  # The `publish-node` gate below is deliberately negative-form. Unlike the
  # `publish-crates` gates elsewhere in this file, WASM does not CONSUME the node
  # package -- it is an independent npm package and the dependency is ordering
  # only. `== 'success'` would wrongly block WASM whenever publish-node is
  # legitimately skipped (npm already at this version, or node not in targets),
  # which is a skip-cascade, not a safety gate. Blocking only on an actual
  # failure is the correct semantics here. ~keep
  publish-wasm:
    name: Publish WASM to npm
    needs: [prepare, validate-versions, check-registries, build-wasm, publish-node, e2e-wasm]
    if: |
      always() &&
      needs.prepare.outputs.release_wasm == 'true' &&
      needs.validate-versions.result == 'success' &&
      needs.build-wasm.result == 'success' &&
      needs.e2e-wasm.result == 'success' &&
      needs.publish-node.result != 'failure' &&
      needs.publish-node.result != 'cancelled' &&
      (fromJson(needs.check-registries.outputs.results)['npm-wasm'] != 'true' || needs.prepare.outputs.force_republish == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Download WASM package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-pkg
          path: crates/ts-pack-core-wasm/pkg

      - name: Dry run summary
        if: ${{ needs.prepare.outputs.dry_run == 'true' }}
        run: |
          {
            echo "## npm WASM Dry Run"
            echo "WASM package staged for npm:"
            echo '```'
            ls -1 crates/ts-pack-core-wasm/pkg/
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Re-check npm before publish
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        id: recheck
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: npm
          package: "@xberg-io/tree-sitter-language-pack-wasm"
          version: ${{ needs.prepare.outputs.version }}

      - name: Publish to npm
        if: ${{ needs.prepare.outputs.dry_run != 'true' && steps.recheck.outputs.exists != 'true' }}
        uses: xberg-io/actions/publish-npm@v1
        with:
          package-dir: crates/ts-pack-core-wasm/pkg
          npm-tag: ${{ needs.prepare.outputs.npm_tag }}
          provenance: "true"
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          expected-version: ${{ needs.prepare.outputs.version }}

      - name: Wait for npm indexing
        if: ${{ needs.prepare.outputs.dry_run != 'true' && steps.recheck.outputs.exists != 'true' }}
        uses: xberg-io/actions/wait-for-package@v1
        with:
          registry: npm
          package: "@xberg-io/tree-sitter-language-pack-wasm"
          version: ${{ needs.prepare.outputs.version }}
          max-attempts: "20"

  publish-rubygems:
    name: Publish Ruby gems
    needs: [prepare, validate-versions, check-registries, build-ruby-gem, e2e-ruby]
    if: |
      always() &&
      needs.prepare.outputs.release_ruby == 'true' &&
      needs.validate-versions.result == 'success' &&
      needs.build-ruby-gem.result == 'success' &&
      needs.e2e-ruby.result == 'success' &&
      (fromJson(needs.check-registries.outputs.results).rubygems != 'true' || needs.prepare.outputs.force_republish == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4"
          bundler: none
          bundler-cache: false

      - name: Download Ruby gem artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rubygems-*
          path: dist
          merge-multiple: true

      - name: Rewrite native dependencies
        uses: xberg-io/actions/rewrite-native-deps@v1
        with:
          lang: ruby

      - name: Build source gem (fallback for unsupported platforms)
        working-directory: packages/ruby
        run: |
          gem build ./*.gemspec
          cp ./*.gem ../../dist/ 2>/dev/null || true
        env:
          PROJECT_ROOT: ${{ github.workspace }}

      - name: List all gems for publishing
        working-directory: dist
        run: |
          echo "=== All gems to publish ==="
          ls -lh tree_sitter_language_pack-*.gem 2>/dev/null || echo "(no gems found)"
          gem_count=$(find . -maxdepth 1 -name 'tree_sitter_language_pack-*.gem' -print | wc -l)
          echo "Total gems: $gem_count"

      - name: Dry run summary
        if: ${{ needs.prepare.outputs.dry_run == 'true' }}
        run: |
          {
            echo "## RubyGems Dry Run"
            echo "Gems staged for RubyGems:"
            echo '```'
            ls -1 dist/tree_sitter_language_pack-*.gem 2>/dev/null || echo "(no gems)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Re-check RubyGems before publish
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        id: recheck
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: rubygems
          package: tree_sitter_language_pack
          version: ${{ needs.prepare.outputs.version }}

      - name: Configure trusted publishing credentials
        if: ${{ needs.prepare.outputs.dry_run != 'true' && steps.recheck.outputs.exists != 'true' }}
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Publish gems to RubyGems
        if: ${{ needs.prepare.outputs.dry_run != 'true' && steps.recheck.outputs.exists != 'true' }}
        uses: xberg-io/actions/publish-rubygems@v1
        with:
          gems-dir: dist
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          expected-version: ${{ needs.prepare.outputs.gem_version }}

  publish-maven:
    name: Publish Maven package
    needs: [prepare, validate-versions, check-registries, build-java-package, e2e-java]
    if: |
      always() &&
      needs.prepare.outputs.release_java == 'true' &&
      needs.validate-versions.result == 'success' &&
      needs.build-java-package.result == 'success' &&
      needs.e2e-java.result == 'success' &&
      (fromJson(needs.check-registries.outputs.results).maven != 'true' || needs.prepare.outputs.force_republish == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Re-check Maven Central before publish
        id: recheck
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: maven
          package: io.xberg.treesitterlanguagepack:tree-sitter-language-pack
          version: ${{ needs.prepare.outputs.version }}

      - name: Setup Java
        if: ${{ needs.prepare.outputs.dry_run != 'true' && steps.recheck.outputs.exists != 'true' }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: ossrh
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Setup Maven
        if: ${{ needs.prepare.outputs.dry_run != 'true' && steps.recheck.outputs.exists != 'true' }}
        uses: xberg-io/actions/setup-maven@v1

      - name: Download Java native artifacts (re-stage for deploy rebuild)
        if: ${{ needs.prepare.outputs.dry_run != 'true' && steps.recheck.outputs.exists != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: java-natives-*
          path: artifacts/java-natives
          merge-multiple: false

      - name: Re-stage Java native resources
        if: ${{ needs.prepare.outputs.dry_run != 'true' && steps.recheck.outputs.exists != 'true' }}
        shell: bash
        run: |
          ARTIFACTS_DIR="artifacts/java-natives"
          RESOURCES_DIR="packages/java/src/main/resources/natives"
          REQUIRED_CLASSIFIERS="linux-x86_64 linux-aarch64 macos-arm64 macos-x86_64 windows-x86_64 windows-aarch64"
          mkdir -p "$RESOURCES_DIR"
          # build-java-natives@v1 stages each lib at
          # `{output-dir}/native/{classifier}/{libfile}` and uploads that tree as
          # artifact `java-natives-{label}`. download-artifact with
          # `merge-multiple: false` preserves the artifact-name wrapper, so the
          # final layout is:
          #   $ARTIFACTS_DIR/java-natives-{label}/native/{classifier}/{libfile}
          # The classifier is the lib's immediate parent — one `dirname` up.
          find "$ARTIFACTS_DIR" \( -name '*.so' -o -name '*.dll' -o -name '*.dylib' \) -print0 |
          while IFS= read -r -d '' f; do
            platform=$(basename "$(dirname "$f")")
            mkdir -p "$RESOURCES_DIR/$platform"
            cp "$f" "$RESOURCES_DIR/$platform/"
          done
          echo "=== Staged native resources for deploy ==="
          find "$RESOURCES_DIR" -type f | sort
          # Fail loudly if any required classifier directory is empty — this
          # caught us on 1.8.1 where natives collapsed under `natives/native/`
          # because the previous loop used `dirname "$(dirname …)"`.
          missing=()
          for c in $REQUIRED_CLASSIFIERS; do
            if ! ls "$RESOURCES_DIR/$c"/*ts_pack_core_ffi* >/dev/null 2>&1; then
              missing+=("$c")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::missing classifier dirs: ${missing[*]}"
            exit 1
          fi

      - name: Publish to Maven Central
        if: ${{ needs.prepare.outputs.dry_run != 'true' && steps.recheck.outputs.exists != 'true' }}
        uses: xberg-io/actions/publish-maven@v1
        with:
          pom-file: packages/java/pom.xml
          maven-profile: publish
          extra-args: -DskipTests
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          expected-version: ${{ needs.prepare.outputs.version }}
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Dry run summary
        if: ${{ needs.prepare.outputs.dry_run == 'true' }}
        run: echo "Dry run requested; Maven publish skipped." >> "$GITHUB_STEP_SUMMARY"

  publish-hex:
    name: Publish Elixir to Hex.pm
    needs: [prepare, validate-versions, check-registries, publish-crates, upload-elixir-release]
    if: |
      always() &&
      needs.prepare.outputs.release_elixir == 'true' &&
      needs.validate-versions.result == 'success' &&
      needs.upload-elixir-release.result == 'success' &&
      (fromJson(needs.check-registries.outputs.results).hex != 'true' || needs.prepare.outputs.force_republish == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: hex
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Setup Elixir
        uses: erlef/setup-elixir@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.16"
          otp-version: "26.2"
          version-type: strict

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Generate checksums from GitHub release
        run: ./scripts/publish/elixir/generate_checksums.sh "${{ needs.prepare.outputs.version }}"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Install Elixir dependencies
        working-directory: packages/elixir
        run: mix deps.get

      - name: Verify checksum file exists before compile
        run: |
          CHECKSUM_FILE="packages/elixir/checksum-Elixir.TreeSitterLanguagePack.Native.exs"
          if [[ ! -f "$CHECKSUM_FILE" ]]; then
            echo "ERROR: Checksum file not found: $CHECKSUM_FILE"
            echo "The generate_checksums.sh step must have failed silently."
            exit 1
          fi
          echo "Checksum file present: $CHECKSUM_FILE"
          echo "Contents:"
          cat "$CHECKSUM_FILE"

      - name: Patch Rustler --cfg flag placement
        working-directory: packages/elixir
        run: |
          sed -i 's/args ++ \["--cfg", "build_#{System.system_time(:millisecond)}"\]/args ++ ["--", "--cfg", "build_#{System.system_time(:millisecond)}"]/' deps/rustler/lib/rustler/compiler.ex

      - name: Compile project (precompiled mode — checksums already generated)
        working-directory: packages/elixir
        run: mix compile

      - name: Re-check Hex.pm before publish
        id: recheck
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: hex
          package: tree_sitter_language_pack
          version: ${{ needs.prepare.outputs.version }}

      - name: Validate Hex tarball build (dry-run)
        if: ${{ needs.prepare.outputs.dry_run == 'true' }}
        uses: xberg-io/actions/build-elixir-hex@v1
        with:
          package-dir: packages/elixir
          nif-crate-path: packages/elixir/native/tree_sitter_language_pack_nif
          dry-run: "true"
          rewrite-native-deps: "false"

      - name: Publish to Hex.pm
        if: ${{ needs.prepare.outputs.dry_run != 'true' && steps.recheck.outputs.exists != 'true' }}
        uses: xberg-io/actions/publish-hex@v1
        with:
          package-dir: packages/elixir
          skip-docs: "true"
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          expected-version: ${{ needs.prepare.outputs.version }}
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

      - name: Dry run summary
        if: ${{ needs.prepare.outputs.dry_run == 'true' }}
        run: echo "Dry run requested; Hex.pm publish skipped (tarball build validated above)." >> "$GITHUB_STEP_SUMMARY"

