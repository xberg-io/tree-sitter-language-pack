  build-ruby-gem:
    name: Build Ruby gem (${{ matrix.label }})
    # upload-parser-binaries publishes parsers.json to the release; the gem's
    # "Verify platform gem" step downloads it at runtime, so it must run first
    # (otherwise get_parser 404s on the not-yet-uploaded manifest).
    needs: [prepare, validate-versions, clone-vendors, publish-crates, upload-parser-binaries]
    # `== 'success'` on both, never `!= 'failure'` and never a bare `needs:`
    # edge: `!cancelled()` disables the implicit all-needs-succeeded rule, so a
    # SKIPPED publish-crates or upload-parser-binaries would otherwise let this
    # job build a gem against a crate that is not on crates.io and a parsers.json
    # that is not on the release. ~keep
    if: ${{ !cancelled() && needs.publish-crates.result == 'success' && needs.upload-parser-binaries.result == 'success' && needs.prepare.outputs.release_ruby == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      BUNDLER_VERSION: "4.0.7"
      RB_SYS_CARGO_PROFILE: release
    strategy:
      fail-fast: false
      matrix:
