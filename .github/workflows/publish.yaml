  build-php-extension:
    name: Build PHP PIE binary (php${{ matrix.php }} ${{ matrix.platform.label }})
    needs: [prepare, validate-versions, clone-vendors, publish-crates]
    # `== 'success'`, never `!= 'failure'` — see build-python-sdist. This matrix
    # is 18 jobs wide; a SKIPPED publish-crates used to fan the same crates.io
    # resolver failure out across all of them. ~keep
    if: ${{ !cancelled() && needs.publish-crates.result == 'success' && needs.prepare.outputs.release_php == 'true' }}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
        platform:
          - os: ubuntu-latest
            label: linux-x86_64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            label: linux-arm64
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            label: macos-arm64
            target: aarch64-apple-darwin
          - os: macos-15-intel
            label: macos-x86_64
            target: x86_64-apple-darwin
          - os: windows-latest
            label: windows-x86_64
            target: x86_64-pc-windows-msvc
        exclude:
          - php: "8.5"
            platform:
              label: windows-x86_64
          - php: "8.5"
            platform:
              label: macos-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Download parsers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: language-parsers
          path: parsers

      - name: Setup PHP
        uses: xberg-io/actions/setup-php@v1
        with:
          php-version: ${{ matrix.php }}

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: publish-php-${{ matrix.platform.label }}-php${{ matrix.php }}
          toolchain: stable

      - name: Install alef
        uses: xberg-io/actions/install-alef@v1

      - name: Build PHP extension
        uses: xberg-io/actions/build-php-extension@v1
        with:
          crate-name: ts-pack-core-php
          lib-name: ts_pack_core_php
          php-version: ${{ matrix.php }}
          php-ts: nts
          dry-run: ${{ needs.prepare.outputs.dry_run }}

      - name: Determine Windows compiler
        if: runner.os == 'Windows'
        id: wincompiler
        shell: pwsh
        run: |
          $compiler = switch ('${{ matrix.php }}') {
            '8.2' { 'vs16' }
            '8.3' { 'vs16' }
            '8.4' { 'vs17' }
            '8.5' { 'vs17' }
            default { 'vs17' }
          }
          "compiler=$compiler" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Package PIE archive
        uses: xberg-io/actions/package-php-pie@v1
        with:
          php-version: ${{ matrix.php }}
          php-ts: nts
          target: ${{ matrix.platform.target }}
          windows-compiler: ${{ steps.wincompiler.outputs.compiler }}
          version: ${{ needs.prepare.outputs.version }}
          output-dir: dist/php-package
          dry-run: ${{ needs.prepare.outputs.dry_run }}

      - name: Upload PHP PIE package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: php-package-${{ matrix.platform.label }}-php${{ matrix.php }}
          path: |
            dist/php-package/php_*.tgz
            dist/php-package/php_*.tgz.sha256
            dist/php-package/php_*.zip
            dist/php-package/php_*.zip.sha256
          retention-days: 14

