  build-dart-native:
    name: Build Dart native library (${{ matrix.label }})
    needs: [prepare, validate-versions, clone-vendors, check-registries]
    if: ${{ needs.prepare.outputs.release_dart == 'true' && (fromJson(needs.check-registries.outputs.results).pub != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            label: macos-arm64
            target: aarch64-apple-darwin
          - os: macos-15-intel
            label: macos-x64
            target: x86_64-apple-darwin
          - os: windows-latest
            label: windows-x64
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
      - name: Download parsers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: language-parsers
          path: parsers
      - uses: xberg-io/actions/setup-rust@v1
        with:
          target: ${{ matrix.target }}
      - uses: xberg-io/actions/build-dart-package@v1
        id: build
        with:
          package-dir: packages/dart/rust
          crate-name: tree-sitter-language-pack-dart
      - name: Stage native library for assembly
        shell: bash
        run: |
          set -euo pipefail
          lib_path="${{ steps.build.outputs.library-path }}"
          output_dir="dart-natives/${{ matrix.label }}"

          if [[ ! -f "$lib_path" ]]; then
            echo "Error: built library not found at $lib_path"
            exit 1
          fi

          mkdir -p "$output_dir"
          echo "Copying native library from $lib_path to $output_dir/"
          cp "$lib_path" "$output_dir/"

          if find "$output_dir" -maxdepth 1 -type f \( -name "*.so" -o -name "*.dylib" -o -name "*.dll" \) -print -quit | grep -q .; then
            echo "Native library staged successfully"
          else
            echo "Error: no native library found after copy"
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dart-native-${{ matrix.label }}
          path: dart-natives/${{ matrix.label }}/
          if-no-files-found: error
          retention-days: 7

  assemble-dart-package:
    name: Assemble Dart package with natives
    permissions:
      contents: write
    needs: [prepare, validate-versions, clone-vendors, check-registries, build-dart-native]
    if: ${{ needs.prepare.outputs.release_dart == 'true' && (fromJson(needs.check-registries.outputs.results).pub != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
      - name: Download native libraries for all platforms
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dart-native-*
          path: dart-natives
      - name: Package native download assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 scripts/publish/dart/package_native_assets.py dart-natives dist/dart "$VERSION"
      - name: Upload Dart native download assets
        uses: xberg-io/actions/upload-release-assets@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          working-directory: dist/dart
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          assets: |
            *.tar.gz
            *.sha256
      - name: Stage natives into Dart package
        shell: bash
        run: |
          set -euo pipefail
          lib_dir="packages/dart/lib/src/native"
          mkdir -p "$lib_dir"

          # download-artifact@v8 (without merge-multiple) extracts each
          # artifact to `dart-natives/<artifact-name>/`. The artifact
          # name is `dart-native-<rid>`, so each native lands at
          # `dart-natives/dart-native-<rid>/<file>`. Derive rid from
          # the parent dir name by stripping the `dart-native-` prefix.
          # Fail loudly if no natives are found — same defensive
          # pattern as stage-go-ffi.
          mapfile -t natives < <(find dart-natives -type f \( -name '*.so' -o -name '*.dylib' -o -name '*.dll' \))
          if [[ ${#natives[@]} -eq 0 ]]; then
            echo "ERROR: no native libraries found under dart-natives/" >&2
            find dart-natives -maxdepth 4 -print
            exit 1
          fi

          staged_rids=()
          for f in "${natives[@]}"; do
            artifact_dir="$(basename "$(dirname "$f")")"
            rid="${artifact_dir#dart-native-}"
            case "$rid" in
              linux-x64|linux-arm64|macos-arm64|macos-x64|windows-x64|windows-arm64) ;;
              *)
                echo "Warning: unrecognized rid '$rid' (from artifact '$artifact_dir') for $f; skipping"
                continue
                ;;
            esac
            mkdir -p "$lib_dir/$rid"
            cp "$f" "$lib_dir/$rid/"
            staged_rids+=("$rid")
            echo "Staged $(basename "$f") → $lib_dir/$rid/"
          done

          echo "Native library structure:"
          find "$lib_dir" -type f \( -name "*.so" -o -name "*.dylib" -o -name "*.dll" \) | sort
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dart-package-assembled
          path: packages/dart
          if-no-files-found: error
          retention-days: 7

  # Test gates for the four bindings whose e2e suites CI never executed.
  # GitHub Actions cannot express a `needs:` on a job in another workflow, so
  # the gate has to live in this workflow; these jobs re-run the same
  # `.task/*.yml` e2e entrypoints that ci-e2e.yaml runs on PRs, against the
  # release ref. ~keep
  e2e-dart:
    name: E2E gate — Dart
    needs: [prepare, validate-versions, clone-vendors, check-registries, build-parser-binaries]
    if: ${{ needs.prepare.outputs.release_dart == 'true' && (fromJson(needs.check-registries.outputs.results).pub != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROJECT_ROOT: ${{ github.workspace }}
      TSLP_LINK_MODE: static
      TSLP_LANGUAGES: "mojo,nim,norg"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Download parsers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: language-parsers
          path: parsers
      - name: Wire e2e manifest
        uses: ./.github/actions/wire-e2e-manifest
        with:
          platform-label: linux-x86_64
          artifact-name: parsers-linux-x86_64
      - uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: publish-e2e-dart
      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
      - uses: xberg-io/actions/install-task@v1
      - name: Run Dart E2E tests
        run: task dart:e2e:test

  trigger-pubdev:
    name: Trigger pub.dev publish workflow
    needs: [prepare, check-registries, assemble-dart-package, e2e-dart]
    if: |
      needs.prepare.outputs.release_dart == 'true' &&
      needs.assemble-dart-package.result == 'success' &&
      needs.prepare.outputs.dry_run != 'true' &&
      (fromJson(needs.check-registries.outputs.results).pub != 'true' || needs.prepare.outputs.force_republish == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      # `gh workflow run` returns as soon as GitHub accepts the dispatch, so this
      # job used to go green whether or not pub.dev ever saw the package — the
      # publish outcome lived in a run nothing in this workflow observed. Poll
      # the dispatched run to completion and adopt its conclusion, so a pub.dev
      # failure is a failure HERE, where the aggregate gate can see it.
      #
      # The indirection itself is not optional: pub.dev OIDC trusted publishing
      # rejects tokens minted for a `release` event, so publish.yaml cannot
      # publish to pub.dev directly. See publish-pubdev.yaml. ~keep
      - name: Dispatch publish-pubdev workflow and wait for it
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          # 60s of slack absorbs any skew between this runner's clock and the
          # createdAt GitHub stamps on the run. ~keep
          dispatched_after="$(date -u -d '60 seconds ago' +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run publish-pubdev.yaml --ref "${TAG}" -f run_id="${SOURCE_RUN_ID}"

          # The dispatch API returns no run id, so find the run it created: the
          # newest publish-pubdev workflow_dispatch run on this tag that started
          # at or after the dispatch. ~keep
          # `|| true` and `if/then/break` rather than `cmd && break`: under
          # `set -e` a transient API error, or a falsy test as the loop body's
          # last command, would abort the job instead of retrying. ~keep
          run_id=""
          for _ in $(seq 1 30); do
            sleep 10
            run_id="$(gh run list \
              --workflow=publish-pubdev.yaml \
              --event=workflow_dispatch \
              --branch "${TAG}" \
              --limit 20 \
              --json databaseId,createdAt \
              --jq "[.[] | select(.createdAt >= \"${dispatched_after}\")] | sort_by(.createdAt) | last | .databaseId // empty" \
              || true)"
            if [[ -n "${run_id}" ]]; then
              break
            fi
          done

          if [[ -z "${run_id}" ]]; then
            echo "::error::publish-pubdev.yaml was dispatched for ${TAG} but no matching run appeared within 5 minutes."
            exit 1
          fi

          echo "Watching publish-pubdev run ${run_id}"
          # `gh run watch --exit-status` exits non-zero when the run fails, so
          # this job's conclusion becomes the pub.dev publish conclusion. ~keep
          gh run watch "${run_id}" --exit-status --interval 15

  build-swift-artifactbundle:
    name: Build Swift artifact bundle
    needs: [prepare, validate-versions, clone-vendors]
    if: ${{ needs.prepare.outputs.release_swift == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
      - name: Download parsers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: language-parsers
          path: parsers
      - uses: xberg-io/actions/setup-rust@v1
      - uses: xberg-io/actions/build-swift-artifactbundle@v1
        id: bundle
        with:
          crate-name: tree-sitter-language-pack-swift
          artifact-name: TreeSitterLanguagePack-rs
          binary-target-name: RustBridgeBinary
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swift-artifactbundle
          path: ${{ steps.bundle.outputs.bundle-zip }}
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swift-checksum
          path: ${{ steps.bundle.outputs.checksum-file }}
          if-no-files-found: error
          retention-days: 14

  build-swift-package:
    name: Build Swift package
    needs: [prepare, validate-versions, clone-vendors]
    if: ${{ needs.prepare.outputs.release_swift == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
      - name: Download parsers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: language-parsers
          path: parsers
      - uses: xberg-io/actions/setup-rust@v1
      - uses: xberg-io/actions/build-swift-package@v1
        with:
          package-dir: packages/swift
          crate-name: tree-sitter-language-pack-swift
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swift-package
          path: packages/swift
          retention-days: 14

  e2e-swift:
    name: E2E gate — Swift
    needs: [prepare, validate-versions, clone-vendors, build-parser-binaries]
    if: ${{ needs.prepare.outputs.release_swift == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      PROJECT_ROOT: ${{ github.workspace }}
      TSLP_LINK_MODE: static
      TSLP_LANGUAGES: "mojo,nim,norg"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Download parsers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: language-parsers
          path: parsers
      - name: Wire e2e manifest
        uses: ./.github/actions/wire-e2e-manifest
        with:
          platform-label: macos-arm64
          artifact-name: parsers-macos-arm64
      - uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: publish-e2e-swift
      - uses: xberg-io/actions/install-task@v1
      # Targets e2e/swift_e2e via .task/swift.yml. alef.toml's swift `e2e`
      # command is a duplicate of its unit-test `command` and does not reach
      # the e2e suite. ~keep
      - name: Run Swift E2E tests
        run: task swift:e2e:test

  update-swift-package-manifest:
    name: Update Swift Package.swift manifest with version and checksum
    needs: [prepare, build-swift-artifactbundle, e2e-swift]
    if: ${{ needs.prepare.outputs.release_swift == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: swift-checksum
          path: swift-checksums

      # A substitution has to prove it changed something. Count the placeholder BEFORE
      # substituting and fail on zero; asserting afterwards that the placeholder is gone
      # passes both when the sed worked and when the generator renamed the token, which is
      # the case the assertion exists to catch. `__ALEF_SWIFT_VERSION__` was exactly that
      # no-op here: Package.swift carries the artifactbundle version literally inside the
      # download URL, so that sed had nothing to match and silently did nothing every
      # release. The version is asserted against the URL instead. ~keep
      - name: Update Package.swift with version and checksum
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          CHECKSUM=$(cat swift-checksums/*.checksum | tr -d '[:space:]')

          if [[ -z "$CHECKSUM" ]]; then
            echo "::error::the swift-checksum artifact is empty; refusing to write a blank checksum"
            exit 1
          fi

          placeholders=$(grep -c '__ALEF_SWIFT_CHECKSUM__' Package.swift || true)
          if [[ "$placeholders" -eq 0 ]]; then
            echo "::error::Package.swift has no __ALEF_SWIFT_CHECKSUM__ to substitute — the release prep did not reset it, or the token was renamed."
            exit 1
          fi
          sed -i "s/__ALEF_SWIFT_CHECKSUM__/${CHECKSUM}/g" Package.swift

          if ! grep -q "/releases/download/v${VERSION}/" Package.swift; then
            echo "::error::the Package.swift artifactbundle URL does not point at v${VERSION}."
            grep -n 'releases/download' Package.swift || true
            exit 1
          fi

          echo "Updated Package.swift:"
          head -40 Package.swift

      - name: Commit and push Package.swift
        run: |
          git config user.name "xberg-dev-publisher[bot]"
          git config user.email "291994444+xberg-dev-publisher[bot]@users.noreply.github.com"
          git add Package.swift
          git commit -m "chore(swift): update Package.swift with checksum for v${{ needs.prepare.outputs.version }}"
          git tag -f "${{ needs.prepare.outputs.tag }}"
          git push origin -f "refs/tags/${{ needs.prepare.outputs.tag }}"
          # Also publish the checksummed commit to a release/swift/<version> branch. The
          # alef-generated Swift e2e/test-app pins `branch: "release/swift/<version>"`
          # (matching the liter-llm publish layout), so this ref must exist for SwiftPM to
          # resolve the package with the substituted XCFramework checksum.
          git push origin -f "HEAD:refs/heads/release/swift/${{ needs.prepare.outputs.version }}"

      - name: Download Swift artifact bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: swift-artifactbundle
          path: dist/swift

      - name: Upload Swift artifact bundle to GitHub Release
        uses: xberg-io/actions/upload-release-assets@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          working-directory: dist/swift
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          token: ${{ steps.app-token.outputs.token }}
          assets: |
            *.artifactbundle.zip

  build-zig-package:
    name: Build Zig package (${{ matrix.label }})
    needs: [prepare, validate-versions, clone-vendors, check-registries]
    if: ${{ needs.prepare.outputs.release_zig == 'true' && (fromJson(needs.check-registries.outputs.results).zig != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            label: linux-arm64
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            label: macos-arm64
            target: aarch64-apple-darwin
          - os: macos-15-intel
            label: macos-x64
            target: x86_64-apple-darwin
          - os: windows-latest
            label: windows-x64
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
      - name: Download parsers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: language-parsers
          path: parsers
      - uses: xberg-io/actions/setup-rust@v1
        with:
          target: ${{ matrix.target }}
      - uses: xberg-io/actions/install-alef@v1
      - name: Build and package Zig FFI
        shell: bash
        run: |
          set -euo pipefail
          # Build the FFI library for this target
          cargo build --release --locked --target ${{ matrix.target }} -p ts-pack-core-ffi

          # Package with alef for distribution
          alef publish build --lang ffi --target ${{ matrix.target }}
          alef publish package --lang zig \
            --target ${{ matrix.target }} \
            -o dist/zig-ffi

      - name: Fix macOS dylib install_name (Zig FFI)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "=== Fixing macOS dylib install_name in Zig FFI package ==="
          find dist/zig-ffi -name "*.dylib" -type f | while read -r dylib; do
            echo "Processing: $dylib"
            # Get the dylib filename
            dylib_name=$(basename "$dylib")
            echo "  Current install_name:"
            otool -D "$dylib" | tail -1 | sed 's/^/    /'
            # Rewrite to @rpath
            install_name_tool -id "@rpath/$dylib_name" "$dylib"
            echo "  New install_name:"
            otool -D "$dylib" | tail -1 | sed 's/^/    /'
          done
          echo "=== Zig FFI dylib install_name fixes complete ==="

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zig-ffi-${{ matrix.label }}
          path: dist/zig-ffi/
          if-no-files-found: error
          retention-days: 14

  e2e-zig:
    name: E2E gate — Zig
    needs: [prepare, validate-versions, clone-vendors, check-registries, build-parser-binaries]
    if: ${{ needs.prepare.outputs.release_zig == 'true' && (fromJson(needs.check-registries.outputs.results).zig != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROJECT_ROOT: ${{ github.workspace }}
      TSLP_LINK_MODE: static
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Download parsers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: language-parsers
          path: parsers
      - name: Wire e2e manifest
        uses: ./.github/actions/wire-e2e-manifest
        with:
          platform-label: linux-x86_64
          artifact-name: parsers-linux-x86_64
      - uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: publish-e2e-zig
      - uses: xberg-io/actions/setup-zig@v1
        with:
          version: "0.16.0"
      - uses: xberg-io/actions/install-task@v1
      # Runs e2e/zig. `packages/zig` has no test blocks, so `zig build test`
      # there passes without semantically analysing the generated module. ~keep
      - name: Run Zig E2E tests
        run: task zig:e2e:test

  publish-zig:
    name: Publish Zig package metadata to GitHub Release
    needs: [prepare, check-registries, build-zig-package, e2e-zig]
    if: ${{ needs.prepare.outputs.release_zig == 'true' && needs.prepare.outputs.dry_run != 'true' && (fromJson(needs.check-registries.outputs.results).zig != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Download Zig FFI tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: zig-ffi-*
          path: dist/zig
          merge-multiple: true
      - uses: xberg-io/actions/upload-release-assets@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          working-directory: dist/zig
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          token: ${{ steps.app-token.outputs.token }}
          assets: |
            **/*.tar.gz
            **/*.zip

  refresh-zig-package-hashes:
    name: Refresh test_apps/zig package hashes from the published tarballs
    needs: [prepare, publish-zig, finalize-github-release]
    if: |
      always() &&
      needs.prepare.outputs.release_zig == 'true' &&
      needs.prepare.outputs.dry_run != 'true' &&
      needs.finalize-github-release.outputs.promoted == 'true' &&
      needs.publish-zig.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A Zig package hash is a digest of the tarball, so it cannot be derived from a version
    # string: `alef sync-versions` repoints every `.url` during release prep and leaves the
    # `.hash` frozen at whatever release last set it. From 1.14.3 through 1.15.7 that meant
    # `test_apps/zig` shipped a manifest resolving nothing. The value is only knowable once the
    # assets exist, which is why this runs after `publish-zig` rather than during prep. ~keep
    #
    # `continue-on-error` is deliberate. The packages are already published by the time this
    # runs and nothing downstream consumes the test app, so a problem here must not turn an
    # otherwise successful release red. The trade-off is that a failure is easy to miss, so the
    # job writes its outcome — including the failure — to the run summary, and `ci-zig`
    # re-checks the same hashes on whatever commit this pushes. ~keep
    continue-on-error: true
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      # `main`, not `checkout_ref`: on a real release `checkout_ref` is the tag, and a commit
      # made on that detached head could only reach `main` by force-moving the tag. The
      # refreshed manifest belongs on `main`, which is where the next release reads it. ~keep
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - uses: xberg-io/actions/setup-zig@v1
        with:
          version: "0.16.0"

      # `main` can advance past the tag while a publish runs. If it already carries a newer,
      # unpublished version every URL would 404 and there is nothing here to refresh, so skip
      # rather than report a failure for the normal case. ~keep
      - name: Check the manifest still names this release
        id: scope
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if grep -q "/releases/download/${TAG}/" test_apps/zig/build.zig.zon; then
            echo "applies=true" >> "$GITHUB_OUTPUT"
            echo "test_apps/zig/build.zig.zon on main points at ${TAG}; refreshing its hashes."
          else
            echo "applies=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Zig package hashes — skipped"
              echo
              echo "\`test_apps/zig/build.zig.zon\` on \`main\` no longer points at \`${TAG}\`."
              echo "\`main\` has moved to another version, so there is nothing to refresh for"
              echo "this release. The next release refreshes it."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # `--require-published` because `publish-zig` succeeded and the release is already out
      # of draft: an asset that 404s here is a missing upload, not the pre-publish window, and
      # must not pass quietly. The script
      # fetches into a per-run global Zig cache so each digest is recomputed from a fresh
      # download — a warm cache would happily confirm the stale hash it is meant to reject. ~keep
      - name: Recompute hashes from the published tarballs
        if: steps.scope.outputs.applies == 'true'
        run: python3 scripts/sync_zig_zon_hashes.py --fix --require-published

      - name: Commit and push the refreshed hashes
        if: steps.scope.outputs.applies == 'true'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "xberg-dev-publisher[bot]"
          git config user.email "291994444+xberg-dev-publisher[bot]@users.noreply.github.com"
          if git diff --quiet -- test_apps/zig/build.zig.zon; then
            echo "Hashes already match the published tarballs; nothing to commit."
            echo "### Zig package hashes — already current for v${VERSION}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git --no-pager diff -- test_apps/zig/build.zig.zon
          git add test_apps/zig/build.zig.zon
          git commit --no-verify -m "chore(zig): refresh test_apps package hashes for v${VERSION}"
          git push origin HEAD:refs/heads/main
          {
            echo "### Zig package hashes — refreshed"
            echo
            echo "\`test_apps/zig/build.zig.zon\` on \`main\` now matches the \`v${VERSION}\` tarballs."
          } >> "$GITHUB_STEP_SUMMARY"

      # `continue-on-error` keeps a problem here from failing the release, which also means a
      # silent failure would go unnoticed. Say so in the run summary instead. ~keep
      - name: Report that the refresh did not happen
        if: failure()
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          {
            echo "### Zig package hashes — NOT refreshed"
            echo
            echo "This job failed. \`continue-on-error\` kept that from failing the release, so"
            echo "the published packages are unaffected — but \`test_apps/zig/build.zig.zon\` on"
            echo "\`main\` still declares hashes that do not match the \`v${VERSION}\` tarballs,"
            echo "and \`zig build\` in that app fails until they are regenerated."
            echo
            echo "Fix locally with \`task test-apps:fix-zig-hashes\` and commit the result."
            echo "See the step logs above for which asset or push failed."
          } >> "$GITHUB_STEP_SUMMARY"

  build-kotlin-android-natives:
    name: Build kotlin-android natives (${{ matrix.abi }})
    needs: [prepare, check-registries, clone-vendors]
    if: ${{ needs.prepare.outputs.release_kotlin_android == 'true' && (fromJson(needs.check-registries.outputs.results).maven-kotlin-android != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
          - abi: x86_64
            target: x86_64-linux-android
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
          - abi: x86
            target: i686-linux-android
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          submodules: recursive
      - name: Download parsers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: language-parsers
          path: parsers
      - uses: xberg-io/actions/setup-rust@v1
        with:
          target: ${{ matrix.target }}
          cache-key-prefix: kotlin-android-${{ matrix.abi }}
      - uses: xberg-io/actions/setup-android-ndk@v1
      - uses: xberg-io/actions/build-android-natives@v1
        with:
          crate-name: tree-sitter-language-pack-jni
          lib-name: ts_pack_jni
          abis: ${{ matrix.abi }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kotlin-android-${{ matrix.abi }}
          path: dist/android-natives/${{ matrix.abi }}/
          if-no-files-found: error

  e2e-kotlin-android:
    name: E2E gate — Kotlin Android
    needs: [prepare, check-registries, clone-vendors, build-parser-binaries]
    if: ${{ needs.prepare.outputs.release_kotlin_android == 'true' && (fromJson(needs.check-registries.outputs.results).maven-kotlin-android != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROJECT_ROOT: ${{ github.workspace }}
      TSLP_LINK_MODE: static
      TSLP_LANGUAGES: "python,rust,javascript,typescript,go,html,css,json,gherkin"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Download parsers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: language-parsers
          path: parsers
      - name: Wire e2e manifest
        uses: ./.github/actions/wire-e2e-manifest
        with:
          platform-label: linux-x86_64
          artifact-name: parsers-linux-x86_64
      - uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: publish-e2e-kotlin-android
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: xberg-io/actions/setup-gradle@v1
      # The generated suite is the host JVM `test` source set; src/androidTest
      # is not wired into any source set and is not executed. ~keep
      - name: Run Kotlin Android E2E tests
        working-directory: e2e/kotlin_android
        run: gradle test --no-daemon

  publish-kotlin-android:
    name: Publish kotlin-android (Maven Central via Gradle)
    needs: [prepare, check-registries, build-kotlin-android-natives, e2e-kotlin-android]
    if: ${{ needs.prepare.outputs.release_kotlin_android == 'true' && needs.prepare.outputs.dry_run != 'true' && (fromJson(needs.check-registries.outputs.results).maven-kotlin-android != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: kotlin-android-*
          path: kotlin-android-natives
          merge-multiple: false
      - name: Stage natives into AAR jniLibs
        shell: bash
        run: |
          for abi in arm64-v8a x86_64 armeabi-v7a x86; do
            src="kotlin-android-natives/kotlin-android-${abi}"
            [ -d "$src" ] || continue
            mkdir -p "packages/kotlin-android/src/main/jniLibs/${abi}"
            cp -v "${src}/libts_pack_jni.so" \
                  "packages/kotlin-android/src/main/jniLibs/${abi}/"
          done
      - uses: xberg-io/actions/publish-maven-gradle@v1
        with:
          working-directory: packages/kotlin-android
          gradle-task: publishAndReleaseToMavenCentral
          dry-run: ${{ needs.prepare.outputs.dry_run }}
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  build-cli:
    name: Build CLI (${{ matrix.label }})
    needs: [prepare, validate-versions, clone-vendors]
    if: needs.prepare.outputs.release_homebrew == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            target: x86_64-unknown-linux-gnu
            artifact: ts-pack-x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            label: linux-aarch64
            target: aarch64-unknown-linux-gnu
            artifact: ts-pack-aarch64-unknown-linux-gnu
          - os: macos-latest
            label: macos-arm64
            target: aarch64-apple-darwin
            artifact: ts-pack-aarch64-apple-darwin
          - os: macos-15-intel
            label: macos-x86_64
            target: x86_64-apple-darwin
            artifact: ts-pack-x86_64-apple-darwin
          - os: windows-latest
            label: windows-x86_64
            target: x86_64-pc-windows-msvc
            artifact: ts-pack-x86_64-pc-windows-msvc
          - os: windows-11-arm
            label: windows-aarch64
            target: aarch64-pc-windows-msvc
            artifact: ts-pack-aarch64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Download parsers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: language-parsers
          path: parsers

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          target: ${{ matrix.target }}
          components: ""
          use-sccache: "false"
          install-llvm-cov: "false"

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Get all language names
        id: langs
        uses: xberg-io/actions/list-language-definitions@v1

      - name: Build CLI
        run: cargo build --release --locked -p ts-pack-cli --target ${{ matrix.target }}
        env:
          PROJECT_ROOT: ${{ github.workspace }}
          TSLP_LANGUAGES: ${{ steps.langs.outputs.names }}
          TSLP_LINK_MODE: static

      - name: Package CLI (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/ts-pack staging/
          cd staging && tar -czf "../${{ matrix.artifact }}.tar.gz" ts-pack

      - name: Package CLI (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/ts-pack.exe staging/
          cd staging && 7z a "../${{ matrix.artifact }}.zip" ts-pack.exe

      - name: Upload CLI binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
          retention-days: 14

  upload-cli-release:
    name: Upload CLI binaries to GitHub Release
    needs: [prepare, build-cli, e2e-cli]
    if: |
      needs.prepare.outputs.dry_run != 'true' &&
      needs.build-cli.result == 'success' &&
      needs.e2e-cli.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Download CLI artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ts-pack-*
          path: dist/cli
          merge-multiple: true

      - name: Upload to GitHub Release
        uses: xberg-io/actions/publish-github-release@v1
        with:
          # Hold the release as a draft. finalize-github-release is the only job that
          # flips it public, and only after its asset-completeness check passes. ~keep
          draft: "true"
          tag: ${{ needs.prepare.outputs.tag }}
          title: "Release ${{ needs.prepare.outputs.tag }}"
          artifacts: |
            dist/cli/ts-pack-*.tar.gz
            dist/cli/ts-pack-*.zip
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          token: ${{ steps.app-token.outputs.token }}

  # `[package.metadata.binstall] pkg-url` resolves to a `releases/download/<tag>/` URL,
  # which 404s while the release is still a draft, so this can only run once
  # finalize-github-release has flipped it public. It gates on that job's `promoted`
  # output rather than its `.result`, which an unrelated upstream failure can poison. ~keep
  verify-binstall:
    name: Verify cargo-binstall install
    needs: [prepare, upload-cli-release, finalize-github-release]
    # ~keep `!cancelled()` is load-bearing. `finalize-github-release` is an `always()`/
    # `!cancelled()` job, so on a partial-target dispatch GitHub's skipped-state propagation
    # resumes at this job -- skipping it before this `if:` is ever evaluated, even with every
    # upstream leg green. Diagnosed on html-to-markdown runs 33491693123/33494806766/33495781759,
    # fixed there in 98d4537c41. Every need that must have succeeded is named explicitly below.
    if: ${{ !cancelled() && needs.prepare.outputs.dry_run != 'true' && needs.upload-cli-release.result == 'success' && needs.finalize-github-release.outputs.promoted == 'true' }}
    uses: xberg-io/actions/.github/workflows/reusable-binstall-verify.yml@v1
    with:
      package-name: ts-pack-cli
      binary-name: ts-pack
      manifest-path: crates/ts-pack-cli
      checkout-ref: ${{ needs.prepare.outputs.checkout_ref }}
      smoke-command: |
        ts-pack --version
        ts-pack list

  # Waits on the promotion: the render step hashes the release assets it points the
  # formula at, and both that download and the formula's own URLs 404 while the release
  # is a draft. Pushing the tap first would leave `brew install ts-pack` broken for the
  # length of the window. ~keep
  publish-homebrew-formula:
    name: Update Homebrew formula
    needs: [prepare, check-registries, upload-cli-release, upload-c-ffi-release, finalize-github-release]
    if: |
      always() &&
      needs.prepare.outputs.release_homebrew == 'true' &&
      needs.prepare.outputs.dry_run != 'true' &&
      needs.finalize-github-release.outputs.promoted == 'true' &&
      needs.upload-cli-release.result == 'success' &&
      needs.upload-c-ffi-release.result == 'success' &&
      (fromJson(needs.check-registries.outputs.results).homebrew != 'true' || needs.prepare.outputs.force_republish == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: tap-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io
          repositories: homebrew-tap

      - name: Checkout source repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Checkout homebrew-tap
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: xberg-io/homebrew-tap
          token: ${{ steps.tap-token.outputs.token }}
          path: homebrew-tap

      - name: Render formulas from templates
        uses: xberg-io/actions/publish-homebrew-source-formulas@v1
        with:
          tap-dir: ${{ github.workspace }}/homebrew-tap
          config-file: scripts/publish/homebrew.json
          tag: ${{ needs.prepare.outputs.tag }}
          version: ${{ needs.prepare.outputs.version }}
          github-repo: ${{ github.repository }}
          dry-run: ${{ needs.prepare.outputs.dry_run }}

      - name: Commit and push to tap
        working-directory: homebrew-tap
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
        run: |
          git config user.name "xberg-dev-publisher[bot]"
          git config user.email "291994444+xberg-dev-publisher[bot]@users.noreply.github.com"
          if git diff --quiet Formula/; then
            echo "No formula changes; skipping commit."
            exit 0
          fi
          git add Formula/ts-pack.rb Formula/libts-pack.rb
          git commit -m "tree-sitter-language-pack ${{ needs.prepare.outputs.version }}"
          # Every repo's publish pipeline pushes to this one shared tap, so a concurrent
          # release can land between our checkout and our push and reject it as non-fast-forward.
          # Each repo touches only its own formulas, so rebasing onto the new tip and retrying is
          # safe -- there is nothing for two releases to genuinely conflict over. ~keep
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto the current tap tip"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::tap rebase hit a real conflict; refusing to force the push"
              exit 1
            fi
            sleep $((attempt * 3))
          done
          echo "::error::could not push to the tap after 5 attempts"
          exit 1

  # The Windows counterpart of publish-homebrew-formula. There is deliberately no
  # `check-scoop` idempotency gate: the render step rewrites the manifest in place and
  # the commit below is guarded by `git diff --quiet bucket/`, so re-running a release
  # is already a no-op. ~keep
  publish-scoop-manifest:
    name: Update Scoop manifest
    # Same reason as publish-homebrew-formula: the render step hashes release assets
    # that 404 until finalize-github-release flips the release out of draft. ~keep
    needs: [prepare, upload-cli-release, finalize-github-release]
    # ~keep `!cancelled()` is load-bearing. `finalize-github-release` is an `always()`/
    # `!cancelled()` job, so on a partial-target dispatch GitHub's skipped-state propagation
    # resumes at this job -- skipping it before this `if:` is ever evaluated, even with every
    # upstream leg green. Diagnosed on html-to-markdown runs 33491693123/33494806766/33495781759,
    # fixed there in 98d4537c41. Every need that must have succeeded is named explicitly below.
    if: ${{ !cancelled() && needs.prepare.outputs.release_scoop == 'true' && needs.upload-cli-release.result == 'success' && needs.finalize-github-release.outputs.promoted == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: bucket-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io
          repositories: scoop-bucket

      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: source-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: xberg-io/scoop-bucket
          token: ${{ steps.bucket-token.outputs.token }}
          path: scoop-bucket
          persist-credentials: true

      - uses: xberg-io/actions/publish-scoop-manifests@v1
        with:
          bucket-dir: ${{ github.workspace }}/scoop-bucket
          config-file: scripts/publish/scoop.json
          tag: ${{ needs.prepare.outputs.tag }}
          version: ${{ needs.prepare.outputs.version }}
          github-repo: ${{ github.repository }}
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          token: ${{ steps.source-token.outputs.token }}

      - name: Commit and push to bucket
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        working-directory: scoop-bucket
        env:
          GH_TOKEN: ${{ steps.bucket-token.outputs.token }}
        run: |
          git config user.name "xberg-dev-publisher[bot]"
          git config user.email "291994444+xberg-dev-publisher[bot]@users.noreply.github.com"
          if git diff --quiet bucket/; then
            echo "No manifest changes; skipping commit."
            exit 0
          fi
          git add bucket/ts-pack.json
          git commit -m "ts-pack ${{ needs.prepare.outputs.version }}"
          # Six release pipelines push to this one bucket, so a concurrent release can land
          # between our checkout and our push and reject it as non-fast-forward. Each repo
          # touches only its own manifest, so rebasing onto the new tip and retrying is safe --
          # there is nothing for two releases to genuinely conflict over. ~keep
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto the current bucket tip"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::bucket rebase hit a real conflict; refusing to force the push"
              exit 1
            fi
            sleep $((attempt * 3))
          done
          echo "::error::could not push to the bucket after 5 attempts"
          exit 1

  homebrew-bottles:
    name: Build Homebrew bottle (${{ matrix.bottle_tag }})
    needs: [prepare, publish-homebrew-formula]
    if: |
      always() &&
      needs.prepare.outputs.dry_run != 'true' &&
      needs.publish-homebrew-formula.result == 'success'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bottle_tag: arm64_sequoia
            install_brew: false
          # ~keep The Intel macOS `sequoia` bottle is deliberately absent, not forgotten. From
          # 2026-09-01 Homebrew serves no `openssl@3` bottle for x86_64 macOS -- "We do not
          # provide support for this platform (as-of September 2026, announced August 2025)",
          # after Apple dropped Intel in macOS 27 -- so the bottle cannot build and no change
          # here can fix it. Leaving the entry in is not harmless: this job's failure propagates
          # into the aggregate release-status job, which reverts the GitHub release to a DRAFT
          # after every registry has already received its packages. That is what happened to
          # liter-llm 1.19.1 and to crawlberg 1.5.0 on 2026-09-01 -- both had shipped, and both
          # were invisible until the release was manually un-drafted. Re-adding this entry
          # re-arms that cascade.
          - os: ubuntu-latest
            bottle_tag: x86_64_linux
            install_brew: true
          - os: ubuntu-24.04-arm
            bottle_tag: arm64_linux
            install_brew: true
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - name: Checkout source repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Install Homebrew (Linux)
        if: ${{ matrix.install_brew }}
        uses: xberg-io/actions/install-homebrew-linux@v1

      - name: Build bottles
        uses: xberg-io/actions/homebrew-build-bottles@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          version: ${{ needs.prepare.outputs.version }}
          tap: xberg-io/homebrew-tap
          formulas: |
            ts-pack
            libts-pack
          out-dir: ${{ github.workspace }}/bottle-json
          github-repo: xberg-io/tree-sitter-language-pack
          token: ${{ steps.app-token.outputs.token }}

      - name: Upload bottle JSON manifests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-bottle-json-${{ matrix.bottle_tag }}
          path: ${{ github.workspace }}/bottle-json/*.json
          if-no-files-found: error

  publish-homebrew-bottles:
    name: Merge Homebrew bottle DSL
    needs: [prepare, publish-homebrew-formula, homebrew-bottles]
    if: |
      always() &&
      needs.prepare.outputs.dry_run != 'true' &&
      needs.publish-homebrew-formula.result == 'success' &&
      needs.homebrew-bottles.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: tap-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io
          repositories: homebrew-tap

      - name: Checkout source repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Checkout homebrew-tap
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: xberg-io/homebrew-tap
          token: ${{ steps.tap-token.outputs.token }}
          path: homebrew-tap

      - name: Download all bottle JSON manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ github.workspace }}/bottle-json
          pattern: homebrew-bottle-json-*
          merge-multiple: true

      - name: Merge bottle DSL into formulas
        uses: xberg-io/actions/homebrew-merge-bottles@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          version: ${{ needs.prepare.outputs.version }}
          tap-dir: ${{ github.workspace }}/homebrew-tap
          json-dir: ${{ github.workspace }}/bottle-json
          formulas: |
            ts-pack
            libts-pack
          github-repo: xberg-io/tree-sitter-language-pack

      - name: Commit and push bottle DSL
        working-directory: homebrew-tap
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
        run: |
          git config user.name "xberg-dev-publisher[bot]"
          git config user.email "291994444+xberg-dev-publisher[bot]@users.noreply.github.com"
          if git diff --quiet Formula/; then
            echo "No bottle DSL changes; skipping commit."
            exit 0
          fi
          git add Formula/ts-pack.rb Formula/libts-pack.rb
          git commit -m "tree-sitter-language-pack ${{ needs.prepare.outputs.version }}: add bottle DSL"
          # Every repo's publish pipeline pushes to this one shared tap, so a concurrent
          # release can land between our checkout and our push and reject it as non-fast-forward.
          # Each repo touches only its own formulas, so rebasing onto the new tip and retrying is
          # safe -- there is nothing for two releases to genuinely conflict over. ~keep
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto the current tap tip"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::tap rebase hit a real conflict; refusing to force the push"
              exit 1
            fi
            sleep $((attempt * 3))
          done
          echo "::error::could not push to the tap after 5 attempts"
          exit 1

  stage-go-ffi-libraries:
    name: Stage Go FFI libraries for Go module distribution
    needs: [prepare, build-go-ffi]
    if: |
      always() &&
      needs.prepare.outputs.release_go == 'true' &&
      needs.build-go-ffi.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Configure git
        run: |
          git config user.name "xberg-dev-publisher[bot]"
          git config user.email "291994444+xberg-dev-publisher[bot]@users.noreply.github.com"

      - name: Download Go FFI artifacts (all platforms)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: go-ffi-*
          path: tmp/go-ffi-all
          merge-multiple: true

      - name: Stage libraries into packages/go/.lib/
        shell: bash
        run: |
          set -euo pipefail
          cd packages/go

          # ~keep The .lib directory name IS the alef platform label — binding.go's cgo LDFLAGS
          # ~keep (-L${SRCDIR}/.lib/linux-aarch64 …) and cmd/setup's platformDir() both derive it
          # ~keep from src/publish/platform.rs::go_java_platform(). This map used to translate the
          # ~keep labels into Go GOARCH spellings (linux-amd64, linux-arm64, …), which matched
          # ~keep neither consumer: 5 of 6 platforms staged libraries into a directory cgo never
          # ~keep searches, so the published module could not link without running cmd/setup first.
          # ~keep Keep this an identity map. See #178 for the same drift on the Java side.
          declare -A PLATFORM_MAP=(
            [linux-x86_64]="linux-x86_64"
            [linux-aarch64]="linux-aarch64"
            [macos-arm64]="macos-arm64"
            [macos-x86_64]="macos-x86_64"
            [windows-x86_64]="windows-x86_64"
            [windows-aarch64]="windows-aarch64"
          )

          shopt -s nullglob

          # upload-artifact@v7 preserves the path prefix relative to
          # $GITHUB_WORKSPACE, so the per-platform tarballs actually land at
          # tmp/go-ffi-all/dist/go-ffi/<tarball>.tar.gz (not at the root).
          # Use find to walk the tree instead of a flat glob — the previous
          # flat glob silently matched 0 files for every rc since the v7 bump,
          # which meant "No changes to commit" and the subtree tag was never
          # pushed (rc.23–rc.27 all relied on manual staging).
          staging="$(mktemp -d)"
          trap 'rm -rf "${staging}"' EXIT

          mapfile -t tarballs < <(find ../../tmp/go-ffi-all -type f -name 'tree-sitter-language-pack-go-v*.tar.gz')
          if [[ ${#tarballs[@]} -eq 0 ]]; then
            echo "ERROR: no go-ffi tarballs found under tmp/go-ffi-all/" >&2
            find ../../tmp/go-ffi-all -maxdepth 4 -print
            exit 1
          fi

          for tarball in "${tarballs[@]}"; do
            tarball_name="$(basename "${tarball}" .tar.gz)"

            # Match a known platform label as suffix of the tarball name —
            # the version itself contains dashes so plain split won't work.
            platform=""
            for known in "${!PLATFORM_MAP[@]}"; do
              if [[ "$tarball_name" == *"-${known}" ]]; then
                platform="$known"
                break
              fi
            done
            if [[ -z "$platform" ]]; then
              echo "  WARNING: Could not infer platform from $tarball_name; skipping"
              continue
            fi

            libdir="${PLATFORM_MAP[$platform]}"
            echo "Processing $tarball_name → .lib/$libdir"
            mkdir -p ".lib/$libdir"

            # Extract into a fresh staging dir and walk the lib/ subdir.
            extract_dir="${staging}/${tarball_name}"
            mkdir -p "${extract_dir}"
            tar -xzf "${tarball}" -C "${extract_dir}"

            src_lib="${extract_dir}/${tarball_name}/lib"
            if [[ ! -d "${src_lib}" ]]; then
              echo "  WARNING: ${src_lib} not found in tarball"
              tar -tzf "${tarball}" | head -20
              continue
            fi

            cp "${src_lib}"/* ".lib/$libdir/"
            # shellcheck disable=SC2012
            echo "  Copied: $(ls "${src_lib}" | tr '\n' ' ')"
          done

          # Verify libraries were staged
          echo ""
          echo "=== Staged libraries ==="
          find .lib -type f ! -name ".gitkeep" | sort
          lib_count=$(find .lib -type f ! -name ".gitkeep" -print | wc -l)
          if [[ "$lib_count" -eq 0 ]]; then
            echo "ERROR: No libraries staged" >&2
            exit 1
          fi
          echo "Staged $lib_count libraries"

      - name: Commit staged libraries and tag Go module
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        run: |
          cd packages/go

          # Stage only the new/modified library files, not .gitkeep.
          # Use -f because root .gitignore globally ignores *.so/*.dylib/*.dll;
          # the published Go module deliberately ships pre-built FFI artifacts.
          find .lib -type f ! -name ".gitkeep" -print0 | xargs -0 git add -f

          # Check if there are changes to commit
          if git diff --cached --quiet; then
            echo "No changes to commit; skipping tag"
            exit 0
          fi

          git commit --no-verify -m "chore(go): stage pre-built FFI libraries for ${{ needs.prepare.outputs.version }}"
          echo "Libraries committed successfully"

          # Log the commit
          git log --oneline -1

          # Tag the staged commit as the Go module version
          # This ensures consumers fetching v<version> get the libraries
          git tag -a "packages/go/v${{ needs.prepare.outputs.version }}" -m "Go module v${{ needs.prepare.outputs.version }}"
          git push origin "refs/tags/packages/go/v${{ needs.prepare.outputs.version }}"
          echo "Go module tag pushed successfully"

  finalize-github-release:
    name: Publish GitHub release from draft
    needs:
      - prepare
      - validate-versions
      - upload-parser-binaries
      - upload-go-release
      - upload-c-ffi-release
      - update-swift-package-manifest
      - stage-go-ffi-libraries
      - upload-cli-release
    if: |
      always() &&
      needs.prepare.outputs.dry_run != 'true' &&
      needs.validate-versions.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Every consumer of this job reads `outputs.promoted`, never
    # `needs.finalize-github-release.result`. A failure anywhere in this job's `needs`
    # ancestry poisons the VALUE downstream reads for `.result` even when this job itself
    # concluded success, so one per-language upload failing would make every consumer
    # believe the release was never published. Job outputs carry no such poison. ~keep
    outputs:
      promoted: ${{ steps.promote.outputs.promoted }}
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

      # crates.io publishes are irreversible (yank-only) and ts-pack-core/build.rs
      # downloads parsers.json + platform tarballs from THIS release by URL at
      # `cargo build` time. Publishing crates.io before every asset it needs is
      # uploaded AND the release is public is guaranteed breakage for any consumer
      # resolving that version in the gap (#177). This job is the single gate
      # publish-crates waits on: it checks every asset-upload job's actual RESULT
      # (not just that it was scheduled — a bare `needs:` edge gates nothing once a
      # job opens with always(), see the e2e-gate comment above), then publishes the
      # draft release, so crates.io always goes last.
      #
      # upload-elixir-release and upload-php-pie-release are deliberately NOT in
      # `needs:` here: build-elixir-nifs and build-php-extension already require
      # publish-crates to succeed first (their release builds resolve the crate from
      # crates.io, not from a workspace path), so those two asset uploads structurally
      # happen AFTER crates.io publish. Requiring them here would be a real `needs:`
      # cycle (finalize-github-release -> upload-elixir-release -> build-elixir-nifs ->
      # publish-crates -> finalize-github-release), not just an ordering preference —
      # GitHub Actions rejects the workflow outright if that edge is added. Elixir/PHP
      # assets land on the release after it is already public, same as before this fix.
      #
      # verify-binstall is NOT required here either, and for a harder reason: the
      # `[package.metadata.binstall] pkg-url` in crates/ts-pack-cli resolves to a
      # `releases/download/<tag>/` URL, which 404s while the release is still a draft.
      # Requiring it before the flip is a genuine deadlock — binstall cannot pass until
      # the release is public and the release cannot go public until binstall passes.
      # It runs after this job instead, and release-finalize is what makes a binstall
      # failure fail the release.
      #
      # cli-binaries is target-scoped rather than unconditional: build-cli is gated on
      # release_homebrew, so a targeted workflow_dispatch that omits homebrew skips the
      # CLI upload, and requiring it unconditionally would strand that release as a
      # permanent draft. ~keep
      - name: Verify release assets are complete
        if: needs.prepare.result == 'success'
        env:
          RESULT_UPLOAD_PARSERS: ${{ needs.upload-parser-binaries.result }}
          RESULT_UPLOAD_GO: ${{ needs.upload-go-release.result }}
          RESULT_UPLOAD_C_FFI: ${{ needs.upload-c-ffi-release.result }}
          RESULT_SWIFT_MANIFEST: ${{ needs.update-swift-package-manifest.result }}
          RESULT_STAGE_GO_FFI: ${{ needs.stage-go-ffi-libraries.result }}
          RESULT_UPLOAD_CLI: ${{ needs.upload-cli-release.result }}
          RELEASE_GO: ${{ needs.prepare.outputs.release_go }}
          RELEASE_C_FFI: ${{ needs.prepare.outputs.release_c_ffi }}
          RELEASE_SWIFT: ${{ needs.prepare.outputs.release_swift }}
          RELEASE_HOMEBREW: ${{ needs.prepare.outputs.release_homebrew }}
        run: |
          failed=0

          require_success() {
            local name="$1" result="$2"
            if [[ "$result" != "success" ]]; then
              echo "::error::Required release-asset job '$name' finished with '$result' — refusing to publish an incomplete release."
              failed=1
            fi
          }

          require_success_when_enabled() {
            local name="$1" result="$2" enabled="$3"
            if [[ "$enabled" == "true" && "$result" != "success" ]]; then
              echo "::error::Release-asset job '$name' is enabled but finished with '$result' — refusing to publish an incomplete release."
              failed=1
            fi
          }

          require_success "parser-binaries" "$RESULT_UPLOAD_PARSERS"
          require_success_when_enabled "cli-binaries" "$RESULT_UPLOAD_CLI" "$RELEASE_HOMEBREW"
          require_success_when_enabled "go-ffi" "$RESULT_UPLOAD_GO" "$RELEASE_GO"
          require_success_when_enabled "go-ffi-stage" "$RESULT_STAGE_GO_FFI" "$RELEASE_GO"
          require_success_when_enabled "c-ffi" "$RESULT_UPLOAD_C_FFI" "$RELEASE_C_FFI"
          require_success_when_enabled "swift-manifest" "$RESULT_SWIFT_MANIFEST" "$RELEASE_SWIFT"

          if [[ "$failed" -eq 1 ]]; then
            exit 1
          fi
          echo "All release-asset upload jobs are complete."

      - name: Finalize release (publish from draft)
        if: needs.prepare.result == 'success'
        uses: xberg-io/actions/finalize-release@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          go-module-path: ""
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          token: ${{ steps.app-token.outputs.token }}

      # Reached only when the flip above succeeded, so `promoted` is the one signal that
      # means "this tag is a public release" — see the outputs comment on this job. ~keep
      - name: Record promotion
        id: promote
        if: needs.prepare.result == 'success'
        run: echo "promoted=true" >>"$GITHUB_OUTPUT"

  release-finalize:
    name: Aggregate release status
    needs:
      - prepare
      - validate-versions
      - check-registries
      - finalize-github-release
      - upload-parser-binaries
      - upload-go-release
      - upload-c-ffi-release
      - upload-elixir-release
      - upload-php-pie-release
      - update-swift-package-manifest
      - stage-go-ffi-libraries
      - publish-crates
      - publish-pypi
      - publish-node
      - publish-wasm
      - publish-rubygems
      - publish-maven
      - publish-hex
      - publish-packagist
      - publish-nuget
      - publish-homebrew-formula
      - homebrew-bottles
      - upload-cli-release
      - verify-binstall
      - publish-homebrew-bottles
      - publish-scoop-manifest
      - trigger-pubdev
      - publish-zig
      - publish-kotlin-android
    if: always() && !inputs.nuget_runtime_run_id && (github.event_name != 'release' || github.actor != 'xberg-dev-publisher[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Aggregate release status
        if: always()
        env:
          CHECK_RESULTS: ${{ needs.check-registries.outputs.results }}
          RESULT_VALIDATE: ${{ needs.validate-versions.result }}
          # ~keep The promotion output, not `.result` — see the outputs comment on
          # finalize-github-release for why `.result` cannot be trusted downstream.
          PROMOTED: ${{ needs.finalize-github-release.outputs.promoted }}
          RESULT_PUBLISH_CRATES: ${{ needs.publish-crates.result }}
          RESULT_PUBLISH_PYPI: ${{ needs.publish-pypi.result }}
          RESULT_PUBLISH_NODE: ${{ needs.publish-node.result }}
          RESULT_PUBLISH_WASM: ${{ needs.publish-wasm.result }}
          RESULT_PUBLISH_RUBYGEMS: ${{ needs.publish-rubygems.result }}
          RESULT_PUBLISH_MAVEN: ${{ needs.publish-maven.result }}
          RESULT_PUBLISH_HEX: ${{ needs.publish-hex.result }}
          RESULT_PUBLISH_PACKAGIST: ${{ needs.publish-packagist.result }}
          RESULT_PUBLISH_NUGET: ${{ needs.publish-nuget.result }}
          RESULT_UPLOAD_PARSERS: ${{ needs.upload-parser-binaries.result }}
          RESULT_UPLOAD_GO: ${{ needs.upload-go-release.result }}
          RESULT_UPLOAD_C_FFI: ${{ needs.upload-c-ffi-release.result }}
          RESULT_UPLOAD_ELIXIR: ${{ needs.upload-elixir-release.result }}
          RESULT_UPLOAD_HOMEBREW: ${{ needs.homebrew-bottles.result }}
          RESULT_PUBLISH_HOMEBREW: ${{ needs.publish-homebrew-bottles.result }}
          RESULT_PUBLISH_SCOOP: ${{ needs.publish-scoop-manifest.result }}
        run: |
          {
            echo "## Release Summary"
            echo ""
            echo "| Target | Status |"
            echo "|--------|--------|"

            if [[ "$RESULT_VALIDATE" != "success" ]]; then
              echo "| version-check | **FAILED** |"
            else
              echo "| version-check | passed |"
            fi

            if [[ "$PROMOTED" != "true" ]]; then
              echo "| github-release | **NOT PROMOTED OUT OF DRAFT** |"
            else
              echo "| github-release | published |"
            fi

            declare -A results
            results[crates]="${RESULT_PUBLISH_CRATES}"
            results[python]="${RESULT_PUBLISH_PYPI}"
            results[node]="${RESULT_PUBLISH_NODE}"
            results[wasm]="${RESULT_PUBLISH_WASM}"
            results[ruby]="${RESULT_PUBLISH_RUBYGEMS}"
            results[maven]="${RESULT_PUBLISH_MAVEN}"
            results[hex]="${RESULT_PUBLISH_HEX}"
            results[parser-binaries]="${RESULT_UPLOAD_PARSERS}"
            results[go-ffi]="${RESULT_UPLOAD_GO}"
            results[c-ffi]="${RESULT_UPLOAD_C_FFI}"
            results[elixir-nifs]="${RESULT_UPLOAD_ELIXIR}"
            results[packagist]="${RESULT_PUBLISH_PACKAGIST}"
            results[nuget]="${RESULT_PUBLISH_NUGET}"
            results[homebrew]="${RESULT_PUBLISH_HOMEBREW}"
            results[scoop]="${RESULT_PUBLISH_SCOOP}"

            declare -A checks
            checks[crates]="$(printf '%s' "$CHECK_RESULTS" | jq -r '.cratesio // ""')"
            checks[python]="$(printf '%s' "$CHECK_RESULTS" | jq -r '.pypi // ""')"
            checks[node]="$(printf '%s' "$CHECK_RESULTS" | jq -r '.npm // ""')"
            checks[wasm]="$(printf '%s' "$CHECK_RESULTS" | jq -r '."npm-wasm" // ""')"
            checks[ruby]="$(printf '%s' "$CHECK_RESULTS" | jq -r '.rubygems // ""')"
            checks[maven]="$(printf '%s' "$CHECK_RESULTS" | jq -r '.maven // ""')"
            checks[hex]="$(printf '%s' "$CHECK_RESULTS" | jq -r '.hex // ""')"
            checks[packagist]="$(printf '%s' "$CHECK_RESULTS" | jq -r '.packagist // ""')"
            checks[nuget]="$(printf '%s' "$CHECK_RESULTS" | jq -r '.nuget // ""')"
            checks[homebrew]="$(printf '%s' "$CHECK_RESULTS" | jq -r '.homebrew // ""')"

            for target in crates python node wasm ruby maven hex packagist nuget homebrew scoop parser-binaries go-ffi c-ffi elixir-nifs; do
              result="${results[$target]}"
              check="${checks[$target]:-}"
              if [[ "$result" == "success" ]]; then
                echo "| $target | published |"
              elif [[ "$check" == "true" ]]; then
                echo "| $target | already exists (skipped) |"
              elif [[ "$result" == "skipped" ]]; then
                echo "| $target | skipped (not enabled) |"
              elif [[ "$result" == "failure" ]]; then
                echo "| $target | **FAILED** |"
              else
                echo "| $target | $result |"
              fi
            done

            echo ""
            echo "- **Tag**: ${{ needs.prepare.outputs.tag }}"
            echo "- **Version**: ${{ needs.prepare.outputs.version }}"
            echo "- **Dry run**: ${{ needs.prepare.outputs.dry_run }}"
            echo "- **Force republish**: ${{ needs.prepare.outputs.force_republish }}"
          } >> "$GITHUB_STEP_SUMMARY"

      # This job used to only WRITE a summary, so run 32484453913 published a
      # v1.15.5 GitHub release to zero registries — every publish job SKIPPED,
      # 40+ jobs failed — and still reported "Aggregate release status: success".
      # A release that ships nothing must not be green (#177). Modelled on
      # finalize-github-release's "Verify release assets are complete": inspect
      # each job's actual RESULT and treat `skipped` as failure, because a bare
      # `needs:` edge gates nothing once a job opens with `always()`.
      #
      # `skipped` is only legitimate for two reasons, both encoded below:
      #   * the target is not enabled for this release (release_* != 'true'), or
      #   * check-registries already found this exact version published and
      #     force_republish was not requested.
      # Anything else is a hole in the pipeline, not a decision.
      #
      # Dart, Zig and kotlin-android are gated HERE rather than in
      # finalize-github-release: their build+gate+publish chains all share one
      # `fromJson(check-registries...) != 'true'` condition, so all three jobs
      # skip together and no downstream job would otherwise notice. They are not
      # release assets that crates.io consumers resolve at build time, so they
      # must not block the draft-release publish — but they must still fail the
      # run when an enabled target silently ships nothing. ~keep
      - name: Verify every enabled publish target succeeded
        if: always() && needs.prepare.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          CHECK_RESULTS: ${{ needs.check-registries.outputs.results }}
          RESULT_PREPARE: ${{ needs.prepare.result }}
          RESULT_VALIDATE: ${{ needs.validate-versions.result }}
          RESULT_CHECK_REGISTRIES: ${{ needs.check-registries.result }}
          PROMOTED: ${{ needs.finalize-github-release.outputs.promoted }}
          RESULT_PUBLISH_CRATES: ${{ needs.publish-crates.result }}
          RESULT_PUBLISH_PYPI: ${{ needs.publish-pypi.result }}
          RESULT_PUBLISH_NODE: ${{ needs.publish-node.result }}
          RESULT_PUBLISH_WASM: ${{ needs.publish-wasm.result }}
          RESULT_PUBLISH_RUBYGEMS: ${{ needs.publish-rubygems.result }}
          RESULT_PUBLISH_MAVEN: ${{ needs.publish-maven.result }}
          RESULT_PUBLISH_HEX: ${{ needs.publish-hex.result }}
          RESULT_PUBLISH_PACKAGIST: ${{ needs.publish-packagist.result }}
          RESULT_PUBLISH_NUGET: ${{ needs.publish-nuget.result }}
          RESULT_PUBLISH_HOMEBREW: ${{ needs.publish-homebrew-bottles.result }}
          RESULT_PUBLISH_SCOOP: ${{ needs.publish-scoop-manifest.result }}
          RESULT_TRIGGER_PUBDEV: ${{ needs.trigger-pubdev.result }}
          RESULT_PUBLISH_ZIG: ${{ needs.publish-zig.result }}
          RESULT_PUBLISH_KOTLIN_ANDROID: ${{ needs.publish-kotlin-android.result }}
          RESULT_UPLOAD_PARSERS: ${{ needs.upload-parser-binaries.result }}
          RESULT_UPLOAD_CLI: ${{ needs.upload-cli-release.result }}
          RESULT_VERIFY_BINSTALL: ${{ needs.verify-binstall.result }}
          RESULT_UPLOAD_GO: ${{ needs.upload-go-release.result }}
          RESULT_STAGE_GO_FFI: ${{ needs.stage-go-ffi-libraries.result }}
          RESULT_UPLOAD_C_FFI: ${{ needs.upload-c-ffi-release.result }}
          RESULT_UPLOAD_ELIXIR: ${{ needs.upload-elixir-release.result }}
          RESULT_UPLOAD_PHP_PIE: ${{ needs.upload-php-pie-release.result }}
          RESULT_SWIFT_MANIFEST: ${{ needs.update-swift-package-manifest.result }}
          RELEASE_CRATES: ${{ needs.prepare.outputs.release_crates }}
          RELEASE_PYTHON: ${{ needs.prepare.outputs.release_python }}
          RELEASE_NODE: ${{ needs.prepare.outputs.release_node }}
          RELEASE_WASM: ${{ needs.prepare.outputs.release_wasm }}
          RELEASE_RUBY: ${{ needs.prepare.outputs.release_ruby }}
          RELEASE_JAVA: ${{ needs.prepare.outputs.release_java }}
          RELEASE_ELIXIR: ${{ needs.prepare.outputs.release_elixir }}
          RELEASE_PHP: ${{ needs.prepare.outputs.release_php }}
          RELEASE_CSHARP: ${{ needs.prepare.outputs.release_csharp }}
          RELEASE_HOMEBREW: ${{ needs.prepare.outputs.release_homebrew }}
          RELEASE_SCOOP: ${{ needs.prepare.outputs.release_scoop }}
          RELEASE_DART: ${{ needs.prepare.outputs.release_dart }}
          RELEASE_ZIG: ${{ needs.prepare.outputs.release_zig }}
          RELEASE_KOTLIN_ANDROID: ${{ needs.prepare.outputs.release_kotlin_android }}
          RELEASE_GO: ${{ needs.prepare.outputs.release_go }}
          RELEASE_C_FFI: ${{ needs.prepare.outputs.release_c_ffi }}
          RELEASE_SWIFT: ${{ needs.prepare.outputs.release_swift }}
          FORCE_REPUBLISH: ${{ needs.prepare.outputs.force_republish }}
        run: |
          set -uo pipefail
          failed=0

          # Jobs the release cannot be correct without, regardless of targets.
          require_success() {
            local name="$1" result="$2"
            if [[ "$result" != "success" ]]; then
              echo "::error::Required release job '$name' finished with '$result' — this release did not ship."
              failed=1
            fi
          }

          # Target-scoped jobs: must succeed when the target is enabled, unless
          # check-registries already found this version published.
          require_publish() {
            local name="$1" result="$2" enabled="$3" check_key="${4:-}"
            local already=""

            if [[ "$enabled" != "true" ]]; then
              echo "  - $name: not enabled for this release"
              return
            fi

            if [[ -n "$check_key" ]]; then
              already="$(printf '%s' "$CHECK_RESULTS" | jq -r --arg k "$check_key" '.[$k] // ""')"
            fi

            if [[ "$already" == "true" && "$FORCE_REPUBLISH" != "true" ]]; then
              echo "  - $name: already published at this version (correctly skipped)"
              return
            fi

            if [[ "$result" != "success" ]]; then
              echo "::error::Publish target '$name' is enabled and not yet published, but its job finished with '$result' — refusing to report this release as successful."
              failed=1
              return
            fi

            echo "  - $name: published"
          }

          require_success "prepare" "$RESULT_PREPARE"
          require_success "validate-versions" "$RESULT_VALIDATE"
          require_success "check-registries" "$RESULT_CHECK_REGISTRIES"
          # ~keep `finalize-github-release.outputs.promoted` reports only whether THIS run
          # flipped the draft bit. A partial-target dispatch skips that job and leaves the output
          # empty, so asserting on it declares a release that is in fact public, with all its
          # assets attached, to have never shipped (observed on html-to-markdown v3.12.0, run
          # 33498311069). Ask the release what it IS, not the job what it did; the job's own
          # report stays in the message so a genuine promote failure is still named.
          release_is_draft="$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null || echo unknown)"
          if [[ "$release_is_draft" != "false" ]]; then
            echo "::error::Release $TAG is not a published release (isDraft=$release_is_draft; finalize-github-release reported '${PROMOTED:-<skipped>}')."
            failed=1
          fi
          require_success "parser-binaries" "$RESULT_UPLOAD_PARSERS"

          require_publish "crates.io" "$RESULT_PUBLISH_CRATES" "$RELEASE_CRATES" "cratesio"
          require_publish "pypi" "$RESULT_PUBLISH_PYPI" "$RELEASE_PYTHON" "pypi"
          require_publish "npm" "$RESULT_PUBLISH_NODE" "$RELEASE_NODE" "npm"
          require_publish "npm-wasm" "$RESULT_PUBLISH_WASM" "$RELEASE_WASM" "npm-wasm"
          require_publish "rubygems" "$RESULT_PUBLISH_RUBYGEMS" "$RELEASE_RUBY" "rubygems"
          require_publish "maven" "$RESULT_PUBLISH_MAVEN" "$RELEASE_JAVA" "maven"
          require_publish "hex" "$RESULT_PUBLISH_HEX" "$RELEASE_ELIXIR" "hex"
          require_publish "packagist" "$RESULT_PUBLISH_PACKAGIST" "$RELEASE_PHP" "packagist"
          require_publish "nuget" "$RESULT_PUBLISH_NUGET" "$RELEASE_CSHARP" "nuget"
          require_publish "homebrew" "$RESULT_PUBLISH_HOMEBREW" "$RELEASE_HOMEBREW" "homebrew"
          require_publish "scoop" "$RESULT_PUBLISH_SCOOP" "$RELEASE_SCOOP"
          require_publish "pub.dev" "$RESULT_TRIGGER_PUBDEV" "$RELEASE_DART" "pub"
          require_publish "zig" "$RESULT_PUBLISH_ZIG" "$RELEASE_ZIG" "zig"
          require_publish "maven-kotlin-android" "$RESULT_PUBLISH_KOTLIN_ANDROID" "$RELEASE_KOTLIN_ANDROID" "maven-kotlin-android"

          # Release assets have no registry probe — enabled means required.
          require_publish "cli-binaries" "$RESULT_UPLOAD_CLI" "$RELEASE_HOMEBREW"
          require_publish "binstall-verify" "$RESULT_VERIFY_BINSTALL" "$RELEASE_HOMEBREW"
          require_publish "go-ffi-assets" "$RESULT_UPLOAD_GO" "$RELEASE_GO"
          require_publish "go-ffi-stage" "$RESULT_STAGE_GO_FFI" "$RELEASE_GO"
          require_publish "c-ffi-assets" "$RESULT_UPLOAD_C_FFI" "$RELEASE_C_FFI"
          require_publish "elixir-nif-assets" "$RESULT_UPLOAD_ELIXIR" "$RELEASE_ELIXIR"
          require_publish "php-pie-assets" "$RESULT_UPLOAD_PHP_PIE" "$RELEASE_PHP"
          require_publish "swift-manifest" "$RESULT_SWIFT_MANIFEST" "$RELEASE_SWIFT"

          if [[ "$failed" -eq 1 ]]; then
            echo "::error::Release ${{ needs.prepare.outputs.tag }} did not reach every enabled target. See the errors above."
            exit 1
          fi
          echo "Every enabled publish target for ${{ needs.prepare.outputs.tag }} succeeded."

  announce-discord:
    name: Announce release on Discord
    needs:
      - prepare
      - publish-crates
      - publish-pypi
      - publish-node
      - publish-wasm
      - publish-rubygems
      - publish-maven
      - publish-hex
      - publish-packagist
      - publish-nuget
      - publish-homebrew-formula
      - publish-homebrew-bottles
      - publish-scoop-manifest
      - upload-parser-binaries
      - upload-go-release
      - upload-c-ffi-release
      - upload-elixir-release
      - upload-php-pie-release
      - upload-cli-release
      - release-finalize
    if: |
      always() &&
      !cancelled() &&
      needs.prepare.outputs.dry_run != 'true' &&
      needs.release-finalize.result == 'success' &&
      !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: xberg-io/actions/announce-release-discord@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          project-name: tree-sitter-language-pack

  cli-proxy:
    name: Publish CLI proxy package (npm)
    if: ${{ github.event_name == 'release' && startsWith(github.event.release.tag_name, 'cli-proxy-v') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: xberg-io/actions/publish-npm@v1
        with:
          package-dir: cli-proxy/npm
          access: public
          provenance: "true"

  # --- Coding-agent plugin (lives in plugin/, generated by ai-rulez; see plugin/README.md) ---
  # Additive best-effort like the language jobs above: intentionally NOT part of
  # finalize-release / announce `needs`, so a plugin hiccup never blocks the core
  # release. Both publish the same content every tagged release (version tracks core), so
  # each guards against an already-published version. `needs: [prepare]` only — the plugin
  # has no build- or runtime-dependency on the core packages (mcp-launch.sh resolves the CLI
  # at runtime), so it publishes in parallel with the core jobs. ~keep

  publish-plugin-opencode:
    name: Publish OpenCode plugin to npm
    needs: [prepare, validate-versions, e2e-plugin]
    # ~keep `!cancelled()` opts out of automatic failure propagation, so the `needs:` edge on
    # validate-versions gates nothing by itself -- the explicit result check below is what stops
    # a bundle whose version the release already rejected from reaching npm.
    if: ${{ !cancelled() && needs.validate-versions.result == 'success' && needs.prepare.outputs.release_node == 'true' && needs.e2e-plugin.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # Plain ESM adapter — no build step. Skip if this version is already on npm so a
      # release re-run is idempotent (plugin version tracks the core release). ~keep
      - name: Re-check npm before publish
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        id: recheck
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: npm
          package: "@xberg-io/opencode-tree-sitter-language-pack"
          version: ${{ needs.prepare.outputs.version }}
      # ~keep The bundle carries its own version (plugin/.ai-rulez/config.toml [plugin].version),
      # which the tag does not set. At v1.16.0 that pin was still 1.15.12, so npm was handed a
      # 1.15.12 tarball, answered 403 "cannot publish over the previously published version", and
      # the job still reported success -- a release that shipped no plugin and said it had. The
      # re-check above cannot catch this: it probes the release version, which the artifact never
      # carried. Assert the two agree before anything is uploaded.
      # ~keep A dry run synthesizes its tag as `<version>-dryrun-<sha>`, which no manifest
      # ever carries, so comparing it verbatim fails on a bundle that is in fact correct.
      # Strip it rather than skipping the assertion on dry runs -- a dry run is where a
      # drifted bundle should surface, while nothing has been published.
      - name: Assert the plugin bundle matches the release
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 scripts/sync_plugin_version.py --expect "${VERSION%%-dryrun-*}"
      - name: Publish to npm
        if: ${{ needs.prepare.outputs.dry_run != 'true' && steps.recheck.outputs.exists != 'true' }}
        uses: xberg-io/actions/publish-npm@v1
        with:
          package-dir: plugin
          npm-tag: ${{ needs.prepare.outputs.npm_tag }}
          provenance: "true"
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          expected-version: ${{ needs.prepare.outputs.version }}

  publish-plugin-hermes:
    name: Publish Hermes plugin to PyPI
    needs: [prepare, validate-versions, e2e-plugin]
    # ~keep `!cancelled()` opts out of automatic failure propagation, so the `needs:` edge on
    # validate-versions gates nothing by itself -- the explicit result check below is what stops
    # a bundle whose version the release already rejected from reaching PyPI.
    if: ${{ !cancelled() && needs.validate-versions.result == 'success' && needs.prepare.outputs.release_python == 'true' && needs.e2e-plugin.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.13"
      # ~keep The bundle carries its own version (plugin/.ai-rulez/config.toml [plugin].version),
      # which the tag does not set. At v1.16.0 that pin was still 1.15.12, so npm was handed a
      # 1.15.12 tarball, answered 403 "cannot publish over the previously published version", and
      # the job still reported success -- a release that shipped no plugin and said it had. The
      # re-check above cannot catch this: it probes the release version, which the artifact never
      # carried. Assert the two agree before anything is uploaded.
      # ~keep A dry run synthesizes its tag as `<version>-dryrun-<sha>`, which no manifest
      # ever carries, so comparing it verbatim fails on a bundle that is in fact correct.
      # Strip it rather than skipping the assertion on dry runs -- a dry run is where a
      # drifted bundle should surface, while nothing has been published.
      - name: Assert the plugin bundle matches the release
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 scripts/sync_plugin_version.py --expect "${VERSION%%-dryrun-*}"
      - name: Build Hermes wheel
        run: uv build --wheel --out-dir dist-hermes plugin/.hermes/package
      # publish-pypi is idempotent (skips a version already on PyPI). ~keep
      - name: Publish to PyPI
        uses: xberg-io/actions/publish-pypi@v1
        with:
          packages-dir: dist-hermes
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          expected-version: ${{ needs.prepare.outputs.pypi_version }}
