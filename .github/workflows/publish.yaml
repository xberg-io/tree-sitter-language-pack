          token: ${{ steps.app-token.outputs.token }}
          assets: |
            **/*.tar.gz
            **/*.zip

  upload-c-ffi-release:
    name: Upload C FFI to GitHub Release
    needs: [prepare, validate-versions, build-c-ffi, e2e-c]
    if: |
      always() &&
      needs.validate-versions.result == 'success' &&
      needs.prepare.outputs.dry_run != 'true' &&
      needs.prepare.outputs.release_c_ffi == 'true' &&
      needs.build-c-ffi.result == 'success' &&
      needs.e2e-c.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Download C FFI artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: c-ffi-*
          path: dist/c-ffi
          merge-multiple: true

      - name: Upload to GitHub Release
        uses: xberg-io/actions/publish-github-release@v1
        with:
          # Hold the release as a draft. finalize-github-release is the only job that
          # flips it public, and only after its asset-completeness check passes. ~keep
          draft: "true"
          tag: ${{ needs.prepare.outputs.tag }}
          title: "Release ${{ needs.prepare.outputs.tag }}"
          artifacts: "dist/c-ffi/tree-sitter-language-pack-ffi-*.tar.gz"
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          token: ${{ steps.app-token.outputs.token }}

  upload-elixir-release:
    name: Upload Elixir NIFs to GitHub Release
    needs: [prepare, validate-versions, build-elixir-nifs, e2e-elixir]
    if: |
      always() &&
      needs.validate-versions.result == 'success' &&
      needs.prepare.outputs.dry_run != 'true' &&
      needs.prepare.outputs.release_elixir == 'true' &&
      needs.build-elixir-nifs.result == 'success' &&
      needs.e2e-elixir.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Download Elixir NIF artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: elixir-*
          path: dist/elixir
          merge-multiple: true

      - name: Ensure draft release exists
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --title "Release $TAG"

      - name: Upload Elixir NIF artifacts
        uses: xberg-io/actions/upload-release-assets@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          working-directory: dist/elixir
          token: ${{ steps.app-token.outputs.token }}
          assets: "*.tar.gz"

  # ---------------------------------------------------------------------------
  # E2E gates.
  #
  # Cross-workflow `needs:` does not exist in GitHub Actions, so a language's
  # test suite has to run inside this workflow to be able to block its own
  # publish job. Each gate mirrors its publish job's `release_*` guard so the
  # two are skipped and run together.
  #
  # Wiring a gate takes BOTH halves: add it to the publish job's `needs:` AND
  # add `needs.<gate>.result == 'success'` to the publish job's `if:`. Every
  # publish job below opens with `always()`, which cancels the default
  # skip-on-failed-dependency behaviour — with `always()` present, `needs:`
  # alone gates nothing. ~keep
  # ---------------------------------------------------------------------------

  e2e-rust:
    name: E2E gate — Rust
    needs: [prepare, validate-versions, clone-vendors, build-parser-binaries]
    if: ${{ needs.prepare.outputs.release_crates == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROJECT_ROOT: ${{ github.workspace }}
      TSLP_LINK_MODE: static
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Download parsers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: language-parsers
          path: parsers
      - name: Wire e2e manifest
        uses: ./.github/actions/wire-e2e-manifest
        with:
          platform-label: linux-x86_64
          artifact-name: parsers-linux-x86_64
      - uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: publish-e2e-rust
      - uses: xberg-io/actions/install-task@v1
      - uses: xberg-io/actions/install-alef@v1
      - name: Run Rust E2E tests
        run: task rust:e2e:test

  e2e-python:
    name: E2E gate — Python
    needs: [prepare, validate-versions, clone-vendors, build-parser-binaries]
    if: ${{ needs.prepare.outputs.release_python == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROJECT_ROOT: ${{ github.workspace }}
      TSLP_LINK_MODE: static
      TSLP_LANGUAGES: "python,rust,javascript,typescript,go,html,css,json,gherkin"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Download parsers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: language-parsers
          path: parsers
      - name: Wire e2e manifest
        uses: ./.github/actions/wire-e2e-manifest
        with:
          platform-label: linux-x86_64
          artifact-name: parsers-linux-x86_64
      - uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: publish-e2e-python
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      # `task python:e2e:test` goes through `alef test --lang python --e2e`, whose
      # `[crates.test.python]` precondition needs `ruff` and whose `before` hook runs
      # `maturin develop` — and `maturin develop` refuses to run outside a virtualenv.
      # ci-e2e.yaml's `test-python` installs a prebuilt wheel and calls pytest directly, so
      # it needs none of this; the release gate does. ~keep
      - name: Install Python E2E tooling
        shell: bash
        run: |
          uv venv .venv
          uv pip install maturin ruff
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - uses: xberg-io/actions/install-task@v1
      - uses: xberg-io/actions/install-alef@v1
      - name: Run Python E2E tests
        run: task python:e2e:test

  e2e-node:
    name: E2E gate — Node
    needs: [prepare, validate-versions, clone-vendors, build-parser-binaries]
    if: ${{ needs.prepare.outputs.release_node == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROJECT_ROOT: ${{ github.workspace }}
      TSLP_LINK_MODE: static
      TSLP_LANGUAGES: "python,rust,javascript,typescript,go,html,css,json,gherkin"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Download parsers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: language-parsers
          path: parsers
      - name: Wire e2e manifest
        uses: ./.github/actions/wire-e2e-manifest
        with:
          platform-label: linux-x86_64
          artifact-name: parsers-linux-x86_64
      - uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: publish-e2e-node
      - uses: xberg-io/actions/setup-node-workspace@v1
        with:
          node-version: "22"
      # `[crates.test.node]`'s precondition and its `before` hook both need the `napi`
      # binary, which no setup action provides. ci-e2e.yaml installs it in `build-node`
      # before running the same NAPI build. ~keep
      - name: Install NAPI-RS CLI
        run: npm install -g @napi-rs/cli
      - uses: xberg-io/actions/install-task@v1
      - uses: xberg-io/actions/install-alef@v1
      - name: Run Node E2E tests
        run: task node:e2e:test

  e2e-wasm:
    name: E2E gate — WASM
    needs: [prepare, validate-versions, clone-vendors]
    if: ${{ needs.prepare.outputs.release_wasm == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROJECT_ROOT: ${{ github.workspace }}
      TSLP_LINK_MODE: static
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Download parsers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: language-parsers
          path: parsers
      - uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: publish-e2e-wasm
      - name: Install wasi-sdk
        uses: xberg-io/actions/install-wasi-sdk@v1
      # `[crates.test.wasm]`'s precondition needs `pnpm` and `wasm-pack`, and its `before`
      # hook runs `wasm-pack build`; the e2e command itself runs `pnpm install`. Plain
      # actions/setup-node supplies neither, so use the workspace action (which brings pnpm)
      # and install wasm-pack the same way ci-e2e.yaml's `build-wasm` does. ~keep
      - uses: xberg-io/actions/setup-node-workspace@v1
        with:
          node-version: "22"
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - uses: xberg-io/actions/install-task@v1
      - uses: xberg-io/actions/install-alef@v1
      - name: Run WASM E2E tests
        run: task wasm:e2e:test

  e2e-ruby:
    name: E2E gate — Ruby
    needs: [prepare, validate-versions, clone-vendors, build-parser-binaries]
    if: ${{ needs.prepare.outputs.release_ruby == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROJECT_ROOT: ${{ github.workspace }}
      TSLP_LINK_MODE: static
      TSLP_LANGUAGES: "python,rust,javascript,typescript,go,html,css,json,gherkin"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Download parsers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: language-parsers
          path: parsers
      - name: Wire e2e manifest
        uses: ./.github/actions/wire-e2e-manifest
        with:
          platform-label: linux-x86_64
          artifact-name: parsers-linux-x86_64
      - uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: publish-e2e-ruby
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4"
      # `[crates.test.ruby]`'s `before` hook runs `bundle exec rake compile` in
      # packages/ruby and its e2e command runs `bundle exec rspec` in e2e/ruby; neither
      # installs gems, so both Gemfiles have to be resolved first. ci-e2e.yaml's `test-ruby`
      # runs both installs. ~keep
      - name: Install Ruby dependencies
        working-directory: packages/ruby
        run: bundle install
      - name: Install Ruby E2E dependencies
        working-directory: e2e/ruby
        run: bundle install
      - uses: xberg-io/actions/install-task@v1
      - uses: xberg-io/actions/install-alef@v1
      - name: Run Ruby E2E tests
        run: task ruby:e2e:test

  e2e-java:
