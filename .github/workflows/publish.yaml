          - os: ubuntu-24.04-arm
            label: linux-aarch64
            ruby_platform: aarch64-linux
          - os: macos-latest
            label: macos-arm64
            ruby_platform: arm64-darwin
          - os: macos-15-intel
            label: macos-x86_64
            ruby_platform: x86_64-darwin
