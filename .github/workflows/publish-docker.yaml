name: Publish Docker Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v1.0.0-rc.17)"
        required: true
        type: string
      dry_run:
        description: "Dry run without pushing"
        required: false
        type: boolean
        default: false
      ref:
        description: "Git ref (branch, tag, or commit) to build; defaults to the tag"
        required: false
        type: string
      force_republish:
        description: "Force re-publish even if image already exists"
        required: false
        type: boolean
        default: false
  release:
    types: [published]
  repository_dispatch:
    types: [publish-docker]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: xberg-io/ts-pack

concurrency:
  group: publish-docker-${{ (github.event_name == 'workflow_dispatch' && (github.event.inputs.ref || github.event.inputs.tag)) || github.ref || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare metadata
    if: ${{ github.event_name != 'release' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
      force_republish: ${{ steps.meta.outputs.force_republish }}
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
      target_sha: ${{ steps.meta.outputs.target_sha }}
      release_docker: ${{ steps.meta.outputs.release_docker }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Resolve release metadata
        id: meta
        uses: xberg-io/actions/prepare-release-metadata@v1
        with:
          tag: ${{ inputs.tag }}
          ref: ${{ inputs.ref }}
          targets: docker
          dry-run: ${{ inputs.dry_run }}
          force-republish: ${{ inputs.force_republish }}

  check-docker:
    name: Check if image exists
    needs: prepare
    if: ${{ needs.prepare.outputs.release_docker == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check GHCR for existing tag
        id: check
        env:
          DOCKER_TAG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}
        run: |
          if docker manifest inspect "$DOCKER_TAG" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image $DOCKER_TAG already exists" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Image $DOCKER_TAG does not exist — will build" >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build ${{ matrix.arch }}
    needs: [prepare, check-docker]
    if: |
      needs.prepare.outputs.release_docker == 'true' &&
      (needs.prepare.outputs.force_republish == 'true' || needs.check-docker.outputs.exists != 'true')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Ensure target commit
        if: ${{ needs.prepare.outputs.target_sha != '' }}
        run: git checkout --progress --force ${{ needs.prepare.outputs.target_sha }}

      - name: Setup Python environment
        uses: xberg-io/actions/setup-python-env@v1
        with:
          python-version: "3.12"
          install-command: "uv sync --no-install-project --no-install-workspace"

      - name: Setup Node.js (for tree-sitter-cli)
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install tree-sitter-cli
        run: |
          npm install -g tree-sitter-cli@0.26.11
          echo "$(npm config get prefix)/bin" >> "$GITHUB_PATH"

      - name: Clone vendor parsers
        run: uv run --script scripts/clone_vendors.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build test image (native, warm cache)
        run: |
          docker buildx build -f docker/Dockerfile \
            -t ts-pack-test:local \
            --load \
            --cache-from type=gha,scope=publish-docker-${{ matrix.arch }} \
            --cache-to type=gha,mode=max,scope=publish-docker-${{ matrix.arch }},ignore-error=true \
            .

      - name: Check Docker image size
        uses: xberg-io/actions/check-docker-image-size@v1
        with:
          image: ts-pack-test:local
          warn-mb: "500"
          label: ts-pack

      - name: Run smoke tests on test image
        run: |
          set -euo pipefail
          PASS=0
          FAIL=0

          assert() {
            if eval "$2"; then
              PASS=$((PASS + 1))
              echo "  PASS: $1"
            else
              FAIL=$((FAIL + 1))
              echo "  FAIL: $1"
            fi
          }

          VER=$(docker run --rm ts-pack-test:local --version)
          echo "  Version: $VER"
          assert "version output" "echo '$VER' | grep -q 'ts-pack'"

          HELP=$(docker run --rm ts-pack-test:local --help)
          assert "help shows commands" "echo '$HELP' | grep -q 'parse'"

          OUT=$(echo "def hello(): pass" | docker run --rm -i ts-pack-test:local parse - --language python)
          assert "python parse" "echo '$OUT' | grep -q 'module'"

          OUT=$(echo "function test() { return 1; }" | docker run --rm -i ts-pack-test:local parse - --language javascript)
          assert "javascript parse" "echo '$OUT' | grep -q 'program'"

          OUT=$(echo "fn main() {}" | docker run --rm -i ts-pack-test:local parse - --language rust)
          assert "rust parse" "echo '$OUT' | grep -q 'source_file'"

          OUT=$(echo "package main" | docker run --rm -i ts-pack-test:local parse - --language go)
          assert "go parse" "echo '$OUT' | grep -q 'source_file'"

          OUT=$(echo "x = 1" | docker run --rm -i ts-pack-test:local parse - --language python --format json)
          assert "json format" "echo '$OUT' | grep -q 'language'"

          OUT=$(printf 'import os\ndef main():\n    pass\n' | docker run --rm -i ts-pack-test:local process - --language python --structure --imports)
          assert "process language" "echo '$OUT' | grep -q '\"language\"'"
          assert "process structure" "echo '$OUT' | grep -q '\"structure\"'"
          assert "process imports" "echo '$OUT' | grep -q '\"imports\"'"

          OUT=$(printf "def a():\n    pass\n\ndef b():\n    pass\n\ndef c():\n    pass\n" | docker run --rm -i ts-pack-test:local process - --language python --structure --chunk-size 30)
          assert "chunking" "echo '$OUT' | grep -q '\"chunks\"'"

          DIR=$(docker run --rm ts-pack-test:local cache-dir)
          assert "cache-dir" "test -n '$DIR'"

          echo "Results: $PASS passed, $FAIL failed"
          test "$FAIL" -eq 0

      - name: Log in to GHCR
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=tree-sitter-language-pack CLI — 248 parsers statically linked
            org.opencontainers.image.licenses=MIT

      - name: Build and push by digest
        id: build
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=publish-docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=publish-docker-${{ matrix.arch }},ignore-error=true

      - name: Export digest
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Dry-run summary
        if: ${{ needs.prepare.outputs.dry_run == 'true' }}
        run: |
          {
            echo "## Docker Dry Run (${{ matrix.platform }})"
            echo "- Would push: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}\`"
            echo "- Smoke tests: passed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up
        if: always()
        run: docker rmi ts-pack-test:local || true

  merge:
    name: Merge & push manifest
    needs: [prepare, check-docker, build]
    if: |
      needs.prepare.outputs.release_docker == 'true' &&
      needs.prepare.outputs.dry_run != 'true' &&
      (needs.prepare.outputs.force_republish == 'true' || needs.check-docker.outputs.exists != 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.tag }}
            type=raw,value=latest,enable=${{ !contains(needs.prepare.outputs.tag, '-') }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          # Both command substitutions MUST word-split — that is how imagetools
          # takes a variable number of -t flags and digest refs. ~keep
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect manifest
        run: |
          docker buildx imagetools inspect \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}"
