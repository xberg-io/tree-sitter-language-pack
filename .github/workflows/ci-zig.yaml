name: CI Zig

on:
  push:
    branches: [main]
    paths:
      - "crates/ts-pack-core-ffi/**"
      - "crates/ts-pack-core/**"
      - "packages/zig/**"
      # The hash check below reads these two, so a commit that touches only them -- including
      # the `--fix` commit that rewrites the hashes -- must re-run this workflow. Without them
      # the one commit most worth re-verifying is the one that never triggers the check. ~keep
      - "test_apps/zig/**"
      - "scripts/sync_zig_zon_hashes.py"
      - ".github/workflows/ci-zig.yaml"
  pull_request:
    branches: [main]
    paths:
      - "crates/ts-pack-core-ffi/**"
      - "crates/ts-pack-core/**"
      - "packages/zig/**"
      # The hash check below reads these two, so a commit that touches only them -- including
      # the `--fix` commit that rewrites the hashes -- must re-run this workflow. Without them
      # the one commit most worth re-verifying is the one that never triggers the check. ~keep
      - "test_apps/zig/**"
      - "scripts/sync_zig_zon_hashes.py"
      - ".github/workflows/ci-zig.yaml"
  workflow_dispatch:

concurrency:
  group: ci-zig-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: short
  TSLP_LINK_MODE: static
  TSLP_LANGUAGES: python,rust,javascript,typescript,go,html,css,json,mojo,nim,norg

permissions:
  contents: read

jobs:
  clone-vendors:
    name: Clone vendors
    if: github.repository == 'xberg-io/tree-sitter-language-pack' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install tree-sitter CLI
        run: npm install -g tree-sitter-cli@0.26.11

      - name: Setup Python environment
        uses: xberg-io/actions/setup-python-env@v1
        with:
          python-version: "3.14"
          install-command: "uv sync --no-install-project --no-install-workspace"

      - name: Cache parsers
        uses: actions/cache@v6
        with:
          path: parsers
          key: parsers-${{ hashFiles('sources/language_definitions.json') }}
          restore-keys: |
            parsers-

      - name: Clone vendors
        run: |
          mkdir -p parsers
          uv run --script scripts/clone_vendors.py

      - name: Upload parsers
        uses: actions/upload-artifact@v7
        with:
          name: language-parsers
          path: parsers
          retention-days: 1

  zig-test:
    name: Zig build + test (${{ matrix.os }})
    if: github.repository == 'xberg-io/tree-sitter-language-pack' && github.actor != 'dependabot[bot]'
    needs: [clone-vendors]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Download parsers
        uses: actions/download-artifact@v8
        with:
          name: language-parsers
          path: parsers
      - uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: ci-zig-${{ matrix.os }}
      - name: Build ts-pack-core-ffi
        run: cargo build --release --locked -p ts-pack-core-ffi
      - uses: xberg-io/actions/setup-zig@v1
        with:
          version: "0.16.0"
      - name: Build Zig package
        working-directory: packages/zig
        run: zig build -Dffi_path=../../target/release
      - name: Run Zig tests
        working-directory: packages/zig
        run: zig build test -Dffi_path=../../target/release
      # `packages/zig` is built from the working tree, so it can never catch a stale
      # `test_apps/zig/build.zig.zon` hash -- and no job builds `test_apps/zig` itself, which is
      # how its hashes stayed at the 1.14.3 values from 1.14.3 through 1.15.7 while `zig build`
      # there failed with a mismatch on every one. This is the only job with a Zig toolchain, so
      # the check lives here. It self-skips assets that 404, which is the normal state between a
      # version bump and its publish, and fails once the tarballs exist but disagree. Ubuntu only:
      # the hashes are of downloaded tarballs, so the result is identical on both runners. ~keep
      - name: Check test_apps/zig package hashes
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/sync_zig_zon_hashes.py
