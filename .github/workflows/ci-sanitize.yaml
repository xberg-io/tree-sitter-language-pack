name: CI Sanitize

# ASan/UBSan coverage over the hand-written C external scanners (~184 of the 371
# grammars ship a `src/scanner.c`/`.cc`). This is not hypothetical: a heap buffer
# overflow was found in 11 vendored scanners where a 256-byte input wrote 1025
# bytes into a 1024-byte buffer. Tree-sitter's only bound there is a `ts_assert`,
# which compiles out under NDEBUG, so a release build has no check at all.
#
# Scope, and why:
#   * Instrumenting all 371 grammars on every push is not affordable — clone +
#     `tree-sitter generate` alone is a 90-minute job, and ASan roughly triples
#     C compile time. So the surface is split:
#   * PR/push (`regression` mode): only the grammars under `patches/`, i.e. the
#     scanners with a committed memory-safety fix. These are the ones a patch
#     edit or a grammar-rev bump can silently regress, and they are the cheapest
#     possible set. Triggered only when `patches/`, `build.rs` or the registry
#     changes, so it costs nothing on unrelated PRs.
#   * Nightly (`rotating` mode): the patched set PLUS one shard of the registry,
#     rotated by day-of-year over SHARD_COUNT shards, so the whole external-scanner
#     surface is swept every SHARD_COUNT days without any single run being long.
#
# Only the vendored grammar C is instrumented (`TSLP_GRAMMAR_CFLAGS=-fsanitize=...`
# plus `-Clink-arg=` for the runtime), not Rust and not third-party C. That keeps the
# job on the pinned stable toolchain instead of requiring nightly `-Zsanitizer` +
# `-Zbuild-std`, and the scanners are the entire target anyway — the Rust side is
# already covered by clippy and the normal test suite.
#
# Patches are applied by `patch_grammar_sources` in build.rs on the default path;
# TSLP_SKIP_GRAMMAR_PATCHES is deliberately never set here, and the run asserts the
# patch tree was found, so this job exercises the *patched* sources.

on:
  pull_request:
    branches: [main]
    paths:
      - "patches/**"
      - "crates/ts-pack-core/build.rs"
      - "sources/language_definitions.json"
      - ".github/workflows/ci-sanitize.yaml"
  schedule:
    # 03:17 UTC daily — off the top of the hour to avoid the Actions scheduling herd.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      languages:
        description: Comma-separated languages to sanitize (overrides mode selection)
        required: false
        type: string

concurrency:
  group: ci-sanitize-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: full
  # Sanitizer aborts use a dedicated exit code so they are distinguishable from an
  # ordinary non-zero exit (a parse error, a missing file, a panic). Without this a
  # `|| true` anywhere in the driver would swallow a real finding. ~keep
  SANITIZER_EXIT_CODE: "42"
  SHARD_COUNT: "16"
  # One pathological input must not consume the whole job. `nest_65537.txt` against djot ran
  # for more than ten minutes under ASan before it was killed, and run 33731532555 spent 55 of
  # its 120 minutes inside the sweep before reporting anything -- an unbounded parse turns a
  # findings gate into a timeout gate, and a job killed at 120 minutes reports nothing at all.
  # A timeout is NOT a sanitizer finding and is deliberately not fatal; it is surfaced as a
  # warning and recorded in the uploaded log so a runaway grammar stays visible. ~keep
  PARSE_TIMEOUT_SECONDS: "60"

jobs:
  sanitize-scanners:
    name: ASan/UBSan external scanners
    if: github.repository == 'xberg-io/tree-sitter-language-pack'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: Install tree-sitter CLI
        run: npm install -g tree-sitter-cli@0.26.11

      - name: Setup Python environment
        uses: xberg-io/actions/setup-python-env@v1
        with:
          python-version: "3.14"
          install-command: "uv sync --no-install-project --no-install-workspace"

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          use-sccache: "false"
          install-llvm-cov: "false"
          # `setup-rust`'s default cache key is `rust-build-v4-<os>-<arch>-default-<Cargo.lock
          # hash>` — every other job in this repo that omits `target:` and
          # `cache-key-prefix:` (most of ci.yaml, ci-cli.yaml, ci-rust.yaml, ...) resolves to
          # that identical key on the same commit, since the key has no notion of RUSTFLAGS,
          # CFLAGS, or which job produced the cached `target/`. This job appends sanitizer
          # link flags to RUSTFLAGS and sets TSLP_GRAMMAR_CFLAGS to build a
          # sanitizer-instrumented binary; restoring another job's un-instrumented `target/`
          # under that shared key left the final `ts-pack` link missing `-fsanitize`/`-lasan`/
          # `-lubsan` entirely (run 32688858106: undefined symbol `__asan_handle_no_return`
          # while linking the CLI binary itself, not the build script this time). A
          # dedicated prefix keeps this job's cache fully isolated from every unsanitized
          # build. ~keep
          cache-key-prefix: "rust-sanitize"

      # `patches/*/` is the pinned regression set, so adding a patch automatically
      # widens the per-PR gate with no workflow edit. The rotating shard is a stable
      # slice of the sorted registry keyed on day-of-year, which sweeps the whole
      # grammar surface over SHARD_COUNT days. ~keep
      - name: Select languages
        id: select
        env:
          OVERRIDE: ${{ inputs.languages }}
        run: |
          set -euo pipefail
          test -d patches || { echo "::error::patches/ missing; the regression set would be empty"; exit 1; }

          PATCHED=$(find patches -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | paste -sd, -)
          test -n "$PATCHED" || { echo "::error::no patched grammars found under patches/"; exit 1; }

          if [ -n "${OVERRIDE:-}" ]; then
            MODE=override
            LANGS="$OVERRIDE"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            MODE=rotating
            # `date +%j` is zero-padded, and bash reads a leading zero as octal —
            # `$(( 048 % 16 ))` is a hard syntax error, not a wrong number. ~keep
            SHARD=$(( 10#$(date -u +%j) % SHARD_COUNT ))
            ROTATED=$(python3 -c "
          import json, sys
          names = sorted(json.load(open('sources/language_definitions.json')))
          shard, count = int(sys.argv[1]), int(sys.argv[2])
          print(','.join(names[shard::count]))
          " "$SHARD" "$SHARD_COUNT")
            test -n "$ROTATED" || { echo "::error::shard $SHARD of $SHARD_COUNT is empty"; exit 1; }
            # `sort -u` here is load-bearing, not cosmetic: PATCHED is a fixed set and
            # ROTATED is a day-of-year shard of the whole registry, so on any day the
            # shard happens to land on a patched grammar, the naive concatenation
            # duplicates that language in TSLP_LANGUAGES. build.rs then emits two
            # `extern "C" { fn tree_sitter_<name>() }` blocks for the same symbol and
            # the build dies with E0428 — which language duplicates changes daily with
            # the shard, so it looked nondeterministic until traced here. ~keep
            LANGS=$(echo "$PATCHED,$ROTATED" | tr ',' '\n' | sort -u | paste -sd, -)
          else
            MODE=regression
            LANGS="$PATCHED"
          fi

          COUNT=$(echo "$LANGS" | tr ',' '\n' | sort -u | wc -l)
          {
            echo "mode=$MODE"
            echo "languages=$LANGS"
            echo "count=$COUNT"
          } >>"$GITHUB_OUTPUT"
          echo "::notice::sanitizing $COUNT language(s) in $MODE mode"

      - name: Clone selected grammars
        env:
          TSLP_LANGUAGES: ${{ steps.select.outputs.languages }}
          TSLP_GENERATE_CONCURRENCY: "2"
        run: uv run --script scripts/clone_vendors.py

      # A `cargo test` over zero compiled grammars is silently green, so the selected
      # set must be proven on disk before anything is built. ~keep
      - name: Assert every selected grammar was cloned
        env:
          LANGS: ${{ steps.select.outputs.languages }}
        run: |
          set -euo pipefail
          missing=""
          for lang in $(echo "$LANGS" | tr ',' ' '); do
            test -f "parsers/$lang/src/parser.c" || missing="$missing $lang"
          done
          if [ -n "$missing" ]; then
            echo "::error::selected grammars have no parser.c:$missing"; exit 1
          fi

      - name: Build ts-pack under ASan + UBSan
        env:
          PROJECT_ROOT: ${{ github.workspace }}
          TSLP_LANGUAGES: ${{ steps.select.outputs.languages }}
          TSLP_LINK_MODE: static
          # `TSLP_GRAMMAR_CFLAGS` is read by crates/ts-pack-core/build.rs and applied to the
          # vendored grammar C/C++ only. `-fno-sanitize-recover=all` turns a UBSan diagnosis
          # into a hard abort rather than a printed warning that a green exit code would hide.
          # ~keep NOT `CFLAGS_x86_64_unknown_linux_gnu`, and not bare `CFLAGS`. cc-rs keys the
          # triple-scoped variable on the triple alone, and on this runner the host triple IS
          # x86_64-unknown-linux-gnu — so it also instruments the C in every build-dependency
          # (zstd-sys via `zstd`, ring via `ureq`), whose objects are linked into ts-pack-core's
          # build-script binary. Cargo withholds RUSTFLAGS from host units when `--target` is
          # passed, so that link never receives the `-lasan`/`-lubsan` below and dies with
          # undefined `__asan_*`/`__ubsan_*` while linking `build_script_build` (run
          # 32550410081). Scoping the flags in build.rs is the only place the split is
          # expressible on stable.
          TSLP_GRAMMAR_CFLAGS: >-
            -fsanitize=address,undefined
            -fno-sanitize-recover=all
            -fno-omit-frame-pointer
            -fno-common
            -g
          CC_x86_64_unknown_linux_gnu: cc
        # `| tee` without pipefail reports tee's exit status, so a failed build was scored
        # as a successful step. ~keep
        run: |
          set -o pipefail
          # Cargo reads rustflags from exactly ONE source, by precedence:
          # CARGO_ENCODED_RUSTFLAGS, then RUSTFLAGS, then `target.<triple>.rustflags` (env
          # form CARGO_TARGET_<TRIPLE>_RUSTFLAGS), then `build.rustflags`. They do not
          # merge — the first one present wins and every lower source is discarded in
          # silence. `setup-rust` writes RUSTFLAGS to $GITHUB_ENV (configure-flags.sh), so
          # the CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS this step used to set was
          # never read by cargo at all: run 33303668074's linker line carries no
          # `-fsanitize`, no `-lasan` and no `-lubsan`, and run 33249060210 put an unstable
          # `-Clink-self-contained=-linker` in that variable without rustc ever emitting
          # the unstable-flag error it would have to. Appending is the only way to add
          # flags on top of a RUSTFLAGS the setup action already owns; ci.yaml and
          # ci-e2e.yaml do the same thing for their own link args. ~keep
          #
          # rustc links with `-nodefaultlibs`, which suppresses exactly the libraries the
          # `-fsanitize=` driver flag exists to add, so the sanitizer runtimes have to be
          # named explicitly or the link fails on undefined __asan_/__ubsan_ symbols. The
          # `--no-as-needed` bracket around them is load-bearing rather than defensive:
          # rustc emits `-Wl,--as-needed` ahead of everything, and a shared library that
          # resolves nothing *at the point it appears* is dropped from DT_NEEDED outright,
          # which would reproduce these exact undefined symbols and be indistinguishable
          # from the bug above. Forcing DT_NEEDED makes resolution independent of wherever
          # rustc chooses to place `-C link-arg`. ~keep
          #
          # RUSTFLAGS reaches only target units because `--target` is passed, so the host
          # build-script link stays uninstrumented and unsanitized — see the
          # TSLP_GRAMMAR_CFLAGS note above, which depends on the same split. ~keep
          RUSTFLAGS="${RUSTFLAGS:-} -Clink-arg=-fsanitize=address,undefined"
          RUSTFLAGS="$RUSTFLAGS -Clink-arg=-Wl,--push-state,--no-as-needed"
          RUSTFLAGS="$RUSTFLAGS -Clink-arg=-lasan -Clink-arg=-lubsan"
          RUSTFLAGS="$RUSTFLAGS -Clink-arg=-Wl,--pop-state -Cforce-frame-pointers=yes"
          export RUSTFLAGS
          echo "::notice::RUSTFLAGS=$RUSTFLAGS"
          cargo build --locked --target x86_64-unknown-linux-gnu -p ts-pack-cli --bin ts-pack 2>&1 | tee build.log
          # libasan must be first in the initial library list or it disables itself at
          # startup — the binary still carries __asan_ symbols, so only a runtime check
          # can tell the difference. Resolved once here for every step that runs it. ~keep
          echo "ASAN_RUNTIME=$(cc -print-file-name=libasan.so)" >>"$GITHUB_ENV"

      # The single most important check in this job: it proves the flags above actually
      # reached the compiler. If build.rs ever stops forwarding `TSLP_GRAMMAR_CFLAGS` to the
      # grammar `cc::Build`s, every step below still exits 0 while checking nothing — a green
      # gate that proves nothing. An uninstrumented binary has no `__asan_` symbols. ~keep
      - name: Assert the binary is actually instrumented
        run: |
          set -euo pipefail
          BIN=target/x86_64-unknown-linux-gnu/debug/ts-pack
          test -x "$BIN" || { echo "::error::$BIN was not produced"; exit 1; }
          # Every step after this one runs the binary with LD_PRELOAD=$ASAN_RUNTIME, which
          # assumes the runtime is a dynamic dependency. DT_NEEDED is the direct evidence
          # of that; the `nm` checks below see instrumentation, not linkage. ~keep
          if ! readelf -d "$BIN" | grep -q 'NEEDED.*libasan'; then
            echo "::error::$BIN has no libasan in DT_NEEDED — the sanitizer runtime was not linked"
            readelf -d "$BIN"
            exit 1
          fi
          if ! nm -C "$BIN" 2>/dev/null | grep -q '__asan_'; then
            echo "::error::$BIN contains no __asan_ symbols — sanitizer flags did not take effect"
            exit 1
          fi
          if ! nm -C "$BIN" 2>/dev/null | grep -q '__ubsan_'; then
            echo "::error::$BIN contains no __ubsan_ symbols — UBSan did not take effect"
            exit 1
          fi
          if grep -q 'TSLP_SKIP_GRAMMAR_PATCHES is set' build.log; then
            echo "::error::grammar patches were skipped; this run would sanitize unpatched sources"
            exit 1
          fi
          if grep -q 'grammar patch tree not found' build.log; then
            echo "::error::patch tree was not located; patched sources were not exercised"
            exit 1
          fi
          # Symbol presence is necessary but NOT sufficient: when libasan is not first in
          # the initial library list it prints a warning and disables itself, leaving a
          # binary that still passes every `nm` check above and detects nothing. The only
          # honest test is to plant a fault and require the sanitizer to catch it. ~keep
          cat >/tmp/asan_selftest.c <<'C'
          #include <stdlib.h>
          #include <string.h>
          int main(void) {
              char *p = malloc(4);
              memcpy(p, "12345678", 8);
              int n = p[0];
              free(p);
              return n;
          }
          C
          cc -fsanitize=address -fno-omit-frame-pointer -g /tmp/asan_selftest.c -o /tmp/asan_selftest
          if LD_PRELOAD="$ASAN_RUNTIME" /tmp/asan_selftest 2>/tmp/asan_selftest.err; then
            echo "::error::ASan positive control did NOT trap a deliberate heap overflow — the"
            echo "::error::sanitizer is inert and this whole job proves nothing. Output follows:"
            cat /tmp/asan_selftest.err
            exit 1
          fi
          if ! grep -q 'heap-buffer-overflow' /tmp/asan_selftest.err; then
            echo "::error::ASan positive control failed, but not with a heap-buffer-overflow report"
            cat /tmp/asan_selftest.err
            exit 1
          fi

      # Each selected grammar must be linked in and reachable, otherwise the parse
      # sweep below would iterate over languages the binary cannot load and still
      # report success on the ones it can. ~keep
      - name: Assert every selected grammar is linked in
        env:
          LANGS: ${{ steps.select.outputs.languages }}
        run: |
          set -euo pipefail
          # The sanitizer environment belongs to the ts-pack invocation, never to the step. As
          # step-level `env:` it also reached the shell, `find`, `grep`, `cat` and `python3`, and
          # `LD_PRELOAD`ing the runtime into an uninstrumented helper is the likeliest way to
          # provoke an ASan diagnosis that has nothing to do with a scanner. ~keep
          ASAN_OPTIONS=detect_leaks=0 LD_PRELOAD="$ASAN_RUNTIME" \
            target/x86_64-unknown-linux-gnu/debug/ts-pack list >linked.txt
          missing=""
          for lang in $(echo "$LANGS" | tr ',' ' '); do
            grep -qw -- "$lang" linked.txt || missing="$missing $lang"
          done
          if [ -n "$missing" ]; then
            echo "::error::selected grammars are not linked into the binary:$missing"; exit 1
          fi

      # Length-escalating repetition is precisely the shape that found the 1025-byte
      # write into a 1024-byte buffer: scanners size lookahead/token buffers with a
      # fixed constant and then run past it on a long enough run of one construct.
      # There is no upstream corpus in the parsers artifact (`test/corpus` is not
      # vendored), so the inputs are synthesised. Leak detection is off — a leak in a
      # scanner is not what this gate is for and tree-sitter arenas trip it broadly. ~keep
      - name: Parse sweep under sanitizers
        env:
          LANGS: ${{ steps.select.outputs.languages }}
        run: |
          set -uo pipefail
          # Generated in Python rather than `printf | tr` so that backslash, quote and
          # whitespace tokens survive shell quoting intact — those are exactly the
          # characters scanners buffer, so silently dropping them would gut the sweep. ~keep
          python3 - <<'GEN'
          import os
          os.makedirs("corpus", exist_ok=True)
          # 1023/1025 and 4095/4097 straddle the 1 KiB and 4 KiB fixed-size buffers that
          # tree-sitter scanners overwhelmingly use.
          sizes = (1, 17, 129, 1023, 1025, 4095, 4097, 65537)
          tokens = "#*`~-=\"'\\{([<$%& \t\n\r\x00\xff"
          for n in sizes:
              for i, tok in enumerate(tokens):
                  with open(f"corpus/rep_{n}_{i:02d}.txt", "wb") as fh:
                      fh.write((tok * n).encode("utf-8", "surrogateescape"))
              with open(f"corpus/nest_{n}.txt", "wb") as fh:
                  fh.write(b"{[(" * n + b")]}" * n)
          GEN
          FILES=$(find corpus -type f | sort)
          test -n "$FILES" || { echo "::error::corpus is empty; the sweep would be vacuous"; exit 1; }

          # ~keep The sanitizer environment is attached to the ts-pack invocation alone. As
          # step-level `env:` it also applied to the shell, `python3`, `find`, `grep`, `cat` and
          # `tee` -- every one of them running uninstrumented with the runtime `LD_PRELOAD`ed
          # into it while `exitcode=42` was in force. An ASan diagnosis in any of those would
          # have been counted as a scanner finding, and one raised by the corpus generator above
          # would have killed the step before a single parse ran. Nothing here needs the
          # sanitizer except ts-pack.
          SANITIZER_ENV=(
            "ASAN_OPTIONS=detect_leaks=0:abort_on_error=0:exitcode=$SANITIZER_EXIT_CODE"
            "UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1:exitcode=$SANITIZER_EXIT_CODE"
            "LD_PRELOAD=$ASAN_RUNTIME"
          )

          runs=0
          failures=0
          timeouts=0
          for lang in $(echo "$LANGS" | tr ',' ' '); do
            for f in $FILES; do
              runs=$((runs + 1))
              rc=0
              # ~keep `set -uo pipefail` above does NOT clear errexit: GitHub runs every `run:`
              # block under `bash --noprofile --norc -e -o pipefail`, and this step sets no
              # `shell:`. Without `|| rc=$?` the sanitizer's own exit 42 aborts the step on the
              # spot, so `rc` is never read, the `::error::` line below never prints and
              # `sweep.err` is never shown: runs 33488384849 and 33606137406 emitted no step
              # output at all between `##[endgroup]` and `Process completed with exit code 42`,
              # so a real finding was thrown away twice. A finding must be reported, not exited
              # on. `|| rc=$?` also keeps an ordinary non-zero parse exit from ending the sweep.
              # ~keep `timeout` sends TERM and reports 124; `--kill-after` guarantees the process
              # actually dies so the sweep cannot wedge. A timed-out parse is reported and
              # recorded but does not fail the job -- it is a performance problem, not a
              # memory-safety one, and failing on it would make the gate hostage to runner speed.
              timeout --kill-after=10s "${PARSE_TIMEOUT_SECONDS}s" \
                env "${SANITIZER_ENV[@]}" \
                target/x86_64-unknown-linux-gnu/debug/ts-pack parse "$f" --language "$lang" \
                >/dev/null 2>sweep.err || rc=$?
              if [ "$rc" = "124" ] || [ "$rc" = "137" ]; then
                timeouts=$((timeouts + 1))
                echo "::warning::$lang did not finish $f within ${PARSE_TIMEOUT_SECONDS}s"
                {
                  echo "=== TIMEOUT $lang $f after ${PARSE_TIMEOUT_SECONDS}s ==="
                  echo
                } >>sanitizer-findings.log
                continue
              fi
              # ~keep The stderr pattern is the backstop for when the sanitizer does not get to
              # honour `exitcode`. UBSan reaching a fatal signal prints
              # `ERROR: UndefinedBehaviorSanitizer: BUS ...` after a `DEADLYSIGNAL` line and, on
              # a platform where `abort_on_error` defaults to 1, raises SIGABRT instead of
              # exiting 42 -- the agda indent-stack underflow fixed in `patches/agda/` did
              # exactly that. Matching only `Address|Leak` and `runtime error:` let that whole
              # class through. A parse killed by any signal is likewise a finding: the crash is
              # the result, whether or not a sanitizer got to describe it.
              if [ "$rc" = "$SANITIZER_EXIT_CODE" ] || [ "$rc" -ge 128 ] \
                || grep -qE 'ERROR: (Address|Leak|UndefinedBehavior)Sanitizer|DEADLYSIGNAL|runtime error:' sweep.err; then
                failures=$((failures + 1))
                echo "::error::sanitizer fired on $lang with $f (exit $rc)"
                # ~keep `sweep.err` is truncated by the next parse, so the report has to be
                # copied into a file that survives the loop and gets uploaded.
                {
                  echo "=== $lang $f (exit $rc) ==="
                  cat sweep.err
                  echo
                } | tee -a sanitizer-findings.log
              fi
            done
          done

          echo "::notice::$runs parse invocations across ${{ steps.select.outputs.count }} language(s), $timeouts timed out"
          test "$runs" -gt 0 || { echo "::error::zero parses ran; the sweep proved nothing"; exit 1; }
          test "$failures" -eq 0 || { echo "::error::$failures sanitizer findings"; exit 1; }

      # ~keep `sanitizer-findings.log` is the only durable copy of a sweep report: `sweep.err`
      # is overwritten by the next parse and the step log is the wrong place to read a
      # multi-frame ASan stack from. Upload it alongside the build log.
      - name: Upload build log and sanitizer findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sanitize-build-log-${{ github.run_id }}
          path: |
            build.log
            sanitizer-findings.log
          retention-days: 7
          if-no-files-found: warn
