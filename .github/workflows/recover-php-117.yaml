name: Recover PHP publication for 1.17.0

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: recover-php-117
  cancel-in-progress: false

env:
  RELEASE_RUN: "34390078000"
  RELEASE_SHA: "72a6c3cb0a8e5117c91fe93b63aadf6009dfac98"

jobs:
  validate-source:
    runs-on: ubuntu-latest
    steps:
      - name: Validate original release and successful PHP gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN}" > source.json
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN}/jobs?filter=latest&per_page=100" > jobs.json
          python3 - <<'PY'
          import json
          import os
          run = json.load(open("source.json"))
          expected = (34390078000, "xberg-io/tree-sitter-language-pack", "release", ".github/workflows/publish.yaml",
                      os.environ["RELEASE_SHA"], "v1.17.0", "completed")
          actual = (run["id"], run["repository"]["full_name"], run["event"], run["path"],
                    run["head_sha"], run["head_branch"], run["status"])
          assert actual == expected, "Unexpected source release run"
          jobs = [job for page in json.load(open("jobs.json")) for job in page["jobs"]]
          successful = {job["name"] for job in jobs if job["conclusion"] == "success"}
          assert "E2E gate — PHP" in successful, "Original PHP E2E gate did not pass"
          assert len([name for name in successful if name.startswith("Build PHP PIE binary (")]) == 15
          failures = {job["name"] for job in jobs if job["conclusion"] not in {"success", "skipped"}}
          expected_failures = {f"Build PHP PIE binary (php{v} macos-x86_64)" for v in ("8.2", "8.3", "8.4")}
          assert failures == expected_failures | {"Aggregate release status"}, failures
          PY

  build-missing:
    needs: validate-source
    runs-on: macos-15-intel
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Preserve recovery tooling
        run: cp scripts/ci/build-php-source.sh "$RUNNER_TEMP/build-php-source.sh"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: language-parsers
          path: parsers
          run-id: ${{ env.RELEASE_RUN }}
          github-token: ${{ github.token }}
      - name: Build PHP development tools
        env:
          PHP_SERIES: ${{ matrix.php }}
        run: bash "$RUNNER_TEMP/build-php-source.sh" "$PHP_SERIES" "$RUNNER_TEMP/php-$PHP_SERIES"
      - uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: recover-php-117-${{ matrix.php }}
          toolchain: stable
      - uses: xberg-io/actions/install-alef@v1
        with:
          version: "0.85.11"
      - name: Build original release extension
        id: extension
        uses: xberg-io/actions/build-php-extension@v1
        with:
          crate-name: ts-pack-core-php
          lib-name: ts_pack_core_php
          php-version: ${{ matrix.php }}
          php-ts: nts
          alef-version: "0.85.11"
      - name: Load recovered extension
        env:
          EXTENSION_PATH: ${{ steps.extension.outputs.extension-path }}
        run: |
          php -n -d "extension=$EXTENSION_PATH" -r \
            'exit(extension_loaded("tree_sitter_language_pack") && phpversion("tree_sitter_language_pack") === "1.17.0" ? 0 : 1);'
      - uses: xberg-io/actions/package-php-pie@v1
        with:
          php-version: ${{ matrix.php }}
          php-ts: nts
          target: x86_64-apple-darwin
          version: "1.17.0"
          output-dir: dist/php-package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recovered-php-${{ matrix.php }}
          path: dist/php-package/php_*.tgz*
          if-no-files-found: error

  publish-missing:
    needs: build-missing
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: php-package-*
          path: packages
          merge-multiple: true
          run-id: ${{ env.RELEASE_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: recovered-php-*
          path: packages
          merge-multiple: true
      - name: Verify and upload complete PHP archive set
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          archives = sorted([*Path("packages").glob("*.tgz"), *Path("packages").glob("*.zip")])
          assert len(archives) == 18, f"Expected 18 PHP platform archives, got {len(archives)}"
          for archive in archives:
              expected = Path(f"{archive}.sha256").read_text().split()[0]
              assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected, archive
          PY
          # Preserve existing bytes if a previous recovery stopped after uploading.
          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          import tempfile
          from pathlib import Path
          release = json.loads(subprocess.check_output(
              ["gh", "release", "view", "v1.17.0", "--json", "assets,isDraft"], text=True))
          assert release["isDraft"] is False, "Expected an already public release"
          existing = {asset["name"] for asset in release["assets"]}
          for asset in sorted(Path("packages").iterdir()):
              if asset.name in existing:
                  with tempfile.TemporaryDirectory() as directory:
                      subprocess.run(["gh", "release", "download", "v1.17.0", "--pattern", asset.name,
                                      "--dir", directory], check=True)
                      downloaded = Path(directory) / asset.name
                      assert hashlib.sha256(downloaded.read_bytes()).digest() == hashlib.sha256(asset.read_bytes()).digest(), asset
              else:
                  subprocess.run(["gh", "release", "upload", "v1.17.0", str(asset)], check=True)
          PY
      - name: Publish PHP to Packagist
        uses: xberg-io/actions/publish-packagist@v1
        with:
          packagist-username: Goldziher
          package-name: xberg-io/tree-sitter-language-pack
          version: "1.17.0"
          repository-url: https://github.com/xberg-io/tree-sitter-language-pack
        env:
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
