name: CI E2E c-ffi

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: short
  BUILD_PROFILE: ci

jobs:
  test-c-ffi:
    name: Test C FFI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT_ROOT: ${{ github.workspace }}
      TSLP_LANGUAGES: "python,rust,javascript,typescript,go,html,css,json,gherkin"
      TSLP_LINK_MODE: static
      LD_LIBRARY_PATH: ${{ github.workspace }}/target/release
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Wire e2e manifest
        uses: ./.github/actions/wire-e2e-manifest
        with:
          platform-label: linux-x86_64
          artifact-name: e2e-bundles-linux-x86_64

      - name: Download parsers
        uses: actions/download-artifact@v8
        with:
          name: language-parsers
          path: parsers

      - name: Download FFI artifacts
        uses: actions/download-artifact@v8
        with:
          name: ffi-ubuntu-latest
          path: ffi-artifacts

      - name: Stage FFI for e2e
        shell: bash
        run: |
          mkdir -p test_apps/c/ffi/include test_apps/c/ffi/lib
          cp ffi-artifacts/target/release/libts_pack_core_ffi.* test_apps/c/ffi/lib/ 2>/dev/null || true
          cp -r ffi-artifacts/crates/ts-pack-core-ffi/include/* test_apps/c/ffi/include/ 2>/dev/null || true
          echo "ALEF_FFI_LOCAL_DIR=$PWD/test_apps/c/ffi" >> "$GITHUB_ENV"

      # ~keep rust is a mise lock gap (rustup script install); rust-toolchain.toml pins it.
      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          components: ""
          use-sccache: "false"
          install-llvm-cov: "false"

      - name: Setup mise
        uses: xberg-io/actions/setup-mise@v1
        with:
          install: "false"

      - name: Install alef
        uses: xberg-io/actions/install-alef@v1

      - name: Install poly
        uses: Goldziher/poly@v0
        with:
          version: "0.31.2"

      - name: Generate C E2E tests
        run: mise run c:e2e:generate

      - name: Build and run C E2E tests
        run: mise run c:e2e:test
