name: CI E2E elixir

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: short
  BUILD_PROFILE: ci

jobs:
  test-elixir:
    name: Test Elixir
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT_ROOT: ${{ github.workspace }}
      TSLP_LANGUAGES: "python,rust,javascript,typescript,go,html,css,json,bash"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Wire e2e manifest
        uses: ./.github/actions/wire-e2e-manifest
        with:
          platform-label: linux-x86_64
          artifact-name: e2e-bundles-linux-x86_64

      - name: Download parsers
        uses: actions/download-artifact@v8
        with:
          name: language-parsers
          path: parsers

      # ~keep rust is a mise lock gap (rustup script install); rust-toolchain.toml pins it.
      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          components: ""
          use-sccache: "false"
          install-llvm-cov: "false"

      # ~keep BEAM stays on its setup action until evaluated for mise (org toolchain policy).
      - name: Setup Elixir
        uses: xberg-io/actions/setup-elixir@v1
        with:
          elixir-version: "1.17"
          otp-version: "27.2"

      - name: Setup mise
        uses: xberg-io/actions/setup-mise@v1
        with:
          install: "false"

      - name: Cache Elixir dependencies
        uses: actions/cache@v6
        with:
          path: |
            packages/elixir/deps
            packages/elixir/_build
          key: elixir-deps-${{ runner.os }}-${{ hashFiles('packages/elixir/mix.lock') }}
          restore-keys: |
            elixir-deps-${{ runner.os }}-

      - name: Install Elixir dependencies
        run: mise run elixir:deps

      - name: Patch Rustler --cfg flag placement
        working-directory: packages/elixir
        run: |
          sed -i 's/args ++ \["--cfg", "build_#{System.system_time(:millisecond)}"\]/args ++ ["--", "--cfg", "build_#{System.system_time(:millisecond)}"]/' deps/rustler/lib/rustler/compiler.ex
          mix deps.compile rustler --force

      - name: Compile Elixir (warnings as errors)
        working-directory: packages/elixir
        env:
          MIX_ENV: test
          TSLP_BUILD: "1"
          TREE_SITTER_LANGUAGE_PACK_BUILD: "1"
        run: mix compile --warnings-as-errors

      - name: Run Elixir tests
        run: mise run elixir:test
        env:
          TSLP_BUILD: "1"

      - name: Install alef
        uses: xberg-io/actions/install-alef@v1

      - name: Install poly
        uses: Goldziher/poly@v0
        with:
          version: "0.31.2"

      - name: Generate Elixir E2E tests
        run: mise run elixir:e2e:generate

      - name: Install Elixir E2E dependencies
        working-directory: e2e/elixir
        run: mix deps.get

      - name: Run Elixir E2E tests
        run: mise run elixir:e2e:test
        env:
          TSLP_BUILD: "1"
          MIX_ENV: test
