[build-system]
requires = ['hatchling>=1.27']
build-backend = 'hatchling.build'

[project]
name = 'tree-sitter-language-pack-hermes-plugin'
version = '1.23.0'
description = 'Parse and extract code intelligence from 372 programming languages with tree-sitter — structure, imports, symbols, and syntax-aware chunking.'
license = 'MIT'
requires-python = '>=3.11'
dependencies = ['mcp==1.28.1', 'PyYAML==6.0.3']
keywords = ['tree-sitter', 'code-intelligence', 'parsing', 'chunking', 'static-analysis']

[project.readme]
content-type = 'text/markdown'
text = "# tree-sitter-language-pack Hermes plugin\n\nParse and extract code intelligence from 372 programming languages with tree-sitter — structure, imports, symbols, and syntax-aware chunking.\n\nInstall this package in the same Python environment as Hermes Agent:\n\n```sh\npython -m pip install tree-sitter-language-pack-hermes-plugin\n```\n\nEnable the plugin through Hermes Agent's plugin configuration. Available registrations depend on the plugin's authored Hermes adapter.\n"

[project.entry-points]
[project.entry-points.'hermes_agent.plugins']
tree-sitter-language-pack = 'tree_sitter_language_pack_hermes_plugin'

[project.urls]
Homepage = 'https://xberg.io'
Repository = 'https://github.com/xberg-io/tree-sitter-language-pack'

[tool]
[tool.hatch]
[tool.hatch.build]
[tool.hatch.build.targets]
[tool.hatch.build.targets.wheel]
packages = ['src/tree_sitter_language_pack_hermes_plugin']
