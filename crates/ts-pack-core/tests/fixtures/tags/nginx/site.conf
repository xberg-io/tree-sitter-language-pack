server {
    listen 80;
    server_name example.com www.example.com;
    return 301 https://example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name example.com;
    set $app_root /srv/www;

    location / {
        root $app_root;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://app.internal:8080;
    }
}
