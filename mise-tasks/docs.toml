# Documentation tasks, included from mise.toml [task_config]. ~keep

["docs:generate:languages"]
description = "Generate supported languages documentation from language_definitions.json"
sources = ["sources/language_definitions.json"]
outputs = ["docs-site/src/content/docs/languages.md"]
run = "uv run --no-sync scripts/generate_grammar_table.py"

["docs:generate:grammar-table"]
description = "Generate the per-grammar query-bundle README partial"
sources = ["sources/language_definitions.json", "parsers/*/queries/*.scm"]
outputs = ["templates/readme/partials/grammar_table.md"]
run = "uv run --no-sync scripts/generate_grammar_table.py --mode queries --output templates/readme/partials/grammar_table.md"
