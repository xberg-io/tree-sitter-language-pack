baseline = "v1.11.0"
task_sets = [
  "alef",
  "alef-bindings",
  "alef-publish",
  "alef-version",
  "bats-lib",
  "bats-suite",
  "deps-refresh",
  "docs-site",
  "docs-snippets",
  "governance",
  "governance-check",
  "lint-format",
  "plugin",
  "plugin-runtime",
  "rust",
]

[overrides.pnpm]
version = "12.3.4"
reason = "package.json packageManager pins pnpm 12.3.4, which wrote pnpm-lock.yaml; move both together"

[overrides.zig]
version = "0.16.0"
reason = "packages/zig and test_apps/zig target the Zig 0.16 API; CI builds and snippet checks pin 0.16.0"

[overrides.rust]
version = "1.95"
reason = "rust-toolchain.toml pins channel 1.95; move it with any lint fixes a newer clippy demands"
