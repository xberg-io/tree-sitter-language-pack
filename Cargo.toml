[workspace]
members = ["crates/*", "packages/dart/rust", "packages/swift/rust"]
exclude = [
    "e2e/rust",
    "packages/elixir/native/tree_sitter_language_pack_nif",
    "packages/ruby/ext/ts_pack_core_rb/native",
    "test_apps/rust",
]
resolver = "2"

[workspace.package]
version = "1.25.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/xberg-io/tree-sitter-language-pack"
authors = [
  "Na'aman Hirschfeld <naaman@xberg.io>",
  "Tobias Perlstein <tobias@xberg.io>",
]
keywords = ["tree-sitter", "parser", "syntax", "language-pack", "xberg"]

[workspace.dependencies]
ahash = { version = "0.8", default-features = false, features = ["std", "compile-time-rng", "serde"] }
axum = { version = "0.8", features = ["macros"] }
cc = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
criterion = { version = "0.8", features = ["html_reports"] }
dirs = "7"
fd-lock = "4"
libloading = "0.9"
memchr = "2"
rmcp = { version = "3.10", features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
    "server-side-http",
] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "0.27"
tree-sitter-language = "0.1.9"
ureq = { version = "3", features = ["platform-verifier", "socks-proxy"] }
zstd = "0.14"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
duplicated_attributes = "allow"
# Diagnostics belong in `tracing`, not raw stdout/stderr writes. CLI data output and
# build-script `cargo:` directives opt back in locally with `#[expect(clippy::print_stdout)]`. ~keep
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

[workspace.lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(alef)'] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true

[profile.dev]
opt-level = 0
debug = true
